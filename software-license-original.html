    <!-- OfficeFlow One 세션 브릿지 -->
    <script>
        const OFFICEFLOW_STORAGE_KEY = 'officeflow-one-embed-session';
        const LEGACY_OFFICEFLOW_STORAGE_KEY = 'officeflow-one-mvp-state';

        function getOfficeFlowState() {
            try {
                const raw =
                    window.localStorage.getItem(OFFICEFLOW_STORAGE_KEY) ||
                    window.localStorage.getItem(LEGACY_OFFICEFLOW_STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (error) {}

            return null;
        }

        const officeflowState = getOfficeFlowState();
        const officeflowSession = officeflowState?.session?.authenticated ? officeflowState.session : null;
        const officeflowUid = String(officeflowSession?.uid || '').trim();
        const officeflowEmail = String(officeflowSession?.email || '').toLowerCase();
        const licenseUserKey = (officeflowUid || officeflowEmail || 'guest').replace(/[^a-z0-9]+/gi, '_');

        // 허브 로그인 사용자별로 데이터를 분리한다. firestore.rules 의
        // ownsApp(appId, 'ofw-software-license') 규칙과 짝을 이룬다.
        window.licenseAppId = `ofw-software-license-${licenseUserKey}`;
        window.officeflowSessionInfo = { uid: officeflowUid, email: officeflowEmail, authenticated: Boolean(officeflowSession) };
    </script>

        // 모든 문서는 artifacts/{licenseAppId}/public/data/{컬렉션} 아래에 저장된다.
        const scopedSegments = (col) => ['artifacts', window.licenseAppId, 'public', 'data', col];
        const licenseCollection = (db, col) => collection(db, ...scopedSegments(col));
        const licenseDoc = (db, col, id) => doc(db, ...scopedSegments(col), id);

        window.firebaseModules = {
            initializeApp, getAuth, onAuthStateChanged,
            getFirestore, collection, addDoc, getDocs, onSnapshot, doc, deleteDoc, updateDoc, query, orderBy, setDoc, getDoc,
            getAnalytics,
            licenseCollection, licenseDoc

        // --- Utils ---
        // --- 계약 관리 상수/헬퍼 ---
        const DEFAULT_USD_KRW = 1400;

        const RENEWAL_STATUSES = [
            { value: 'review',   label: '검토중',   cls: 'bg-slate-100 text-slate-700' },
            { value: 'renew',    label: '갱신예정', cls: 'bg-blue-100 text-blue-700' },
            { value: 'increase', label: '증액',     cls: 'bg-purple-100 text-purple-700' },
            { value: 'decrease', label: '감액',     cls: 'bg-amber-100 text-amber-700' },
            { value: 'cancel',   label: '해지예정', cls: 'bg-red-100 text-red-700' },
        ];

        const getRenewalStatus = (value) =>
            RENEWAL_STATUSES.find((s) => s.value === value) || null;

        const EMPTY_LICENSE_FORM = {
            name: '', type: 'Subscription', paymentCycle: 'Yearly',
            seats: 1, cost: 0, currency: 'KRW',
            startDate: '', expiryDate: '',
            autoRenew: false, noticeDays: 30,
            renewalStatus: 'review',
            vendor: '', vendorContact: '', manager: '',
        };

        // 날짜 문자열을 시:분 절삭한 Date 로. 실패하면 null.
        const toDateOnly = (dateStr) => {
            if (!dateStr) return null;
            const d = new Date(`${dateStr}T00:00:00`);
            return Number.isNaN(d.getTime()) ? null : d;
        };

        const todayDateOnly = () => {
            const t = new Date();
            t.setHours(0, 0, 0, 0);
            return t;
        };

        const diffDaysFromToday = (dateStr) => {
            const d = toDateOnly(dateStr);
            if (!d) return null;
            return Math.floor((d.getTime() - todayDateOnly().getTime()) / 86400000);
        };

        // 자동갱신 계약은 해지 통보 마감일이 실질 마감이다.
        // 만료일에서 통보 기한(일)만큼 앞당긴 날짜를 돌려준다.
        const getNoticeDeadline = (license) => {
            if (!license || !license.autoRenew) return null;
            const exp = toDateOnly(license.expiryDate);
            if (!exp) return null;
            const days = parseInt(license.noticeDays);
            if (Number.isNaN(days) || days <= 0) return null;
            const deadline = new Date(exp.getTime() - days * 86400000);
            const y = deadline.getFullYear();
            const m = String(deadline.getMonth() + 1).padStart(2, '0');
            const d = String(deadline.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        // 실제로 챙겨야 하는 날짜: 자동갱신이면 통보 마감일, 아니면 만료일
        const getActionDate = (license) => getNoticeDeadline(license) || license.expiryDate || '';

        const normalizeCurrency = (c) => (c === 'USD' ? 'USD' : 'KRW');

        const toKrw = (amount, currency, fxRate) => {
            const value = parseInt(amount) || 0;
            return normalizeCurrency(currency) === 'USD'
                ? Math.round(value * (parseInt(fxRate) || DEFAULT_USD_KRW))
                : value;
        };

        const formatMoney = (amount, currency) => {
            const value = parseInt(amount) || 0;
            return normalizeCurrency(currency) === 'USD'
                ? '$' + value.toLocaleString()
                : value.toLocaleString() + '원';
        };

        // 구독 계약 1건의 월 환산 원화 비용
        const monthlyKrwCost = (license, fxRate) => {
            if (license.type !== 'Subscription') return 0;
            const krw = toKrw(license.cost, license.currency, fxRate);
            return license.paymentCycle !== 'Monthly' ? Math.round(krw / 12) : krw;
        };

        const downloadCSV = (data, filename) => {
            const bom = "\uFEFF";
            const csvContent = bom + data.map(e => e.join(",")).join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", filename);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        const parseCSV = (rawText) => {
            const text = String(rawText || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) return [];

            const parseLine = (line) => {
                const result = [];
                let current = '';
                let inQuotes = false;

                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    if (ch === '"') {
                        if (inQuotes && line[i + 1] === '"') {
                            current += '"';
                            i++;
                        } else {
                            inQuotes = !inQuotes;
                        }
                    } else if (ch === ',' && !inQuotes) {
                        result.push(current);
                        current = '';
                    } else {
                        current += ch;
                    }
                }
                result.push(current);
                return result.map(cell => cell.replace(/^\uFEFF/, '').trim());
            };

            return lines.map(parseLine);
        };

        const getSortClass = (key, currentConfig) => {
            if (currentConfig.key !== key) return "sort-icon cursor-pointer hover:bg-gray-100 select-none";
            return `sort-icon cursor-pointer hover:bg-gray-100 select-none ${currentConfig.direction === 'asc' ? 'sort-asc' : 'sort-desc'}`;
        };

        // Custom Sort: Hangul Priority > English/Others
        const koreanSort = (a, b, key, direction) => {
            const valA = String(a[key] || '').trim();
            const valB = String(b[key] || '').trim();
            
            const isHangul = (text) => /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(text);
            const isHangulA = isHangul(valA);
            const isHangulB = isHangul(valB);

            let comparison = 0;
            
            if (isHangulA && !isHangulB) {
                comparison = -1; 
            } else if (!isHangulA && isHangulB) {
                comparison = 1;
            } else {
                comparison = valA.localeCompare(valB, 'ko', { numeric: true });
            }

            return direction === 'asc' ? comparison : -comparison;
        };

        // --- Custom Hook ---
        function useFirebase() {
            const [services, setServices] = useState(null);
            const [user, setUser] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                let mounted = true;
                const init = async () => {
                    const sdkTimeout = setTimeout(() => {
                        if (mounted && !window.firebaseModules) {
                            setErrorMsg("Firebase SDK 로딩 시간 초과 (네트워크/차단 확인 필요)");
                        }
                    }, 5000);

                    while (!window.firebaseModules) {
                        await new Promise(r => setTimeout(r, 100));
                        if (!mounted) return;
                    }
                    clearTimeout(sdkTimeout);

                    const { initializeApp, getAuth, onAuthStateChanged, getFirestore, getAnalytics } = window.firebaseModules;
                    const firebaseConfig = window.userFirebaseConfig;

                    try {
                        const connTimeout = setTimeout(() => {
                            if (mounted && !user) {
                                setErrorMsg("서버 연결 응답 없음 (네트워크 방화벽 이슈 또는 로그인 세션 만료)");
                            }
                        }, 10000);

                        if (!window._firebaseAppInstance) {
                            window._firebaseAppInstance = initializeApp(firebaseConfig);
                        }
                        const app = window._firebaseAppInstance;
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        try { getAnalytics(app); } catch(e) {}

                        // OfficeFlow One 허브에서 이미 Google 로그인한 세션을 그대로 승계한다.
                        // 별도 익명 로그인은 하지 않는다 (허브는 Google 로그인만 허용).
                        onAuthStateChanged(auth, (u) => {
                            if (!mounted) return;
                            clearTimeout(connTimeout);
                            if (u) {
                                setUser(u);
                                setServices({ db, auth });
                            } else {
                                setErrorMsg("OfficeFlow One 로그인 세션을 찾지 못했습니다. 허브에서 Google 로그인 후 다시 실행해 주세요.");
                            }
                        }, (err) => {
                            clearTimeout(connTimeout);
                            setErrorMsg(`인증 오류: ${err.message}`);
                        });

                    } catch (err) {
                        console.error("Firebase init failed", err);
                        setErrorMsg(`초기화 오류: ${err.message}. Project ID(${firebaseConfig.projectId})가 유효한지 확인하세요.`);
                    }
                };
                init();
                return () => { mounted = false; };
            }, []);

            return { services, user, errorMsg };
        }

        // --- 내비게이션 정의 (사이드바와 모바일 하단바가 공유) ---
        const NAV_GROUPS = [
            { title: '운영', items: [
                { id: 'dashboard',   label: '대시보드',      short: '홈',     Icon: Icons.Dashboard },
                { id: 'renewals',    label: '갱신 캘린더',   short: '갱신',   Icon: Icons.Calendar },
                { id: 'assignments', label: '매칭 현황',     short: '매칭',   Icon: Icons.Link },
            ]},
            { title: '자산', items: [
                { id: 'users',    label: '인원 관리',      short: '인원',     Icon: Icons.Users },
                { id: 'licenses', label: '라이선스 관리',  short: '라이선스', Icon: Icons.License },
            ]},
            { title: '관리', items: [
                { id: 'audit',    label: '감사 로그', short: '로그', Icon: Icons.History },
                { id: 'settings', label: '환경설정', short: '설정', Icon: Icons.Settings },
            ]},
        ];

        const NAV_ITEMS = NAV_GROUPS.flatMap(g => g.items);

        // --- UI Components ---
        function NavButton({ active, onClick, icon, label }) {
            return (
                <button onClick={onClick} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-all ${active ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}`}>
                    {icon}<span className="font-medium">{label}</span>
                </button>
            );
        }

        function StatCard({ title, value, subtext, color="blue", alert=false, onClick, actionIcon }) {
            const borderColorClassMap = {
                blue: 'border-blue-500',
                indigo: 'border-indigo-500',
                purple: 'border-purple-500',
                emerald: 'border-emerald-500',
                orange: 'border-orange-500',
                gray: 'border-gray-500'
            };
            const borderColorClass = borderColorClassMap[color] || borderColorClassMap.blue;
            return (
                <div onClick={onClick} className={`glass-panel p-6 border-l-4 ${alert ? 'border-red-500' : borderColorClass} ${onClick ? 'cursor-pointer hover:bg-gray-50 transition-colors group tooltip-container' : ''} relative`}>
                    <div className="flex justify-between items-start">
                        <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider">{title}</h3>
                        {onClick && <span className="text-gray-400 group-hover:text-blue-500 transition-colors">{actionIcon || <Icons.Info/>}</span>}
                    </div>
                    <div className="mt-2"><span className={`text-3xl font-bold ${alert ? 'text-red-600' : 'text-gray-900'}`}>{value}</span></div>

                    {onClick && <div className="tooltip-text">연간 결제는 12로 나누어 월 예상 금액에 합산됩니다. (월간 명시된 항목 제외 모두 연간으로 간주)</div>}
                </div>
            );
        }

        // OfficeFlow One 통합판에서는 Firebase 연결 정보를 앱에서 바꿀 수 없다.
        // 항상 officeflow-one 프로젝트에 붙고, 데이터는 로그인 계정별로 분리된다.
        function SetupBanner() {
            return (
                <div className="bg-amber-100 border-b border-amber-200 text-amber-900 px-4 py-3 flex items-center justify-between shadow-sm">
                    <div className="flex items-center gap-3"><div className="text-amber-600"><Icons.CloudOff /></div><p className="text-sm font-bold">데모 모드 (클라우드 연결 안 됨 · 이 브라우저에서만 임시 저장)</p></div>

                </div>

        }

        function LoginScreen({ onLogin }) {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [checking, setChecking] = useState(false);
            const handleSubmit = async (e) => {
                e.preventDefault(); setChecking(true); setError('');
                const isValid = await onLogin(password);
                if (!isValid) { setError('비밀번호가 올바르지 않습니다.'); setChecking(false); }
            };
            return (
                <div className="flex flex-col items-center justify-center h-screen bg-slate-900 text-white">
                    <div className="w-full max-w-md p-8 bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl border border-white/10 animate-fade-in">
                        <div className="text-center mb-8"><h1 className="text-3xl font-bold mb-2">SLMS</h1><p className="text-slate-300 text-sm">Software License Management System</p></div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <input type="password" className="w-full bg-slate-800 border border-slate-600 rounded-lg py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="비밀번호 입력" value={password} onChange={e=>setPassword(e.target.value)} autoFocus />
                            {error && <p className="text-red-400 text-xs text-center">{error}</p>}
                            <button type="submit" disabled={checking} className="w-full bg-blue-600 py-3 rounded-lg font-bold hover:bg-blue-500 transition-colors">{checking ? '확인 중...' : '접속하기'}</button>
                        </form>
                    </div>
                </div>
            );
        }

        function CostDetailModal({ licenses, onClose, fxRate }) {
            const details = useMemo(() => {
                return licenses
                    .filter(l => l.type === 'Subscription')
                    .map(l => {
                        const isMonthly = l.paymentCycle === 'Monthly';
                        return {
                            ...l,
                            monthlyCost: monthlyKrwCost(l, fxRate),
                            originalCost: parseInt(l.cost) || 0,
                            isMonthly,
                        };
                    })
                    .sort((a, b) => b.monthlyCost - a.monthlyCost);
            }, [licenses, fxRate]);

            const total = details.reduce((acc, curr) => acc + curr.monthlyCost, 0);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full overflow-hidden flex flex-col max-h-[80vh]" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b flex justify-between items-center bg-gray-50">
                            <h3 className="font-bold text-lg text-gray-800 flex items-center gap-2"><Icons.CreditCard /> 월 예상 구독 비용 산출 내역</h3>
                            <button onClick={onClose} className="hover:bg-gray-200 p-1 rounded transition-colors"><Icons.XMark/></button>
                        </div>
                        <div className="p-4 bg-blue-50 text-sm text-blue-800 border-b border-blue-100">
                            <p className="font-bold mb-1">💡 계산 방식 안내</p>
                            <ul className="list-disc pl-5 space-y-1 text-xs">
                                <li><strong>연간(Yearly) 결제:</strong> 입력된 금액 ÷ 12개월 (반올림)</li>
                                <li><strong>월간(Monthly) 결제:</strong> 입력된 금액 그대로 합산</li>
                                <li>* '월간'으로 명시되지 않은 모든 항목은 '연간'으로 간주하여 계산됩니다.</li>
                                <li><strong>USD 계약:</strong> 환율 {(parseInt(fxRate)||DEFAULT_USD_KRW).toLocaleString()}원 기준으로 원화 환산 후 합산</li>
                            </ul>
                        </div>
                        <div className="flex-1 overflow-y-auto custom-scroll">
                            <table className="w-full text-sm text-left">
                                <thead className="bg-gray-100 text-xs uppercase text-gray-500 sticky top-0">
                                    <tr>
                                        <th className="p-3">SW 명</th>
                                        <th className="p-3 text-center">결제 주기</th>
                                        <th className="p-3 text-right">입력 금액 (총액)</th>
                                        <th className="p-3 text-right text-blue-600 font-bold">월 환산 금액</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-100">
                                    {details.map(item => (
                                        <tr key={item.id} className="hover:bg-gray-50">
                                            <td className="p-3 font-medium">{item.name}</td>
                                            <td className="p-3 text-center">
                                                <span className={`px-2 py-1 rounded text-xs ${!item.isMonthly ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'}`}>
                                                    {!item.isMonthly ? '연간' : '월간'}
                                                </span>
                                            </td>
                                            <td className="p-3 text-right text-gray-500">
                                                {formatMoney(item.originalCost, item.currency)}
                                                {normalizeCurrency(item.currency) === 'USD' && <div className="text-[10px] text-gray-400">환산 {toKrw(item.originalCost, 'USD', fxRate).toLocaleString()}원</div>}
                                            </td>
                                            <td className="p-3 text-right font-bold text-gray-900">{item.monthlyCost.toLocaleString()}원</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-4 bg-gray-50 border-t flex justify-between items-center">
                            <span className="text-sm text-gray-500">총 {details.length}개 항목 합계</span>
                            <span className="text-xl font-bold text-emerald-600">₩{total.toLocaleString()}</span>
                        </div>
                    </div>
                </div>
            );
        }

        // --- Feature Screens ---
        function DashboardPage({ users, licenses, assignments, onDownloadReport, fxRate }) {
            const [showCostDetail, setShowCostDetail] = useState(false);
            const [alertWindow, setAlertWindow] = useState(30);

            // [FIXED] 정확한 월 구독 비용 계산 로직 적용 (수량 곱하기 제거, 총액 입력 가정)
            // [LOGIC UPDATE] 'Monthly'가 아니면 무조건 'Yearly'로 취급 (데이터 누락 시 안전장치)
            // 통화가 섞여 있으므로 모두 원화로 환산한 뒤 월 단위로 합산한다.
            const totalCost = useMemo(
                () => licenses.reduce((acc, license) => acc + monthlyKrwCost(license, fxRate), 0),
                [licenses, fxRate]
            );

            const totalSeats = useMemo(() => licenses.reduce((a, c) => a + (parseInt(c.seats)||0), 0), [licenses]);
            const util = totalSeats > 0 ? Math.round((assignments.length / totalSeats) * 100) : 0;
            
            // 챙겨야 하는 날짜를 기준으로 계산한다.
            // 자동갱신 계약은 만료일이 아니라 '해지 통보 마감일'이 실질 마감이다.
            const dated = useMemo(() => licenses
                .map(l => {
                    const actionDate = getActionDate(l);
                    const dDay = diffDaysFromToday(actionDate);
                    if (dDay === null) return null;
                    return { ...l, actionDate, dDay, isNotice: Boolean(getNoticeDeadline(l)) };
                })
                .filter(Boolean), [licenses]);

            const expiringSoon = useMemo(() => dated
                .filter(l => l.dDay >= 0 && l.dDay <= alertWindow)
                .map(l => ({ ...l, severity: l.dDay <= 7 ? 'critical' : 'warning' }))
                .sort((a, b) => a.dDay - b.dDay), [dated, alertWindow]);

            // 이미 지난 건은 기존에 화면에서 아예 빠져 있었다. 별도로 보여준다.
            const overdue = useMemo(() => dated
                .filter(l => l.dDay < 0)
                .sort((a, b) => a.dDay - b.dDay), [dated]);

            const deptStats = useMemo(() => {
                const c = {};
                assignments.forEach(a => { const u = users.find(x => x.id === a.userId); if (u?.dept) c[u.dept] = (c[u.dept] || 0) + 1; });
                return Object.entries(c).sort((a,b) => b[1]-a[1]).slice(0, 5);
            }, [assignments, users]);

            const typeStats = useMemo(() => {
                const c = { Subscription: 0, Perpetual: 0, Free: 0 };
                licenses.forEach(l => { if(c[l.type] !== undefined) c[l.type]++; });
                return c;
            }, [licenses]);

            const recent = useMemo(() => [...assignments].filter(a=>a.assignedAt).sort((a,b)=>new Date(b.assignedAt)-new Date(a.assignedAt)).slice(0, 5), [assignments]);
            const unused = useMemo(() => licenses.filter(l => !assignments.some(a=>a.licenseId === l.id)).slice(0, 5), [licenses, assignments]);

            return (
                <div className="space-y-6 animate-fade-in">
                    {showCostDetail && <CostDetailModal licenses={licenses} onClose={() => setShowCostDetail(false)} fxRate={fxRate} />}
                    
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">현황 대시보드</h2>
                        <button onClick={onDownloadReport} className="text-sm bg-slate-700 text-white px-3 py-1.5 rounded flex items-center gap-1 hover:bg-slate-800 w-fit">
                            <Icons.Download /> 운영 리포트 CSV
                        </button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <StatCard title="등록된 인원" value={`${users.length}명`} subtext="전체 임직원" color="indigo" />
                        <StatCard title="관리중인 SW" value={`${licenses.length}개`} subtext="활성 계약" color="purple" />
                        
                        {/* 상세 보기 클릭 기능 추가 */}
                        <StatCard 
                            title="월 예상 구독 비용" 
                            value={`₩${totalCost.toLocaleString()}`} 
                            subtext="클릭하여 산출 내역 보기" 
                            color="emerald" 
                            onClick={() => setShowCostDetail(true)}
                            actionIcon={<Icons.PieChart/>}
                        />
                        
                        <StatCard title="라이선스 활용률" value={`${util}%`} subtext={`${assignments.length}/${totalSeats} 시트`} color="orange" />
                    </div>
                    {overdue.length > 0 && (
                        <div className="bg-slate-800 text-white rounded-lg p-4">
                            <h4 className="font-bold text-sm mb-1 flex items-center gap-2"><Icons.Alert/> 기한 경과 ({overdue.length}건)</h4>
                            <p className="text-[11px] text-slate-300 mb-3">이미 마감일이 지났습니다. 갱신 여부를 즉시 확인하세요.</p>
                            <div className="flex flex-wrap gap-2">
                                {overdue.map(l => (
                                    <div key={l.id} className="bg-slate-700 px-3 py-1.5 rounded text-xs">
                                        <span className="font-bold mr-2">{l.name}</span>
                                        <span className="font-mono text-slate-300">{l.actionDate}</span>
                                        <span className="ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-500 text-white">
                                            {Math.abs(l.dDay)}일 경과
                                        </span>
                                        {l.isNotice && <span className="ml-1 text-[10px] text-amber-300">해지통보 기한</span>}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                    <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                            <h4 className="text-red-800 font-bold text-sm flex items-center gap-2"><Icons.Alert/> 갱신 대응 필요 (D-{alertWindow})</h4>
                            <div className="flex gap-1">
                                {[30, 60, 90].map(d => (
                                    <button
                                        key={d}
                                        onClick={() => setAlertWindow(d)}
                                        className={`px-2.5 py-1 rounded text-[11px] font-bold transition-colors ${alertWindow === d ? 'bg-red-600 text-white' : 'bg-white text-red-600 border border-red-200 hover:bg-red-100'}`}
                                    >
                                        {d}일
                                    </button>
                                ))}
                            </div>
                        </div>
                        <p className="text-[11px] text-red-500 mb-3">자동갱신 계약은 만료일이 아니라 해지 통보 마감일 기준으로 표시됩니다.</p>
                        {expiringSoon.length === 0 ? (
                            <p className="text-xs text-red-400 py-2">{alertWindow}일 이내 대응할 계약이 없습니다.</p>
                        ) : (
                            <div className="flex flex-wrap gap-2">
                                {expiringSoon.map(l => (
                                    <div key={l.id} className="bg-white px-3 py-1.5 rounded border border-red-100 text-xs shadow-sm">
                                        <span className="font-bold text-gray-700 mr-2">{l.name}</span>
                                        <span className="text-red-500 font-mono font-bold">{l.actionDate}</span>
                                        <span className={`ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold ${l.severity === 'critical' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}`}>
                                            D-{l.dDay}
                                        </span>
                                        {l.isNotice && <span className="ml-1 px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">해지통보</span>}
                                        {l.manager && <span className="ml-1 text-[10px] text-gray-400">{l.manager}</span>}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="glass-panel p-6">
                            <h3 className="font-bold text-gray-700 mb-4">라이선스 점유율</h3>
                            <div className="space-y-4 max-h-60 overflow-y-auto pr-2 custom-scroll">
                                {licenses.map(l => {
                                    const u = assignments.filter(a => a.licenseId === l.id && users.some(user => user.id === a.userId)).length;
                                    const p = Math.min((u/(parseInt(l.seats)||1))*100, 100);
                                    return <div key={l.id}><div className="flex justify-between text-xs mb-1"><span>{l.name}</span><span className="text-gray-400">{u}/{l.seats}</span></div><div className="w-full bg-gray-200 rounded-full h-2"><div className={`h-2 rounded-full ${p>90?'bg-red-500':'bg-blue-500'}`} style={{width:`${p}%`}}></div></div></div>
                                })}
                            </div>
                        </div>
                        <div className="glass-panel p-6">
                            <h3 className="font-bold text-gray-700 mb-4">최근 할당 내역</h3>
                            <table className="min-w-full text-xs text-left">
                                <thead><tr className="bg-gray-50 border-b"><th className="p-3">이름</th><th className="p-3">SW</th><th className="p-3 text-right">날짜</th></tr></thead>
                                <tbody>{recent.map(a=>(<tr key={a.id} className="border-b last:border-0 hover:bg-gray-50"><td className="p-3 font-medium">{users.find(u=>u.id===a.userId)?.name}</td><td className="p-3">{licenses.find(l=>l.id===a.licenseId)?.name}</td><td className="p-3 text-right text-gray-400">{new Date(a.assignedAt).toLocaleDateString()}</td></tr>))}</tbody>
                            </table>
                            {recent.length === 0 && <p className="text-center text-xs text-gray-400 py-8">기록 없음</p>}
                        </div>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="glass-panel p-6">
                            <h3 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Icons.PieChart /> 부서별 활용 순위</h3>
                            <div className="space-y-3">{deptStats.map(([d, c], index) => (<div key={d} className="flex justify-between items-center text-sm"><div className="flex items-center gap-2"><span className="w-5 h-5 bg-blue-50 text-blue-600 rounded flex items-center justify-center font-bold">{index+1}</span>{d}</div><span className="font-bold">{c}건</span></div>))}</div>
                        </div>
                        <div className="glass-panel p-6">
                            <h3 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Icons.Briefcase /> 계약 형태 분포</h3>
                            <div className="space-y-4 pt-2">
                                <div className="flex justify-between text-sm"><span>구독형</span><span className="font-bold text-blue-600">{typeStats.Subscription}개</span></div>
                                <div className="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden"><div className="bg-blue-500 h-full" style={{width: `${(typeStats.Subscription / (licenses.length||1))*100}%`}}></div></div>
                                <div className="flex justify-between text-sm"><span>영구형</span><span className="font-bold text-green-600">{typeStats.Perpetual}개</span></div>
                                <div className="w-full bg-gray-100 h-1.5 rounded-full overflow-hidden"><div className="bg-green-500 h-full" style={{width: `${(typeStats.Perpetual / (licenses.length||1))*100}%`}}></div></div>
                            </div>
                        </div>
                        <div className="glass-panel p-6 border-l-4 border-gray-300">

        function UserManagement({ users, onAdd, onDelete, onUpdate }) {
            const [form, setForm] = useState({ name: '', dept: '' });
            const [editId, setEditId] = useState(null);
            const [bulkText, setBulkText] = useState('');
            const [mode, setMode] = useState('single');
            const [searchTerm, setSearchTerm] = useState('');
            const [userSort, setUserSort] = useState({ key: 'name', direction: 'asc' });

            const formRef = useRef(null); 
            const nameInputRef = useRef(null);

            const sortedUsers = useMemo(() => {
                return [...users].sort((a, b) => koreanSort(a, b, userSort.key, userSort.direction));
            }, [users, userSort]);
            
            const filteredUsers = useMemo(() => {
                if (!searchTerm) return sortedUsers;
                const lowerTerm = searchTerm.toLowerCase();
                return sortedUsers.filter(u => 
                    u.name.toLowerCase().includes(lowerTerm) || 
                    (u.dept && u.dept.toLowerCase().includes(lowerTerm))
                );
            }, [sortedUsers, searchTerm]);

            const handleSort = (key) => {
                let direction = 'asc';
                if (userSort.key === key && userSort.direction === 'asc') direction = 'desc';
                setUserSort({ key, direction });
            };

            const handleSubmit = (e) => {
                e.preventDefault(); if(!form.name) return;
                if(editId) { onUpdate(editId, form); setEditId(null); } else onAdd(form);
                setForm({ name: '', dept: '' });
            };
            const handleBulk = async () => {
                const lines = bulkText.split('\n');
                for(let line of lines) { const [n,d] = line.split(/[,\t]/).map(s=>s.trim()); if(n) await onAdd({name:n, dept:d||''}); }
                setBulkText(''); setMode('single');
            };
            const handleDownload = () => {
                const data = [["이름", "부서", "가입일"], ...sortedUsers.map(u => [u.name, u.dept, u.createdAt])];
                downloadCSV(data, "users_backup.csv");
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <h2 className="text-2xl font-bold text-gray-800 flex items-center">
                            인원 등록/관리 
                            <span className="ml-2 text-sm font-normal text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full border border-gray-200">
                                (총 {users.length}명)
                            </span>
                        </h2>
                        <div className="flex gap-2 w-full md:w-auto justify-end">
                            <div className="relative w-full md:w-64">
                                <input 
                                    type="text" 
                                    placeholder="이름/부서 검색..." 
                                    className="w-full pl-8 pr-3 py-1.5 text-sm border rounded outline-none focus:ring-2 focus:ring-blue-500"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                                <span className="absolute left-2.5 top-2 text-gray-400"><Icons.Search /></span>
                            </div>
                            <button onClick={handleDownload} className="text-sm bg-green-600 text-white px-3 py-1.5 rounded flex items-center gap-1 hover:bg-green-700 whitespace-nowrap"><Icons.Download /> 엑셀</button>
                        </div>
                    </div>
                    <div className="flex gap-6 flex-col lg:flex-row">
                        <div ref={formRef} className="glass-panel p-6 w-full lg:w-1/3 h-fit transition-all duration-300">
                            <div className="flex justify-between mb-4"><h3 className="font-semibold text-gray-700">{editId ? '사원 정보 수정' : (mode==='single'?'신규 등록':'일괄 등록')}</h3>
                            {!editId && <div className="flex bg-gray-100 rounded p-1 text-xs"><button onClick={()=>setMode('single')} className={`px-2 py-1 rounded ${mode==='single'?'bg-white shadow font-bold':''}`}>개별</button><button onClick={()=>setMode('bulk')} className={`px-2 py-1 rounded ${mode==='bulk'?'bg-white shadow font-bold':''}`}>일괄</button></div>}</div>
                            {mode==='single' ? (
                                <form onSubmit={handleSubmit} className="space-y-4">
                                    <input 
                                        ref={nameInputRef}
                                        className="w-full border rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" 
                                        placeholder="이름" 
                                        value={form.name} 
                                        onChange={e=>setForm({...form,name:e.target.value})} 
                                        required
                                    />
                                    <input className="w-full border rounded px-3 py-2 text-sm outline-none" placeholder="부서" value={form.dept} onChange={e=>setForm({...form,dept:e.target.value})}/>
                                    <button className={`w-full text-white py-2 rounded text-sm font-bold ${editId ? 'bg-indigo-600' : 'bg-blue-600'}`}>{editId ? '수정 저장' : '등록'}</button>
                                    {editId && <button onClick={()=>{setEditId(null); setForm({name:'',dept:''})}} className="w-full text-xs text-gray-400">취소</button>}
                                </form>
                            ) : (
                                <div className="space-y-4"><textarea className="w-full border rounded h-32 px-3 py-2 text-sm" placeholder="이름 [탭] 부서..." value={bulkText} onChange={e=>setBulkText(e.target.value)}/><button onClick={handleBulk} className="w-full bg-green-600 text-white py-2 rounded text-sm hover:bg-green-700">일괄 등록</button></div>
                            )}

                            <table className="min-w-full text-sm text-left">
                                <thead className="bg-gray-50 border-b">
                                    <tr>
                                        <th className={`p-4 ${getSortClass('name', userSort)}`} onClick={() => handleSort('name')}>이름</th>
                                        <th className={`p-4 ${getSortClass('dept', userSort)}`} onClick={() => handleSort('dept')}>부서</th>
                                        <th className="p-4 text-center">관리</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredUsers.length > 0 ? (
                                        filteredUsers.map(u=>(<tr key={u.id} className="hover:bg-gray-50 border-b last:border-0"><td className="p-4 font-medium">{u.name}</td><td className="p-4 text-gray-600">{u.dept}</td><td className="p-4 flex justify-center gap-3">
                                            <button onClick={()=>{
                                                setEditId(u.id); 
                                                setForm({name:u.name, dept:u.dept});
                                                formRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                                setTimeout(() => nameInputRef.current?.focus(), 300);
                                            }} className="text-blue-400 hover:text-blue-600"><Icons.Edit/></button>
                                            <button onClick={()=>onDelete(u.id)} className="text-red-300 hover:text-red-500"><Icons.Trash/></button></td></tr>))
                                    ) : (
                                        <tr><td colSpan="3" className="p-8 text-center text-gray-400">검색 결과가 없습니다.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

            const handleSubmit = (e) => {
                e.preventDefault(); if(!form.name) return;
                const submitData = { ...form };
                if (submitData.type !== 'Subscription') {
                    delete submitData.paymentCycle;

                if(editId) { onUpdate(editId, submitData); setEditId(null); } else onAdd(submitData);
                setForm({ ...EMPTY_LICENSE_FORM });
            };
            
            const handleDownload = () => {
                const data = [
                    ["SW명", "계약형태", "결제주기", "수량", "통화", "비용", "월환산(원)", "시작일", "만료일", "자동갱신", "통보기한(일)", "통보마감일", "갱신상태", "공급업체", "공급업체연락처", "담당자"],
                    ...sortedLics.map(l => [
                        l.name,
                        l.type,
                        l.type === 'Subscription' ? (l.paymentCycle === 'Monthly' ? '월' : '연') : '-',
                        l.seats,
                        normalizeCurrency(l.currency),
                        l.cost,
                        monthlyKrwCost(l, fxRate),
                        l.startDate || '',
                        l.expiryDate || '',
                        l.autoRenew ? 'Y' : 'N',
                        l.autoRenew ? (l.noticeDays || '') : '',
                        getNoticeDeadline(l) || '',
                        (getRenewalStatus(l.renewalStatus) || {}).label || '',
                        l.vendor || '',
                        l.vendorContact || '',
                        l.manager || '',
                    ])
                ];
                downloadCSV(data, "licenses_backup.csv");
            };

            const handleModalSort = (key) => {
                let direction = 'asc';
                if (modalSort.key === key && modalSort.direction === 'asc') direction = 'desc';
                setModalSort({ key, direction });
            };

            const processedModalData = useMemo(() => {
                if (!viewingLicense) return [];
                
                let data = assignments
                    .filter(a => a.licenseId === viewingLicense.id)
                    .map(a => {
                        const u = users.find(user => user.id === a.userId);
                        return u ? { ...a, userName: u.name, userDept: u.dept } : null;
                    })
                    .filter(item => item !== null);

                if (modalSearch) {
                    const lower = modalSearch.toLowerCase();
                    data = data.filter(item => item.userName.toLowerCase().includes(lower) || (item.userDept && item.userDept.toLowerCase().includes(lower)));
                }

                data.sort((a, b) => {
                    if (modalSort.key === 'assignedAt') {
                        const valA = new Date(a.assignedAt || 0); 
                        const valB = new Date(b.assignedAt || 0);
                        return modalSort.direction === 'asc' ? valA - valB : valB - valA;
                    } else {
                        return koreanSort(a, b, modalSort.key, modalSort.direction);
                    }
                });

                return data;
            }, [viewingLicense, assignments, users, modalSearch, modalSort]);

                <div className="space-y-6 animate-fade-in">

                                    <button onClick={()=>{setViewingLicense(null); setModalSearch('');}} className="hover:bg-gray-200 p-1 rounded transition-colors"><Icons.XMark/></button>
                                </div>
                                <div className="p-3 border-b bg-white">
                                    <div className="relative">
                                        <input 
                                            type="text" 
                                            placeholder="이름 또는 부서 검색..." 
                                            className="w-full pl-8 pr-3 py-2 text-sm border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={modalSearch}
                                            onChange={(e) => setModalSearch(e.target.value)}
                                        />
                                        <span className="absolute left-2.5 top-2.5 text-gray-400"><Icons.Search/></span>
                                    </div>
                                </div>
                                <div className="p-0 overflow-y-auto custom-scroll flex-1">
                                    <table className="w-full text-sm text-left relative">
                                        <thead className="bg-gray-100 sticky top-0 z-10 text-xs uppercase text-gray-500 font-semibold">
                                            <tr>
                                                <th className={`p-3 ${getSortClass('userName', modalSort)}`} onClick={() => handleModalSort('userName')}>이름</th>
                                                <th className={`p-3 ${getSortClass('userDept', modalSort)}`} onClick={() => handleModalSort('userDept')}>부서</th>
                                                <th className={`p-3 text-right ${getSortClass('assignedAt', modalSort)}`} onClick={() => handleModalSort('assignedAt')}>할당일</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-gray-100">
                                            {processedModalData.length > 0 ? (
                                                processedModalData.map(item => (
                                                    <tr key={item.id} className="hover:bg-blue-50 transition-colors">
                                                        <td className="p-3 font-medium text-gray-900">{item.userName}</td>
                                                        <td className="p-3 text-gray-500">{item.userDept}</td>
                                                        <td className="p-3 text-right text-xs text-gray-400">
                                                            {item.assignedAt ? new Date(item.assignedAt).toLocaleDateString() : '-'}
                                                        </td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr><td colSpan="3" className="p-8 text-center text-gray-400">검색 결과가 없습니다.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="p-3 bg-gray-50 border-t text-xs text-right text-gray-500">
                                    총 {processedModalData.length}명
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="flex justify-between items-center"><h2 className="text-2xl font-bold text-gray-800">라이선스 관리</h2>
                    <button onClick={handleDownload} className="text-sm bg-green-600 text-white px-3 py-1.5 rounded flex items-center gap-1 hover:bg-green-700"><Icons.Download /> 엑셀 다운로드</button></div>
                    <div className="flex gap-6 flex-col lg:flex-row">
                        <div className="glass-panel p-6 w-full lg:w-1/3 h-fit">
                            <h3 className="font-semibold text-gray-700 mb-4">{editId ? 'SW 정보 수정' : '신규 SW 등록'}</h3>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <input className="w-full border rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="SW 명" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} required/>
                                <div className="grid grid-cols-2 gap-2">
                                    <select className="border rounded px-3 py-2 text-sm bg-white" value={form.type} onChange={e=>setForm({...form,type:e.target.value})}>

                                            <label className="flex items-center gap-2 text-sm cursor-pointer">
                                                <input type="radio" name="cycle" className="custom-checkbox" checked={form.paymentCycle === 'Monthly'} onChange={()=>setForm({...form, paymentCycle: 'Monthly'})} />
                                                월 정산

                                                <input type="radio" name="cycle" className="custom-checkbox" checked={form.paymentCycle !== 'Monthly'} onChange={()=>setForm({...form, paymentCycle: 'Yearly'})} />
                                                연 정산
                                            </label>
                                        </div>
                                    </div>

                                <div className="grid grid-cols-3 gap-2">
                                    <select className="border rounded px-2 py-2 text-sm bg-white" value={form.currency} onChange={e=>setForm({...form,currency:e.target.value})}>

                                    <input type="number" className="col-span-2 border rounded px-3 py-2 text-sm" placeholder="단가" value={form.cost} onChange={e=>setForm({...form,cost:parseInt(e.target.value)||0})}/>

                                        <td className="px-4 py-4 text-xs text-gray-500">
                                            <div className="font-medium text-gray-700 whitespace-nowrap">~ {l.expiryDate || '-'}</div>
                                            <div className="text-[10px] text-gray-400 whitespace-nowrap">시작 {l.startDate || '-'}</div>
                                            {l.autoRenew && (
                                                <div className="text-[10px] mt-1 font-bold text-amber-600">
                                                    <div>자동갱신</div>
                                                    <div className="whitespace-nowrap">통보 {notice || '-'}</div>
                                                </div>
                                            )}
                                            {actionDDay !== null && actionDDay >= 0 && actionDDay <= 30 && (
                                                <div className="text-[10px] mt-0.5 font-bold text-red-600">D-{actionDDay}</div>
                                            )}
                                            {actionDDay !== null && actionDDay < 0 && (
                                                <div className="text-[10px] mt-0.5 font-bold text-red-600">{Math.abs(actionDDay)}일 경과</div>
                                            )}
                                        </td>
                                        <td className="px-4 py-4 whitespace-nowrap"><div className="flex justify-center gap-3"><button onClick={()=>{setEditId(l.id); setForm({ ...EMPTY_LICENSE_FORM, ...l, paymentCycle: l.paymentCycle || 'Yearly' })}} className="text-blue-400"><Icons.Edit/></button><button onClick={()=>onDelete(l.id)} className="text-red-300"><Icons.Trash/></button></div></td>
                                    </tr>)
                                })}</tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AssignmentManagement = ({ users, licenses, assignments, onAssign, onUnassign }) => {
            const [selUser, setSelUser] = useState('');
            const [selLics, setSelLics] = useState(new Set());
            const [userSearch, setUserSearch] = useState('');
            const [listSearch, setListSearch] = useState('');
            const [listSort, setListSort] = useState({ key: 'name', direction: 'asc' });
            const [recommendSort, setRecommendSort] = useState(true);

            const sortedLics = useMemo(() => [...licenses].sort((a,b)=>a.name.localeCompare(b.name, 'ko')), [licenses]);
            const sortedLicsForPanel = useMemo(() => {
                if (!recommendSort) return sortedLics;
                return [...sortedLics].sort((a, b) => {
                    const aUsed = assignments.filter(x => x.licenseId === a.id && users.some(u => u.id === x.userId)).length;
                    const bUsed = assignments.filter(x => x.licenseId === b.id && users.some(u => u.id === x.userId)).length;
                    const aRemain = (parseInt(a.seats) || 0) - aUsed;
                    const bRemain = (parseInt(b.seats) || 0) - bUsed;
                    if (bRemain !== aRemain) return bRemain - aRemain;
                    return a.name.localeCompare(b.name, 'ko');
                });
            }, [recommendSort, sortedLics, assignments, users]);
            const filteredUsersForSelect = useMemo(() => {
                const term = userSearch.toLowerCase();
                return users
                    .filter(u =>
                        (u.name || '').toLowerCase().includes(term) ||
                        (u.dept || '').toLowerCase().includes(term)
                    )
                    .sort((a,b)=>a.name.localeCompare(b.name, 'ko'));
            }, [users, userSearch]);
            const grouped = useMemo(() => { const g={}; assignments.forEach(a=>{if(!g[a.userId])g[a.userId]=[]; g[a.userId].push(a)}); return g; }, [assignments]);
            
            const displayedUserIds = useMemo(() => {
                let ids = Object.keys(grouped).filter(uid => { 
                    const u = users.find(u => u.id === uid);
                    if (!u) return false;
                    
                    const lowerSearch = listSearch.toLowerCase();
                    if ((u.name || '').toLowerCase().includes(lowerSearch) || (u.dept || '').toLowerCase().includes(lowerSearch)) return true;
                    
                    const userAssignments = grouped[uid] || [];
                    const hasSW = userAssignments.some(a => {
                        const lName = licenses.find(l => l.id === a.licenseId)?.name;
                        return lName && lName.toLowerCase().includes(lowerSearch);
                    });
                    
                    return hasSW;
                });

                ids.sort((a, b) => {
                    const uA = users.find(u => u.id === a);
                    const uB = users.find(u => u.id === b);
                    if (!uA || !uB) return 0;
                    
                    return koreanSort(uA, uB, listSort.key, listSort.direction);
                });

                return ids;
            }, [grouped, users, listSearch, licenses, listSort]);

            const handleAssign = async () => {
                let success = 0;
                const failed = [];
                for (let lid of selLics) {
                    const result = await onAssign({ userId: selUser, licenseId: lid });
                    if (result && result.ok === false) failed.push(result.message || '알 수 없는 오류');
                    else success++;
                }
                setSelLics(new Set());
                if (failed.length > 0) {
                    alert(`할당 완료 ${success}건 / 실패 ${failed.length}건\n- ${failed.slice(0, 5).join('\n- ')}`);
                }
            };
            const toggleLic = (l, assigned, full) => {
                if(assigned) { const target = assignments.find(a=>a.userId===selUser&&a.licenseId===l.id); if(target && confirm(`${l.name} 라이선스를 회수하시겠습니까?`)) onUnassign(target.id); }
                else if(!full) { const s=new Set(selLics); s.has(l.id)?s.delete(l.id):s.add(l.id); setSelLics(s); }
                else alert(`${l.name}은(는) 가용 수량이 없습니다.`);
            };
            const handleSort = (key) => {
                let direction = 'asc';
                if (listSort.key === key && listSort.direction === 'asc') direction = 'desc';
                setListSort({ key, direction });
            };

            const handleDownload = () => {
                const data = [["사용자", "부서", "보유 SW"]];
                displayedUserIds.forEach(uid => {
                    const u = users.find(u => u.id === uid);
                    if (u) {
                        const swList = (grouped[uid] || [])
                            .map(a => licenses.find(l => l.id === a.licenseId)?.name || '')
                            .filter(name => name !== '')
                            .sort((a, b) => a.localeCompare(b, 'ko'))
                            .join(", ");
                        data.push([u.name, u.dept, swList]);
                    }
                });
                downloadCSV(data, "assignments_backup.csv");
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex justify-between items-end"><h2 className="text-2xl font-bold">매칭 현황</h2>
                    <div className="flex gap-2">
                        <button onClick={handleDownload} className="text-sm bg-green-600 text-white px-3 py-1.5 rounded flex items-center gap-1 hover:bg-green-700"><Icons.Download /> 엑셀 다운로드</button>
                        <div className="relative"><input type="text" placeholder="사용자 또는 SW명 검색..." className="pl-8 pr-3 py-1.5 text-sm border rounded outline-none focus:ring-2 focus:ring-blue-500 w-64" value={listSearch} onChange={e=>setListSearch(e.target.value)} /><span className="absolute left-2.5 top-2 text-gray-400"><Icons.Search /></span></div>
                    </div></div>
                    <div className="glass-panel p-6">
                        <div className="flex flex-col md:flex-row gap-6 h-[450px]">
                            <div className="flex-1 flex flex-col gap-2">
                                <label className="text-xs font-bold text-gray-500">1. 사용자 선택</label>
                                <input className="border rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-emerald-500" placeholder="이름/부서 검색..." value={userSearch} onChange={e=>setUserSearch(e.target.value)} />
                                <div className="border rounded bg-white overflow-y-auto custom-scroll flex-1">{filteredUsersForSelect.map(u=>(<div key={u.id} onClick={()=>setSelUser(u.id)} className={`px-4 py-3 text-sm cursor-pointer border-b hover:bg-emerald-50 transition-colors ${selUser===u.id?'bg-emerald-50 border-emerald-200 text-emerald-700 font-bold':''}`}>{u.name} ({u.dept})</div>))}</div>
                            </div>
                            <div className="flex-1 flex flex-col gap-2">
                                <div className="flex items-center justify-between">
                                    <label className="text-xs font-bold text-gray-500">2. 라이선스 선택 (보유 중 재클릭 시 회수)</label>
                                    <button onClick={() => setRecommendSort(v => !v)} className="text-[11px] px-2 py-1 border rounded bg-white hover:bg-gray-50">
                                        {recommendSort ? '추천정렬 ON' : '추천정렬 OFF'}
                                    </button>
                                </div>
                                <div className="border rounded bg-white overflow-y-auto custom-scroll flex-1 p-1 space-y-1">
                                    {sortedLicsForPanel.map(l=>{
                                        const uCount=assignments.filter(a=>a.licenseId===l.id && users.some(u=>u.id===a.userId)).length;
                                        const has=assignments.some(a=>a.userId===selUser&&a.licenseId===l.id);
                                        const ful=uCount>=l.seats;
                                        const sel=selLics.has(l.id);
                                        return (<div key={l.id} onClick={()=>toggleLic(l, has, ful)} className={`p-3 rounded text-sm cursor-pointer border flex justify-between transition-all ${has?'bg-emerald-50 border-emerald-300 hover:border-red-400':sel?'bg-emerald-50 border-emerald-500 ring-1 ring-emerald-500':'bg-white border-gray-100 hover:border-emerald-300'}`}>
                                            <div>{l.name} <span className="text-[10px] text-gray-400 ml-1">{uCount}/{l.seats}</span></div>
                                            <div className="font-bold text-xs">{has?'보유중(회수)':ful?'수량부족':sel?<Icons.Check/>:''}</div>
                                        </div>)
                                    })}
                                </div>
                            </div>
                        </div>
                        <button onClick={handleAssign} disabled={!selUser||selLics.size===0} className={`w-full mt-4 py-3 rounded text-white font-bold transition-colors ${!selUser||selLics.size===0?'bg-gray-300':'bg-emerald-600 hover:bg-emerald-700'}`}>할당 실행</button>
                    </div>
                    <div className="glass-panel overflow-hidden">
                        <table className="min-w-full text-sm text-left">
                            <thead className="bg-gray-50 border-b">
                                <tr>
                                    <th className={`p-4 ${getSortClass('name', listSort)}`} onClick={()=>handleSort('name')}>사용자</th>
                                    <th className={`p-4 ${getSortClass('dept', listSort)}`} onClick={()=>handleSort('dept')}>부서</th>
                                    <th className="p-4">보유 SW (가나다순)</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">{displayedUserIds.map(uid => {
                                const u = users.find(u => u.id === uid); if (!u) return null;
                                const userAss = [...grouped[uid]].sort((a, b) => {
                                    const aName = licenses.find(l => l.id === a.licenseId)?.name || '';
                                    const bName = licenses.find(l => l.id === b.licenseId)?.name || '';
                                    return aName.localeCompare(bName, 'ko');
                                });
                                return <tr key={uid} className="hover:bg-gray-50"><td className="p-4 font-medium">{u.name}</td><td className="p-4 text-gray-500">{u.dept}</td><td className="p-4"><div className="flex flex-wrap gap-2">{userAss.map(a => (<span key={a.id} onClick={()=>confirm('회수?')&&onUnassign(a.id)} className="bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs border border-indigo-100 cursor-pointer hover:bg-red-50 hover:text-red-600 transition-colors">{licenses.find(l=>l.id===a.licenseId)?.name} x</span>))}</div></td></tr>
                            })}</tbody>
                        </table>
                        {displayedUserIds.length === 0 && <p className="p-8 text-center text-gray-400">검색 결과가 없습니다.</p>}
                    </div>
                </div>
            );
        };

        // --- 감사 로그 ---
        const AUDIT_FIELD_LABELS = {
            name: '이름', dept: '부서', type: '계약형태', seats: '수량', cost: '비용',
            currency: '통화', paymentCycle: '결제주기', startDate: '시작일', expiryDate: '만료일',
            autoRenew: '자동갱신', noticeDays: '통보기한', renewalStatus: '갱신상태',
            vendor: '공급업체', vendorContact: '업체연락처', manager: '담당자',
            userId: '사용자', licenseId: '라이선스', assignedAt: '할당일',
        };

        const AUDIT_ACTIONS = {
            add: { label: '등록', cls: 'bg-blue-100 text-blue-700' },
            update: { label: '수정', cls: 'bg-amber-100 text-amber-700' },
            del: { label: '삭제', cls: 'bg-red-100 text-red-700' },
            delete: { label: '삭제', cls: 'bg-red-100 text-red-700' },
            import: { label: '가져오기', cls: 'bg-purple-100 text-purple-700' },
        };

        const AUDIT_ENTITIES = {
            users: '인원', licenses: '라이선스', assignments: '할당', settings: '설정',
        };

        const formatAuditValue = (key, value) => {
            if (value === undefined || value === null || value === '') return '없음';
            if (key === 'autoRenew') return value ? '예' : '아니오';
            if (key === 'renewalStatus') return (getRenewalStatus(value) || {}).label || String(value);
            if (key === 'cost' || key === 'seats' || key === 'noticeDays') return Number(value).toLocaleString();
            return String(value);
        };

        // before/after 스냅샷에서 실제로 바뀐 필드만 뽑는다.
        const diffAuditSnapshots = (before, after) => {
            if (!before || !after) return [];
            const keys = [...new Set([...Object.keys(before), ...Object.keys(after)])].filter(k => k !== 'id');
            return keys
                .filter(k => String(before[k] ?? '') !== String(after[k] ?? ''))
                .map(k => ({ key: k, label: AUDIT_FIELD_LABELS[k] || k, from: formatAuditValue(k, before[k]), to: formatAuditValue(k, after[k]) }));
        };

        function AuditLogPage({ auditLogs }) {
            const [search, setSearch] = useState('');
            const [entity, setEntity] = useState('all');
            const [action, setAction] = useState('all');

            const filtered = useMemo(() => {
                const lower = search.trim().toLowerCase();
                return [...auditLogs]
                    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))
                    .filter(log => {
                        if (entity !== 'all' && log.entity !== entity) return false;
                        if (action !== 'all') {
                            const normalized = log.action === 'delete' ? 'del' : log.action;
                            if (normalized !== action) return false;
                        }
                        if (!lower) return true;
                        return [log.message, log.entity, log.action, JSON.stringify(log.before || ''), JSON.stringify(log.after || '')]
                            .join(' ').toLowerCase().includes(lower);
                    });
            }, [auditLogs, search, entity, action]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">감사 로그</h2>
                            <p className="text-sm text-gray-500 mt-1">누가 언제 무엇을 바꿨는지 기록합니다. 최근 300건까지 표시됩니다.</p>
                        </div>
                        <span className="text-sm text-gray-500">{filtered.length}건</span>
                    </div>

                    <div className="glass-panel p-4 grid grid-cols-1 md:grid-cols-4 gap-3">
                        <div className="md:col-span-2 relative">
                            <input type="text" placeholder="내용 검색..." value={search} onChange={e => setSearch(e.target.value)}
                                className="w-full pl-8 pr-3 py-2 text-sm border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" />
                            <span className="absolute left-2.5 top-2.5 text-gray-400"><Icons.Search /></span>
                        </div>
                        <select value={entity} onChange={e => setEntity(e.target.value)} className="border rounded px-3 py-2 text-sm bg-white">
                            <option value="all">전체 대상</option>
                            {Object.entries(AUDIT_ENTITIES).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                        </select>
                        <select value={action} onChange={e => setAction(e.target.value)} className="border rounded px-3 py-2 text-sm bg-white">
                            <option value="all">전체 작업</option>
                            <option value="add">등록</option>
                            <option value="update">수정</option>
                            <option value="del">삭제</option>
                            <option value="import">가져오기</option>
                        </select>
                    </div>

                    <div className="glass-panel overflow-hidden">
                        {filtered.length === 0 ? (
                            <p className="p-10 text-center text-gray-400 text-sm">
                                {auditLogs.length === 0 ? '아직 기록이 없습니다.' : '조건에 맞는 기록이 없습니다.'}
                            </p>
                        ) : (
                            <div className="divide-y max-h-[640px] overflow-y-auto custom-scroll">
                                {filtered.slice(0, 300).map(log => {
                                    const act = AUDIT_ACTIONS[log.action] || { label: log.action || '-', cls: 'bg-gray-100 text-gray-600' };
                                    const changes = diffAuditSnapshots(log.before, log.after);
                                    return (
                                        <div key={log.id} className="px-5 py-4 hover:bg-gray-50">
                                            <div className="flex flex-wrap items-center gap-2 text-sm">
                                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${act.cls}`}>{act.label}</span>
                                                <span className="text-xs text-gray-500">{AUDIT_ENTITIES[log.entity] || log.entity || '-'}</span>
                                                <span className="text-gray-800">{log.message || '-'}</span>
                                                <span className="ml-auto text-xs text-gray-400 font-mono">
                                                    {log.createdAt ? new Date(log.createdAt).toLocaleString('ko-KR') : '-'}
                                                </span>
                                            </div>
                                            {changes.length > 0 && (
                                                <div className="mt-2 flex flex-wrap gap-1.5">
                                                    {changes.map(c => (
                                                        <span key={c.key} className="text-[11px] bg-gray-50 border rounded px-2 py-1 text-gray-600">
                                                            <span className="text-gray-400">{c.label}</span>{' '}
                                                            <span className="line-through text-gray-400">{c.from}</span>
                                                            <span className="mx-1 text-gray-300">→</span>
                                                            <span className="font-medium text-gray-800">{c.to}</span>
                                                        </span>
                                                    ))}
                                                </div>
                                            )}
                                            {log.action !== 'update' && (log.before || log.after) && changes.length === 0 && (
                                                <div className="mt-1.5 text-[11px] text-gray-400">
                                                    {log.action === 'del' || log.action === 'delete' ? '삭제된 항목' : '신규 항목'}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- 갱신 캘린더 ---
        // 계약이 언제 몰려 있고 그때 예산이 얼마나 필요한지 월 단위로 본다.
        function RenewalCalendarPage({ licenses, fxRate }) {
            const [monthsAhead, setMonthsAhead] = useState(12);

            // 갱신 시 나가는 돈은 연 환산으로 비교한다 (월 계약도 연 기준으로 맞춤).
            const annualKrw = (l) => monthlyKrwCost(l, fxRate) * 12;

            const rows = useMemo(() => licenses.map(l => {
                const actionDate = getActionDate(l);
                return {
                    ...l,
                    actionDate,
                    dDay: diffDaysFromToday(actionDate),
                    isNotice: Boolean(getNoticeDeadline(l)),
                    annual: annualKrw(l),
                };
            }), [licenses, fxRate]);

            const undated = useMemo(() => rows.filter(r => r.dDay === null), [rows]);
            const past = useMemo(() => rows.filter(r => r.dDay !== null && r.dDay < 0).sort((a, b) => a.dDay - b.dDay), [rows]);

            const months = useMemo(() => {
                const base = todayDateOnly();
                const buckets = [];
                for (let i = 0; i < monthsAhead; i++) {
                    const d = new Date(base.getFullYear(), base.getMonth() + i, 1);
                    buckets.push({
                        key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`,
                        year: d.getFullYear(),
                        month: d.getMonth() + 1,
                        items: [],
                    });
                }
                const index = new Map(buckets.map(b => [b.key, b]));
                rows.forEach(r => {
                    if (r.dDay === null || r.dDay < 0) return;
                    const key = String(r.actionDate).slice(0, 7);
                    const bucket = index.get(key);
                    if (bucket) bucket.items.push(r);
                });
                buckets.forEach(b => b.items.sort((x, y) => x.dDay - y.dDay));
                return buckets;
            }, [rows, monthsAhead]);

            const groupedMonths = useMemo(() => {
                const groups = [];
                months.forEach(m => {
                    const isEmpty = m.items.length === 0;
                    const last = groups[groups.length - 1];
                    if (isEmpty && last && last.empty) last.months.push(m);
                    else groups.push({ empty: isEmpty, months: [m] });
                });
                return groups;
            }, [months]);

            const upcoming = months.reduce((acc, m) => acc + m.items.length, 0);
            const upcomingCost = months.reduce((acc, m) => acc + m.items.reduce((a, i) => a + i.annual, 0), 0);
            const peak = months.reduce((best, m) => (m.items.length > (best ? best.items.length : 0) ? m : best), null);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">갱신 캘린더</h2>
                        <div className="flex gap-1">
                            {[6, 12, 24].map(m => (
                                <button key={m} onClick={() => setMonthsAhead(m)}
                                    className={`px-3 py-1.5 rounded text-xs font-bold transition-colors ${monthsAhead === m ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600 hover:bg-gray-50'}`}>
                                    {m}개월
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <StatCard title={`향후 ${monthsAhead}개월 갱신`} value={`${upcoming}건`} subtext="대응이 필요한 계약" color="blue" />
                        <StatCard title="연 환산 금액" value={`₩${upcomingCost.toLocaleString()}`} subtext="해당 기간 갱신 계약 합계" color="emerald" />
                        <StatCard title="갱신 집중 시기" value={peak && peak.items.length ? `${peak.month}월` : '-'}
                            subtext={peak && peak.items.length ? `${peak.year}년 ${peak.month}월 · ${peak.items.length}건` : '집중 구간 없음'} color="purple" />
                    </div>

                    {past.length > 0 && (
                        <div className="bg-slate-800 text-white rounded-lg p-4">
                            <h4 className="font-bold text-sm mb-1 flex items-center gap-2"><Icons.Alert /> 기한 경과 ({past.length}건)</h4>

            const [importFile, setImportFile] = useState(null);
