            const [importPreview, setImportPreview] = useState(null);
            const [fileKey, setFileKey] = useState(0);
            useEffect(() => {
                setImportPreview(null);
                setImportFile(null);
                setFileKey(prev => prev + 1);
            }, [importType]);
            const handlePw = async (e) => {
                e.preventDefault(); if(!pw.trim()) return;
                setLoading(true);
                try {
                    const { setDoc, licenseDoc } = window.firebaseModules;
                    await setDoc(licenseDoc(services.db, 'settings', 'security'), { password: pw, updatedAt: new Date().toISOString() });
                    alert("비밀번호가 변경되었습니다."); setPw('');
                } catch (e) { alert(e.message); }
                setLoading(false);
            };

            const buildImportPreview = (type, rows) => {
                if (!rows || rows.length < 2) throw new Error("유효한 데이터 행이 없습니다.");
                const headers = rows[0].map(h => (h || '').replace(/^\uFEFF/, '').trim());
                const dataRows = rows.slice(1).filter(r => r.some(c => String(c || '').trim() !== ''));
                let validCount = 0;
                const samples = [];

                if (type === 'users') {
                    const nameIdx = headers.findIndex(h => h === '이름');
                    if (nameIdx < 0) throw new Error("사용자 CSV 헤더에 '이름' 컬럼이 필요합니다.");
                    const deptIdx = headers.findIndex(h => h === '부서');
                    dataRows.forEach((r) => {
                        const name = String(r[nameIdx] || '').trim();
                        if (!name) return;
                        validCount++;
                        if (samples.length < 10) samples.push({ name, dept: deptIdx >= 0 ? String(r[deptIdx] || '').trim() : '' });
                    });
                } else if (type === 'licenses') {
                    const nameIdx = headers.findIndex(h => h === 'SW명');
                    if (nameIdx < 0) throw new Error("라이선스 CSV 헤더에 'SW명' 컬럼이 필요합니다.");
                    const typeIdx = headers.findIndex(h => h === '계약형태');
                    const seatsIdx = headers.findIndex(h => h === '수량');
                    dataRows.forEach((r) => {
                        const name = String(r[nameIdx] || '').trim();
                        if (!name) return;
                        validCount++;
                        if (samples.length < 10) samples.push({
                            name,
                            type: String(r[typeIdx] || 'Subscription').trim() || 'Subscription',
                            seats: String(r[seatsIdx] || '1').trim()
                        });
                    });
                } else {
                    throw new Error('지원하지 않는 CSV 타입입니다.');
                }

                return { headers, rows, total: dataRows.length, validCount, samples };
            };

            const handleImportFileChange = async (e) => {
                const file = e.target.files?.[0] || null;
                setImportFile(file);
                setImportPreview(null);
                if (!file) return;

                try {
                    const content = await file.text();
                    const rows = parseCSV(content);
                    const preview = buildImportPreview(importType, rows);
                    setImportPreview(preview);
                } catch (err) {
                    alert("미리보기 오류: " + err.message);
                }
            };

            const handleImport = async () => {
                if (!importFile) {
                    alert("복원할 CSV 파일을 선택하세요.");
                    return;
                }
                if (!importPreview) {
                    alert("먼저 미리보기를 확인하세요.");
                    return;

                setImporting(true);
                try {
                    const imported = await onImportCsv(importType, importPreview.rows);
                    alert(`${imported}건 복원 완료`);
                    setImportFile(null);
                    setImportPreview(null);
                    setFileKey(prev => prev + 1);
                } catch (e) {
                    alert("복원 오류: " + e.message);
                }
                setImporting(false);
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6 animate-fade-in text-gray-800">
                    <h2 className="text-2xl font-bold">환경설정</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="glass-panel p-8 h-fit">
                            <h3 className="text-lg font-semibold mb-6 flex items-center gap-2"><Icons.Lock /> 보안 설정</h3>
                            <form onSubmit={handlePw} className="space-y-4">
                                <div><label className="text-xs text-gray-500 ml-1">새 비밀번호</label><input type="text" placeholder="입력하세요" className="w-full border rounded p-3 text-sm outline-none focus:ring-2 focus:ring-blue-500" value={pw} onChange={e=>setPw(e.target.value)} required /></div>
                                <button disabled={loading} className="w-full bg-slate-800 text-white p-3 rounded font-bold hover:bg-slate-700 transition-colors">{loading?'변경중...':'비밀번호 변경'}</button>
                            </form>
                        </div>
                        <div className="glass-panel p-8">
                            <h3 className="text-lg font-semibold mb-4 flex items-center gap-2"><Icons.Settings /> 데이터 관리</h3>
                            <div className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-gray-500 mb-1 block">USD 환율 (원)</label>
                                    <div className="flex gap-2">
                                        <input
                                            type="number"
                                            min="1"
                                            className="flex-1 border rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                                            value={rateInput}
                                            onChange={(e) => setRateInput(e.target.value)}
                                        />
                                        <button
                                            type="button"
                                            disabled={savingRate}
                                            onClick={async () => {
                                                setSavingRate(true);
                                                const ok = await onSaveFxRate(rateInput);
                                                setSavingRate(false);
                                                alert(ok ? '환율을 저장했습니다.' : '환율 저장에 실패했습니다. 1 이상의 숫자인지 확인하세요.');
                                            }}
                                            className="bg-slate-800 text-white px-4 rounded text-sm font-bold hover:bg-slate-700 disabled:opacity-50"
                                        >
                                            {savingRate ? '저장중' : '저장'}
                                        </button>
                                    </div>
                                    <p className="text-[11px] text-gray-400 mt-1">USD로 등록한 구독료를 원화로 환산할 때 쓰입니다.</p>
                                </div>
                                <div className="pt-4 border-t">
                                    <label className="text-xs font-bold text-gray-500 mb-1 block">클라우드 연결</label>
                                    <div className="border rounded p-3 bg-slate-50 text-xs text-slate-600 space-y-1">
                                        <p className="flex justify-between"><span className="text-slate-400">프로젝트</span><span className="font-mono">{window.userFirebaseConfig?.projectId || '-'}</span></p>
                                        <p className="flex justify-between"><span className="text-slate-400">로그인 계정</span><span className="font-mono">{window.officeflowSessionInfo.email || '-'}</span></p>
                                        <p className="flex justify-between gap-2"><span className="text-slate-400 shrink-0">데이터 공간</span><span className="font-mono truncate">{window.licenseAppId}</span></p>
                                        <p className="pt-1 text-[11px] text-slate-400">{isDemoMode ? '데모 모드: 이 브라우저에서만 임시 저장됩니다.' : 'OfficeFlow One 로그인 계정별로 데이터가 분리 저장됩니다.'}</p>
                                    </div>
                                </div>
                                <div className="pt-4 border-t">
                                    <label className="text-xs font-bold text-gray-500 mb-1 block">CSV 복원</label>
                                    <select value={importType} onChange={(e) => setImportType(e.target.value)} className="w-full border rounded p-2 text-sm mb-2 bg-white">
                                        <option value="users">인원 CSV (users_backup.csv)</option>
                                        <option value="licenses">라이선스 CSV (licenses_backup.csv)</option>
                                    </select>
                                    <input key={fileKey} type="file" accept=".csv,text/csv" onChange={handleImportFileChange} className="w-full text-xs border rounded p-2 bg-white" />
                                    {importPreview && (
                                        <div className="mt-2 text-[11px] bg-slate-50 border border-slate-200 rounded p-2">
                                            <div className="font-bold text-slate-700 mb-1">미리보기</div>
                                            <div>총 데이터 행: <b>{importPreview.total}</b> / 유효 행: <b>{importPreview.validCount}</b></div>
                                            <div className="mt-1 text-gray-500">샘플 {importPreview.samples.length}건 표시</div>
                                            <div className="mt-2 max-h-28 overflow-y-auto bg-white border rounded">
                                                <table className="w-full text-[10px]">
                                                    <tbody>
                                                        {importPreview.samples.map((s, idx) => (
                                                            <tr key={idx} className="border-b last:border-b-0">
                                                                <td className="px-2 py-1">{s.name || '-'}</td>
                                                                <td className="px-2 py-1 text-gray-500">{s.dept || s.type || '-'}</td>
                                                                <td className="px-2 py-1 text-right text-gray-500">{s.seats || ''}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}
                                    <button onClick={handleImport} disabled={importing || loading} className={`w-full mt-2 bg-emerald-50 text-emerald-700 border border-emerald-200 p-2.5 rounded font-bold text-sm hover:bg-emerald-100 ${(importing || loading) ? 'opacity-60 cursor-not-allowed' : ''}`}>
                                        {importing ? '복원 중...' : 'CSV 복원 실행'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- Main App Component ---
        function App() {
            const { services, user, errorMsg } = useFirebase();
            // 허브에서 이미 Google 로그인을 마쳤다면 앱 자체 비밀번호 잠금은 건너뛴다.
            // 파일을 단독으로 열었을 때는 기존과 동일하게 비밀번호를 요구한다.
            const [isLocked, setIsLocked] = useState(!window.officeflowSessionInfo.authenticated);
            const [activeTab, setActiveTab] = useState('dashboard');
            const [users, setUsers] = useState([]);
            const [licenses, setLicenses] = useState([]);
            const [assignments, setAssignments] = useState([]);
            const [auditLogs, setAuditLogs] = useState([]);
            const [settingsDocs, setSettingsDocs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isDemoMode, setIsDemoMode] = useState(false);
            const [permError, setPermError] = useState(false);

            useEffect(() => {
                if (isDemoMode) { setLoading(false); return; }
                if (!services || !user) return;
                const { licenseCollection, onSnapshot } = window.firebaseModules;
                const s = (c, st, last=false) => onSnapshot(licenseCollection(services.db, c),
                    (snap) => { st(snap.docs.map(d=>({id:d.id, ...d.data()}))); if(last) setLoading(false); },
                    (err) => { if(err.code==='permission-denied') setIsDemoMode(true); if(last) setLoading(false); }
                );
                const u = s('users', setUsers);
                const l = s('licenses', setLicenses);
                const a = s('assignments', setAssignments, true);
                const logs = s('auditLogs', setAuditLogs);
                // settings 에는 비밀번호 문서가 함께 들어오므로 민감 필드는 제외하고 보관한다.
                const st = s('settings', (docs) => setSettingsDocs(docs.map(({ password, ...rest }) => rest)));
                return () => { u(); l(); a(); logs(); st(); };
            }, [services, user, isDemoMode]);

            // settings/general 문서에 저장된 USD 환율. 없으면 기본값.
            const fxRate = useMemo(() => {
                const general = settingsDocs.find(d => d.id === 'general');
                const rate = parseInt(general && general.usdToKrw);
                return Number.isNaN(rate) || rate <= 0 ? DEFAULT_USD_KRW : rate;
            }, [settingsDocs]);

            const snapshotForAudit = (col, row) => {
                if (!row) return null;
                if (col === 'users') return { id: row.id, name: row.name || '', dept: row.dept || '' };
                if (col === 'licenses') return {
                    id: row.id,
                    name: row.name || '',
                    type: row.type || '',
                    seats: parseInt(row.seats) || 0,
                    cost: parseInt(row.cost) || 0,
                    currency: normalizeCurrency(row.currency),
                    paymentCycle: row.paymentCycle || '',
                    startDate: row.startDate || '',
                    expiryDate: row.expiryDate || '',
                    autoRenew: Boolean(row.autoRenew),
                    noticeDays: parseInt(row.noticeDays) || 0,
                    renewalStatus: row.renewalStatus || '',
                    vendor: row.vendor || '',
                    vendorContact: row.vendorContact || '',
                    manager: row.manager || ''
                };
                if (col === 'assignments') return { id: row.id, userId: row.userId || '', licenseId: row.licenseId || '', assignedAt: row.assignedAt || '' };
                return row;
            };

            const rowById = (col, targetId) => {
                if (col === 'users') return users.find(x => x.id === targetId) || null;
                if (col === 'licenses') return licenses.find(x => x.id === targetId) || null;
                if (col === 'assignments') return assignments.find(x => x.id === targetId) || null;
                return null;
            };

            const addAuditLog = async (action, entity, message, meta = {}) => {
                const logData = { action, entity, message, ...meta, createdAt: new Date().toISOString() };
                if (isDemoMode) {
                    setAuditLogs(prev => [{ id: `local_log_${Date.now()}`, ...logData }, ...prev].slice(0, 200));
                    return;
                }
                try {
                    const { addDoc, licenseCollection } = window.firebaseModules;
                    await addDoc(licenseCollection(services.db, 'auditLogs'), logData);
                } catch (e) {
                    console.warn('audit log write failed', e);
                }
            };

            const handleDataOp = async (op, col, data, id) => {
                const before = snapshotForAudit(col, id ? rowById(col, id) : null);
                let createdId = id || '';
                if (isDemoMode) {
                    if (op==='update') {
                        const up = (s) => s(p => p.map(x => x.id===id ? { ...x, ...data } : x));
                        if (col==='users') up(setUsers);
                        if (col==='licenses') up(setLicenses);
                    } else {
                        const ni = {...(data||{}), id: id||'local_'+Date.now()};
                        createdId = ni.id;
                        if(col==='users') { if(op==='add')setUsers(p=>[...p,ni]); if(op==='del'){setUsers(p=>p.filter(x=>x.id!==id)); setAssignments(p=>p.filter(x=>x.userId!==id));}}
                        if(col==='licenses') { if(op==='add')setLicenses(p=>[...p,ni]); if(op==='del'){setLicenses(p=>p.filter(x=>x.id!==id)); setAssignments(p=>p.filter(x=>x.licenseId!==id));} }
                        if(col==='assignments') { if(op==='add')setAssignments(p=>[...p,ni]); if(op==='del')setAssignments(p=>p.filter(x=>x.id!==id)); }
                    }
                } else {
                    const { addDoc, deleteDoc, updateDoc, licenseDoc, licenseCollection } = window.firebaseModules;
                    if(op==='update') await updateDoc(licenseDoc(services.db, col, id), data);
                    else if(op==='add') {
                        const created = await addDoc(licenseCollection(services.db, col), data);
                        createdId = created.id;
                    }
                    else if(op==='del') await deleteDoc(licenseDoc(services.db, col, id));
                }

                const after = op === 'del' ? null : snapshotForAudit(col, { ...(before || {}), ...(data || {}), id: createdId });

                // 로그 문구는 사람이 읽을 이름으로 남긴다 (내부 id 대신).
                const opText = { add: '등록', update: '수정', del: '삭제' }[op] || op;
                let label;
                if (col === 'assignments') {
                    const source = after || before || data || {};
                    const targetUser = users.find(u => u.id === source.userId);
                    const targetLicense = licenses.find(l => l.id === source.licenseId);
                    label = `${targetUser ? targetUser.name : '알 수 없는 사용자'} · ${targetLicense ? targetLicense.name : '알 수 없는 라이선스'}`;
                } else {
                    label = (after && after.name) || (before && before.name) || (data && data.name) || createdId || '항목';
                }
                await addAuditLog(op, col, `${label} ${opText}`, { before, after });
            };

            const handleDeleteUser = async (id) => {
                const userTarget = users.find(u => u.id === id);
                const affected = assignments.filter(a => a.userId === id);
                const ok = confirm(`사용자 '${userTarget?.name || id}'를 삭제합니다.\n연관 할당 ${affected.length}건도 함께 제거됩니다.\n계속하시겠습니까?`);
                if (!ok) return;

                if (isDemoMode) {
                    setUsers(prev => prev.filter(u => u.id !== id));
                    setAssignments(prev => prev.filter(a => a.userId !== id));
                } else {
                    const { deleteDoc, licenseDoc } = window.firebaseModules;
                    await Promise.all(affected.map(a => deleteDoc(licenseDoc(services.db, 'assignments', a.id))));
                    await deleteDoc(licenseDoc(services.db, 'users', id));
                }
                await addAuditLog('delete', 'users', `user=${userTarget?.name || id}, assignments=${affected.length}`, {
                    before: snapshotForAudit('users', userTarget),
                    after: null
                });
            };

            const handleDeleteLicense = async (id) => {
                const licTarget = licenses.find(l => l.id === id);
                const affected = assignments.filter(a => a.licenseId === id);
                const ok = confirm(`라이선스 '${licTarget?.name || id}'를 삭제합니다.\n연관 할당 ${affected.length}건도 함께 제거됩니다.\n계속하시겠습니까?`);
                if (!ok) return;

                if (isDemoMode) {
                    setLicenses(prev => prev.filter(l => l.id !== id));
                    setAssignments(prev => prev.filter(a => a.licenseId !== id));
                } else {
                    const { deleteDoc, licenseDoc } = window.firebaseModules;
                    await Promise.all(affected.map(a => deleteDoc(licenseDoc(services.db, 'assignments', a.id))));
                    await deleteDoc(licenseDoc(services.db, 'licenses', id));
                }
                await addAuditLog('delete', 'licenses', `license=${licTarget?.name || id}, assignments=${affected.length}`, {
                    before: snapshotForAudit('licenses', licTarget),
                    after: null
                });
            };

            const handleAssignSafe = async ({ userId, licenseId }) => {
                const targetUser = users.find(u => u.id === userId);
                const targetLicense = licenses.find(l => l.id === licenseId);
                if (!targetUser || !targetLicense) return { ok: false, message: '사용자 또는 라이선스가 존재하지 않습니다.' };

                const duplicated = assignments.some(a => a.userId === userId && a.licenseId === licenseId);
                if (duplicated) return { ok: false, message: `${targetUser.name}: ${targetLicense.name}은 이미 할당됨` };

                const used = assignments.filter(a => a.licenseId === licenseId && users.some(u => u.id === a.userId)).length;
                const seats = parseInt(targetLicense.seats) || 0;
                if (seats > 0 && used >= seats) return { ok: false, message: `${targetLicense.name}: 가용 수량 없음 (${used}/${seats})` };

                await handleDataOp('add', 'assignments', { userId, licenseId, assignedAt: new Date().toISOString() });
                return { ok: true };
            };

            const handleSaveFxRate = async (rate) => {
                const value = parseInt(rate);
                if (Number.isNaN(value) || value <= 0) return false;
                if (isDemoMode) {
                    setSettingsDocs(prev => {
                        const rest = prev.filter(d => d.id !== 'general');
                        return [...rest, { id: 'general', usdToKrw: value }];
                    });
                    return true;
                }
                try {
                    const { setDoc, licenseDoc } = window.firebaseModules;
                    await setDoc(licenseDoc(services.db, 'settings', 'general'), { usdToKrw: value, updatedAt: new Date().toISOString() }, { merge: true });
                    await addAuditLog('update', 'settings', `USD 환율 ${value}원으로 변경`);
                    return true;
                } catch (e) {
                    console.warn('fx rate save failed', e);
                    return false;
                }
            };

            const handleImportCsv = async (type, rows) => {
                const headers = rows[0].map(h => (h || '').replace(/^\uFEFF/, '').trim());
                const dataRows = rows.slice(1).filter(r => r.some(c => String(c || '').trim() !== ''));
                let imported = 0;

                if (type === 'users') {
                    const nameIdx = headers.findIndex(h => h === '이름');
                    const deptIdx = headers.findIndex(h => h === '부서');
                    if (nameIdx < 0) throw new Error("사용자 CSV 헤더에 '이름' 컬럼이 필요합니다.");

                    for (const row of dataRows) {
                        const name = String(row[nameIdx] || '').trim();
                        if (!name) continue;
                        const dept = deptIdx >= 0 ? String(row[deptIdx] || '').trim() : '';
                        await handleDataOp('add', 'users', { name, dept, createdAt: new Date().toISOString() });
                        imported++;
                    }
                } else if (type === 'licenses') {
                    const nameIdx = headers.findIndex(h => h === 'SW명');
                    const typeIdx = headers.findIndex(h => h === '계약형태');
                    const cycleIdx = headers.findIndex(h => h === '결제주기');
                    const seatsIdx = headers.findIndex(h => h === '수량');
                    const costIdx = headers.findIndex(h => h === '비용');
                    const expiryIdx = headers.findIndex(h => h === '만료일');
                    if (nameIdx < 0) throw new Error("라이선스 CSV 헤더에 'SW명' 컬럼이 필요합니다.");

                    // 확장 컬럼은 없으면 기본값으로 넘어간다 (구버전 CSV 호환).
                    const at = (label) => headers.findIndex(h => h === label);
                    const currencyIdx = at('통화');
                    const startIdx = at('시작일');
                    const autoIdx = at('자동갱신');
                    const noticeIdx = at('통보기한(일)');
                    const statusIdx = at('갱신상태');
                    const vendorIdx = at('공급업체');
                    const vendorContactIdx = at('공급업체연락처');
                    const managerIdx = at('담당자');
                    const cell = (row, idx) => (idx >= 0 ? String(row[idx] || '').trim() : '');

                    for (const row of dataRows) {
                        const name = String(row[nameIdx] || '').trim();
                        if (!name) continue;
                        const typeValue = String(row[typeIdx] || 'Subscription').trim() || 'Subscription';
                        const cycleText = String(row[cycleIdx] || '').trim();
                        const paymentCycle = cycleText === '월' ? 'Monthly' : 'Yearly';
                        const seats = parseInt(String(row[seatsIdx] || '1').replace(/,/g, ''), 10);
                        const cost = parseInt(String(row[costIdx] || '0').replace(/,/g, ''), 10);
                        const expiryDate = String(row[expiryIdx] || '').trim();
                        const autoRenew = ['Y', 'y', 'TRUE', 'true', '예', 'O'].includes(cell(row, autoIdx));
                        const noticeDays = parseInt(cell(row, noticeIdx).replace(/,/g, ''), 10);
                        const statusLabel = cell(row, statusIdx);
                        const matchedStatus = RENEWAL_STATUSES.find(st => st.label === statusLabel);

                        const payload = {
                            name,
                            type: typeValue,
                            seats: Number.isNaN(seats) ? 1 : seats,
                            cost: Number.isNaN(cost) ? 0 : cost,
                            currency: normalizeCurrency(cell(row, currencyIdx)),
                            startDate: cell(row, startIdx),
                            expiryDate,
                            autoRenew,
                            noticeDays: Number.isNaN(noticeDays) ? 30 : noticeDays,
                            renewalStatus: matchedStatus ? matchedStatus.value : 'review',
                            vendor: cell(row, vendorIdx),
                            vendorContact: cell(row, vendorContactIdx),
                            manager: cell(row, managerIdx),
                            createdAt: new Date().toISOString()
                        };
                        if (payload.type === 'Subscription') payload.paymentCycle = paymentCycle;
                        await handleDataOp('add', 'licenses', payload);
                        imported++;
                    }
                } else {
                    throw new Error('지원하지 않는 CSV 타입입니다.');
                }

                await addAuditLog('import', type, `${imported}건 CSV 복원`);
                return imported;
            };

            const handleDownloadOpsReport = () => {
                const today = new Date().toISOString().slice(0, 10);
                const totalSeats = licenses.reduce((acc, l) => acc + (parseInt(l.seats) || 0), 0);
                const usedSeats = assignments.length;
                const util = totalSeats > 0 ? Math.round((usedSeats / totalSeats) * 100) : 0;
                const monthly = licenses.reduce((acc, l) => acc + monthlyKrwCost(l, fxRate), 0);
                // 자동갱신 계약은 해지 통보 마감일 기준으로 본다.
                const withDDay = licenses
                    .map(l => ({ l, actionDate: getActionDate(l), dDay: diffDaysFromToday(getActionDate(l)) }))
                    .filter(x => x.dDay !== null);
                const d90 = withDDay.filter(x => x.dDay >= 0 && x.dDay <= 90).sort((a, b) => a.dDay - b.dDay);
                const past = withDDay.filter(x => x.dDay < 0).sort((a, b) => a.dDay - b.dDay);
                const unused = licenses.filter(l => !assignments.some(a => a.licenseId === l.id));

                const rows = [
                    ["리포트일자", today],
                    ["등록 인원", `${users.length}`],
                    ["관리 SW", `${licenses.length}`],
                    ["총 시트", `${totalSeats}`],
                    ["사용 시트", `${usedSeats}`],
                    ["활용률", `${util}%`],
                    ["월 예상 구독비용(원)", `${monthly}`],
                    ["USD 환율(원)", `${fxRate}`],
                    [],
                    ["기한 경과", "대응 기한", "경과일", "담당자", "갱신상태"],
                    ...past.map(x => [
                        x.l.name, x.actionDate || '-', `${Math.abs(x.dDay)}일`,
                        x.l.manager || '-', (getRenewalStatus(x.l.renewalStatus) || {}).label || '-'
                    ]),
                    [],
                    ["갱신 대응 필요 (D-90)", "대응 기한", "남은일수", "구분", "담당자", "갱신상태"],
                    ...d90.map(x => [
                        x.l.name, x.actionDate || '-', `D-${x.dDay}`,
                        getNoticeDeadline(x.l) ? '해지통보 기한' : '계약 만료일',
                        x.l.manager || '-', (getRenewalStatus(x.l.renewalStatus) || {}).label || '-'
                    ]),
                    [],
                    ["유휴 라이선스", "타입", "담당자"],
                    ...unused.map(l => [l.name, l.type || '-', l.manager || '-'])
                ];
                downloadCSV(rows, `ops_report_${today}.csv`);
            };

            const handleLogin = async (pw) => {
                if (isDemoMode) return pw==='admin1234';
                try {
                    const { licenseDoc, getDoc, setDoc } = window.firebaseModules;
                    const r = licenseDoc(services.db, 'settings', 'security');
                    const s = await getDoc(r).catch(()=>null);
                    let c = 'admin1234';
                    if (s && s.exists()) c = s.data().password || 'admin1234';
                    else if (pw==='admin1234') { setIsLocked(false); return true; }
                    if (pw === c) { setIsLocked(false); return true; } return false;
                } catch (e) { return pw==='admin1234' ? (setIsLocked(false), true) : false; }
            };

            if ((!services || !user) && !isDemoMode) {
                if (errorMsg) return <div className="h-screen flex items-center justify-center p-4"><div className="bg-white p-8 rounded shadow text-center"><p className="text-red-500 mb-4">{errorMsg}</p><button onClick={()=>setIsDemoMode(true)} className="bg-blue-600 text-white px-4 py-2 rounded font-bold">데모 모드로 시작</button><button onClick={()=>window.location.reload()} className="ml-2 bg-gray-200 px-4 py-2 rounded">다시 연결</button></div></div>;
                return <div className="h-screen flex items-center justify-center"><div className="spinner"></div></div>;
            }
            if (isLocked) return <LoginScreen onLogin={handleLogin} />;

            return (
                <div className="flex h-screen overflow-hidden bg-[#f3f4f6] flex-col">
                    {isDemoMode && <SetupBanner />}
                    <div className="flex flex-1 overflow-hidden">
                        <aside className="w-64 bg-slate-900 text-white hidden md:flex flex-col shadow-2xl z-20">
                            <div className="p-6 border-b border-slate-800 font-bold text-blue-400 text-xl tracking-tight">SLMS</div>
                            <nav className="flex-1 p-4 space-y-5 overflow-y-auto custom-scroll">
                                {NAV_GROUPS.map((group, gi) => (
                                    <div key={group.title} className={gi > 0 && group.title === '관리' ? 'pt-4 border-t border-slate-800' : ''}>
                                        <p className="px-3 mb-2 text-[11px] font-bold tracking-wider text-slate-400 uppercase">{group.title}</p>
                                        <div className="space-y-2">
                                            {group.items.map(item => (
                                                <NavButton key={item.id} active={activeTab === item.id}
                                                    onClick={() => setActiveTab(item.id)}
                                                    icon={<item.Icon />} label={item.label} />
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </nav>
                        </aside>
                        <main className="flex-1 overflow-y-auto p-4 pb-24 md:p-8 md:pb-8 relative custom-scroll">
                            {loading ? <div className="flex justify-center mt-20"><div className="spinner"></div></div> : (
                                <div className="max-w-7xl mx-auto">
                                    {activeTab === 'dashboard' && <DashboardPage users={users} licenses={licenses} assignments={assignments} onDownloadReport={handleDownloadOpsReport} fxRate={fxRate} />}
                                    {activeTab === 'users' && <UserManagement users={users} onAdd={d=>handleDataOp('add','users',{...d, createdAt:new Date().toISOString()})} onDelete={handleDeleteUser} onUpdate={(id,d)=>handleDataOp('update','users',d,id)} />}
                                    {activeTab === 'licenses' && <LicenseManagement licenses={licenses} assignments={assignments} users={users} onAdd={d=>handleDataOp('add','licenses',{...d, createdAt:new Date().toISOString()})} onDelete={handleDeleteLicense} onUpdate={(id,d)=>handleDataOp('update','licenses',d,id)} fxRate={fxRate} />}
                                    {activeTab === 'assignments' && <AssignmentManagement users={users} licenses={licenses} assignments={assignments} onAssign={handleAssignSafe} onUnassign={id=>handleDataOp('del','assignments',null,id)} />}
                                    {activeTab === 'renewals' && <RenewalCalendarPage licenses={licenses} fxRate={fxRate} />}
                                    {activeTab === 'audit' && <AuditLogPage auditLogs={auditLogs} />}
                                    {activeTab === 'settings' && <SettingsPage services={services} isDemoMode={isDemoMode} onImportCsv={handleImportCsv} fxRate={fxRate} onSaveFxRate={handleSaveFxRate} />}
                                </div>
                            )}
                        </main>
                    </div>

                    {/* 모바일에서는 사이드바 대신 하단 내비를 쓴다 (경조사 앱과 동일한 패턴) */}
                    <nav className="md:hidden fixed bottom-0 inset-x-0 z-50 flex justify-around bg-white/95 backdrop-blur border-t border-slate-200 px-1 py-2 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
                        {NAV_ITEMS.map(item => (
                            <button key={item.id} onClick={() => setActiveTab(item.id)}
                                className={`flex flex-col items-center gap-1 px-1 py-1 rounded transition-colors ${activeTab === item.id ? 'text-blue-600' : 'text-slate-400'}`}>
                                <item.Icon />
                                <span className="text-[10px] font-medium leading-none">{item.short}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
