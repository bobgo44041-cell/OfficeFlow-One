    <!-- OfficeFlow One 세션 브릿지 -->
    <script>
        const OFFICEFLOW_STORAGE_KEY = 'officeflow-one-embed-session';
        const LEGACY_OFFICEFLOW_STORAGE_KEY = 'officeflow-one-mvp-state';

        function getOfficeFlowState() {
            try {
                const raw =
                    window.localStorage.getItem(OFFICEFLOW_STORAGE_KEY) ||
                    window.localStorage.getItem(LEGACY_OFFICEFLOW_STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (error) {}

            return null;
        }

        const officeflowState = getOfficeFlowState();
        const officeflowSession = officeflowState?.session?.authenticated ? officeflowState.session : null;
        const officeflowUid = String(officeflowSession?.uid || '').trim();
        const officeflowEmail = String(officeflowSession?.email || '').toLowerCase();
        const leaseUserKey = (officeflowUid || officeflowEmail || 'guest').replace(/[^a-z0-9]+/gi, '_');

        // 허브 로그인 사용자별로 데이터를 분리한다. firestore.rules 의
        // ownsApp(appId, 'ofw-lease') 규칙과 짝을 이룬다.
        window.leaseAppId = `ofw-lease-${leaseUserKey}`;
        window.officeflowSessionInfo = { uid: officeflowUid, email: officeflowEmail, authenticated: Boolean(officeflowSession) };
    </script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // 모든 문서는 artifacts/{leaseAppId}/public/data/{컬렉션} 아래에 저장된다.
        const scopedSegments = (col) => ['artifacts', window.leaseAppId, 'public', 'data', col];
        const leaseCollection = (db, col) => collection(db, ...scopedSegments(col));
        const leaseDoc = (db, col, id) => doc(db, ...scopedSegments(col), id);

        window.firebaseModules = {
            initializeApp, getAuth, onAuthStateChanged,
            getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, setDoc, getDoc,

            leaseCollection, leaseDoc

            messagingSenderId: "1084176732785",
            appId: "1:1084176732785:web:56e241ddcdb69afdf101d0",
            measurementId: "G-SYP4NQMGP7"
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 상수 ---
        const SQM_PER_PYEONG = 3.305785;

        const LEASE_USAGES = ['사무실', '창고', '매장', '공장', '주차장', '기타'];

        const RENEWAL_STATUSES = [
            { value: 'review',   label: '검토중',     cls: 'bg-slate-100 text-slate-700' },
            { value: 'renew',    label: '갱신예정',   cls: 'bg-blue-100 text-blue-700' },
            { value: 'relocate', label: '이전예정',   cls: 'bg-purple-100 text-purple-700' },
            { value: 'terminate',label: '해지예정',   cls: 'bg-red-100 text-red-700' },
        ];

        const getRenewalStatus = (value) => RENEWAL_STATUSES.find((s) => s.value === value) || null;

        const EMPTY_LEASE_FORM = {
            name: '', address: '', usage: '사무실', area: 0,
            lessorName: '', lessorContact: '',
            startDate: '', endDate: '',
            deposit: 0, monthlyRent: 0, maintenanceFee: 0,
            noticeDays: 60, renewalStatus: 'review',
            manager: '', docLink: '', memo: '',
        };

        // --- 유틸 ---
        const toDateOnly = (dateStr) => {
            if (!dateStr) return null;
            const d = new Date(`${dateStr}T00:00:00`);
            return Number.isNaN(d.getTime()) ? null : d;
        };

        const todayDateOnly = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };

        const diffDaysFromToday = (dateStr) => {
            const d = toDateOnly(dateStr);
            if (!d) return null;
            return Math.floor((d.getTime() - todayDateOnly().getTime()) / 86400000);
        };

        const toDateString = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        // 갱신 통보 마감일: 계약 종료일에서 통보 기한(일)만큼 앞당긴 날.
        // 상가건물임대차보호법상 갱신요구는 만료 6개월~1개월 전에 해야 하므로
        // 종료일보다 이 날짜가 실질 마감이다.
        const getNoticeDeadline = (lease) => {
            if (!lease) return null;
            const end = toDateOnly(lease.endDate);
            if (!end) return null;
            const days = parseInt(lease.noticeDays);
            if (Number.isNaN(days) || days <= 0) return null;
            return toDateString(new Date(end.getTime() - days * 86400000));
        };

        // 실제로 챙겨야 하는 날짜: 통보 마감일이 있으면 그것, 없으면 종료일
        const getActionDate = (lease) => getNoticeDeadline(lease) || lease.endDate || '';

        const num = (v) => parseInt(String(v).replace(/,/g, ''), 10) || 0;
        const formatKrw = (amount) => num(amount).toLocaleString() + '원';
        const formatArea = (sqm) => {
            const v = Number(sqm) || 0;
            if (!v) return '-';
            return `${v.toLocaleString()}㎡ (${(v / SQM_PER_PYEONG).toFixed(1)}평)`;
        };

        // 월 고정비 = 월 임차료 + 관리비
        const monthlyOutgo = (lease) => num(lease.monthlyRent) + num(lease.maintenanceFee);

        // 따옴표와 줄바꿈이 들어간 셀까지 처리하는 CSV 파서
        const parseCSV = (text) => {
            const clean = String(text).replace(/^\uFEFF/, '').replace(/\r\n/g, '\n');
            const rows = [];
            let row = [], cell = '', inQuotes = false;
            for (let i = 0; i < clean.length; i++) {
                const ch = clean[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (clean[i + 1] === '"') { cell += '"'; i++; }
                        else inQuotes = false;
                    } else cell += ch;
                } else if (ch === '"') inQuotes = true;
                else if (ch === ',') { row.push(cell); cell = ''; }
                else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
                else cell += ch;
            }
            if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
            return rows.filter(r => r.some(c => String(c).trim() !== ''));
        };

        const downloadCSV = (rows, filename) => {
            const csv = rows.map(r => r.map(c => {
                const v = String(c === undefined || c === null ? '' : c);
                return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
            }).join(',')).join('\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
        };

        // --- Icons ---
        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Building: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>,
            Calendar: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
            Alert: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>,
            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            XMark: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>,
            CloudOff: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3l18 18M18.364 5.636A9 9 0 015.636 18.364M12 6a6 6 0 016 6" /></svg>,
            Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
            Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>,
            History: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
            Coin: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
        };

        // --- 내비게이션 정의 (사이드바와 모바일 하단바가 공유) ---
        const NAV_GROUPS = [
            { title: '운영', items: [
                { id: 'dashboard', label: '대시보드',        short: '홈',   Icon: Icons.Dashboard },
                { id: 'renewals',  label: '갱신 일정',       short: '갱신', Icon: Icons.Calendar },
                { id: 'analysis',  label: '비용·보증금 분석', short: '분석', Icon: Icons.Chart },
            ]},
            { title: '계약', items: [
                { id: 'leases',  label: '계약 관리',   short: '계약',   Icon: Icons.Building },
                { id: 'lessors', label: '임대인 관리', short: '임대인', Icon: Icons.Users },
                { id: 'history', label: '재계약 이력', short: '이력',   Icon: Icons.Refresh },
            ]},
            { title: '관리', items: [
                { id: 'audit',    label: '감사 로그', short: '로그', Icon: Icons.History },
                { id: 'settings', label: '환경설정',  short: '설정', Icon: Icons.Settings },
            ]},
        ];

        const NAV_ITEMS = NAV_GROUPS.flatMap(g => g.items);

        // --- 분석/이력 계산 ---
        const toPyeong = (sqm) => (Number(sqm) || 0) / SQM_PER_PYEONG;

        // 평당 월 임차료. 임대차 시세 비교의 기준 지표다.
        const rentPerPyeong = (lease) => {
            const p = toPyeong(lease.area);
            return p > 0 ? Math.round(num(lease.monthlyRent) / p) : 0;
        };
        const outgoPerPyeong = (lease) => {
            const p = toPyeong(lease.area);
            return p > 0 ? Math.round(monthlyOutgo(lease) / p) : 0;
        };
        // 보증금이 월 임차료의 몇 개월치인지
        const depositMonths = (lease) => {
            const rent = num(lease.monthlyRent);
            return rent > 0 ? (num(lease.deposit) / rent) : 0;
        };

        const getHistory = (lease) => (Array.isArray(lease.history) ? lease.history : []);

        // 과거 계약 + 현재 계약을 시작일 순으로 이어 붙인다.
        const buildTermline = (lease) => {
            const terms = [
                ...getHistory(lease).map(h => ({ ...h, current: false })),
                { startDate: lease.startDate, endDate: lease.endDate, deposit: lease.deposit,
                  monthlyRent: lease.monthlyRent, maintenanceFee: lease.maintenanceFee, area: lease.area, current: true },
            ].filter(t => t.startDate || t.endDate);
            terms.sort((a, b) => String(a.startDate || '').localeCompare(String(b.startDate || '')));
            return terms.map((t, i) => {
                const prev = terms[i - 1];
                const prevRent = prev ? num(prev.monthlyRent) : 0;
                const rent = num(t.monthlyRent);
                const rate = prev && prevRent > 0 ? ((rent - prevRent) / prevRent) * 100 : null;
                const depositDiff = prev ? num(t.deposit) - num(prev.deposit) : null;
                return { ...t, rentChangeRate: rate, depositDiff };
            });
        };

        // --- 감사 로그 ---
        const AUDIT_FIELD_LABELS = {
            name: '물건명', address: '주소', usage: '용도', area: '계약면적',
            lessorName: '임대인', lessorContact: '임대인 연락처',
            startDate: '시작일', endDate: '종료일',
            deposit: '보증금', monthlyRent: '월 임차료', maintenanceFee: '월 관리비',
            noticeDays: '통보기한', renewalStatus: '갱신상태',
            manager: '담당자', docLink: '문서링크', memo: '비고',
        };

        const AUDIT_ACTIONS = {
            add:    { label: '등록',   cls: 'bg-blue-100 text-blue-700' },
            update: { label: '수정',   cls: 'bg-amber-100 text-amber-700' },
            renew:  { label: '갱신처리', cls: 'bg-emerald-100 text-emerald-700' },
            del:    { label: '삭제',   cls: 'bg-red-100 text-red-700' },
        };

        const snapshotForAudit = (lease) => {
            if (!lease) return null;
            const out = {};
            Object.keys(AUDIT_FIELD_LABELS).forEach(k => { out[k] = lease[k] === undefined ? '' : lease[k]; });
            return out;
        };

        const formatAuditValue = (key, value) => {
            if (value === undefined || value === null || value === '') return '없음';
            if (key === 'renewalStatus') return (getRenewalStatus(value) || {}).label || String(value);
            if (['deposit', 'monthlyRent', 'maintenanceFee', 'noticeDays', 'area'].includes(key)) return Number(value).toLocaleString();
            return String(value);
        };

        // before/after 에서 실제로 바뀐 필드만 뽑는다.
        const diffAuditSnapshots = (before, after) => {
            if (!before || !after) return [];
            return Object.keys(AUDIT_FIELD_LABELS)
                .filter(k => String(before[k] ?? '') !== String(after[k] ?? ''))
                .map(k => ({ key: k, label: AUDIT_FIELD_LABELS[k], from: formatAuditValue(k, before[k]), to: formatAuditValue(k, after[k]) }));
        };

        // --- 공통 UI ---
        function NavButton({ active, onClick, icon, label }) {
            return (

        // --- Firebase 연결 ---
        function useFirebase() {
            const [services, setServices] = useState(null);
            const [user, setUser] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                let mounted = true;
                const init = async () => {
                    const sdkTimeout = setTimeout(() => {
                        if (mounted && !window.firebaseModules) setErrorMsg('Firebase SDK 로딩 시간 초과 (네트워크/차단 확인 필요)');
                    }, 5000);

                    while (!window.firebaseModules) {
                        await new Promise(r => setTimeout(r, 100));
                        if (!mounted) return;
                    }
                    clearTimeout(sdkTimeout);

                    const { initializeApp, getAuth, onAuthStateChanged, getFirestore, getAnalytics } = window.firebaseModules;

                    try {
                        const connTimeout = setTimeout(() => {
                            if (mounted && !user) setErrorMsg('서버 연결 응답 없음 (네트워크 방화벽 이슈 또는 로그인 세션 만료)');
                        }, 10000);

                        if (!window._firebaseAppInstance) window._firebaseAppInstance = initializeApp(window.userFirebaseConfig);
                        const app = window._firebaseAppInstance;
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        try { getAnalytics(app); } catch (e) {}

                        // OfficeFlow One 허브에서 Google 로그인한 세션을 그대로 승계한다.
                        onAuthStateChanged(auth, (u) => {
                            if (!mounted) return;
                            clearTimeout(connTimeout);
                            if (u) { setUser(u); setServices({ db, auth }); }
                            else setErrorMsg('OfficeFlow One 로그인 세션을 찾지 못했습니다. 허브에서 Google 로그인 후 다시 실행해 주세요.');
                        }, (err) => { clearTimeout(connTimeout); setErrorMsg(`인증 오류: ${err.message}`); });
                    } catch (err) {
                        console.error('Firebase init failed', err);
                        setErrorMsg(`초기화 오류: ${err.message}`);
                    }
                };
                init();
                return () => { mounted = false; };
            }, []);

            return { services, user, errorMsg };
        }

                                                </div>
                                                {l.address && <p className="text-xs text-gray-500 mt-1">{l.address}</p>}
                                            </div>
                                            <div className="flex items-center gap-3 shrink-0">
                                                <button onClick={() => onRenew(l)} title="갱신 처리"
                                                    className="flex items-center gap-1 text-xs font-bold text-emerald-600 border border-emerald-200 bg-emerald-50 px-2.5 py-1 rounded hover:bg-emerald-100">
                                                    <Icons.Refresh /> 갱신 처리
                                                </button>
                                                <button onClick={() => startEdit(l)} className="text-blue-400 hover:text-blue-600"><Icons.Edit /></button>
                                                <button onClick={() => onDelete(l.id)} className="text-red-300 hover:text-red-500"><Icons.Trash /></button>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-2 mt-4 text-sm">
                                            <div><p className="text-[10px] text-gray-400">계약기간</p><p className="text-gray-800">{l.startDate || '-'} ~ {l.endDate || '-'}</p></div>
                                            <div><p className="text-[10px] text-gray-400">임대면적</p><p className="text-gray-800">{formatArea(l.area)}</p></div>
                                            <div><p className="text-[10px] text-gray-400">보증금</p><p className="text-gray-800 font-medium">{formatKrw(l.deposit)}</p></div>
                                            <div><p className="text-[10px] text-gray-400">월 고정비</p><p className="text-gray-900 font-bold">{formatKrw(monthlyOutgo(l))}</p>
                                                <p className="text-[10px] text-gray-400">임차료 {formatKrw(l.monthlyRent)} · 관리비 {formatKrw(l.maintenanceFee)}</p></div>
                                            <div><p className="text-[10px] text-gray-400">임대인</p><p className="text-gray-800">{l.lessorName || '-'}</p>
                                                {l.lessorContact && <p className="text-[10px] text-gray-400">{l.lessorContact}</p>}</div>
                                            <div><p className="text-[10px] text-gray-400">담당자</p><p className="text-gray-800">{l.manager || '-'}</p></div>
                                            <div><p className="text-[10px] text-gray-400">갱신 통보 마감</p><p className="text-amber-700 font-medium">{notice || '-'}</p></div>
                                            {l.docLink && (
                                                <div><p className="text-[10px] text-gray-400">관련 문서</p>
                                                    <a href={l.docLink} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline text-xs break-all">링크 열기</a></div>
                                            )}
                                        </div>
                                        {getHistory(l).length > 0 && (
                                            <p className="mt-3 pt-3 border-t text-[11px] text-gray-400">재계약 이력 {getHistory(l).length}건 · 이력 메뉴에서 인상률을 볼 수 있습니다.</p>
                                        )}
                                        {l.memo && <p className="mt-3 pt-3 border-t text-xs text-gray-500 whitespace-pre-wrap">{l.memo}</p>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // --- 갱신 일정 ---
        function RenewalSchedulePage({ leases }) {
            const [monthsAhead, setMonthsAhead] = useState(12);

            const rows = useMemo(() => leases.map(l => {
                const actionDate = getActionDate(l);
                return { ...l, actionDate, dDay: diffDaysFromToday(actionDate), isNotice: Boolean(getNoticeDeadline(l)) };
            }), [leases]);

            const undated = useMemo(() => rows.filter(r => r.dDay === null), [rows]);
            const past = useMemo(() => rows.filter(r => r.dDay !== null && r.dDay < 0).sort((a, b) => a.dDay - b.dDay), [rows]);

            const months = useMemo(() => {
                const base = todayDateOnly();
                const buckets = [];
                for (let i = 0; i < monthsAhead; i++) {
                    const d = new Date(base.getFullYear(), base.getMonth() + i, 1);
                    buckets.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, year: d.getFullYear(), month: d.getMonth() + 1, items: [] });
                }
                const index = new Map(buckets.map(b => [b.key, b]));
                rows.forEach(r => {
                    if (r.dDay === null || r.dDay < 0) return;
                    const bucket = index.get(String(r.actionDate).slice(0, 7));
                    if (bucket) bucket.items.push(r);
                });
                buckets.forEach(b => b.items.sort((x, y) => x.dDay - y.dDay));
                return buckets;
            }, [rows, monthsAhead]);

            // 연속으로 비어 있는 달은 한 줄로 접어 스크롤 낭비를 줄인다.
            const grouped = useMemo(() => {
                const groups = [];
                months.forEach(m => {
                    const isEmpty = m.items.length === 0;
                    const last = groups[groups.length - 1];
                    if (isEmpty && last && last.empty) last.months.push(m);
                    else groups.push({ empty: isEmpty, months: [m] });
                });
                return groups;
            }, [months]);

            const upcoming = months.reduce((a, m) => a + m.items.length, 0);
            const upcomingCost = months.reduce((a, m) => a + m.items.reduce((x, i) => x + monthlyOutgo(i) * 12, 0), 0);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">갱신 일정</h2>
                        <div className="flex gap-1">
                            {[6, 12, 24].map(m => (
                                <button key={m} onClick={() => setMonthsAhead(m)}
                                    className={`px-3 py-1.5 rounded text-xs font-bold transition-colors ${monthsAhead === m ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600 hover:bg-gray-50'}`}>
                                    {m}개월
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <StatCard title={`향후 ${monthsAhead}개월 갱신`} value={`${upcoming}건`} subtext="대응이 필요한 계약" color="blue" />
                        <StatCard title="연 환산 고정비" value={`₩${upcomingCost.toLocaleString()}`} subtext="해당 기간 갱신 계약 합계" color="emerald" />
                    </div>

                    {past.length > 0 && (
                        <div className="bg-slate-800 text-white rounded-lg p-4">
                            <h4 className="font-bold text-sm mb-1 flex items-center gap-2"><Icons.Alert /> 기한 경과 ({past.length}건)</h4>
                            <p className="text-[11px] text-slate-300 mb-3">일정에 잡히기 전에 먼저 정리해야 하는 건입니다.</p>
                            <div className="space-y-1">
                                {past.map(l => (
                                    <div key={l.id} className="flex flex-wrap items-center gap-2 bg-slate-700 px-3 py-2 rounded text-xs">
                                        <span className="font-bold">{l.name}</span>
                                        <span className="font-mono text-slate-300">{l.actionDate}</span>
                                        <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-500">{Math.abs(l.dDay)}일 경과</span>
                                        {l.isNotice && <span className="text-[10px] text-amber-300">갱신통보 기한</span>}
                                        <span className="ml-auto text-slate-300">{l.manager || '담당 미지정'}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="space-y-4">
                        {grouped.map(group => {
                            if (group.empty) {
                                const first = group.months[0], last = group.months[group.months.length - 1];
                                const range = group.months.length === 1
                                    ? `${first.year}년 ${first.month}월`
                                    : `${first.year}년 ${first.month}월 ~ ${last.year}년 ${last.month}월`;
                                return (
                                    <div key={'empty-' + first.key} className="flex items-center gap-3 px-5 py-2.5 rounded-lg border border-dashed border-gray-200 text-xs text-gray-400">
                                        <span className="font-medium text-gray-500">{range}</span><span>갱신 예정 없음</span>
                                        <span className="ml-auto">{group.months.length}개월</span>
                                    </div>
                                );
                            }
                            const m = group.months[0];
                            const cost = m.items.reduce((a, i) => a + monthlyOutgo(i) * 12, 0);
                            return (
                                <div key={m.key} className="glass-panel overflow-hidden">
                                    <div className="flex flex-wrap items-center justify-between gap-2 px-5 py-3 bg-gray-50 border-b">
                                        <div className="flex items-baseline gap-2">
                                            <span className="font-bold text-gray-800">{m.year}년 {m.month}월</span>
                                            <span className="text-xs text-gray-500">{m.items.length}건</span>
                                        </div>
                                        <span className="text-xs font-bold text-emerald-600">연 환산 ₩{cost.toLocaleString()}</span>
                                    </div>
                                    <div className="divide-y">
                                        {m.items.map(l => {
                                            const status = getRenewalStatus(l.renewalStatus);
                                            return (
                                                <div key={l.id} className="flex flex-wrap items-center gap-x-3 gap-y-1 px-5 py-3 text-sm hover:bg-gray-50">
                                                    <span className="font-mono text-xs text-gray-500 w-24">{l.actionDate}</span>
                                                    <span className="font-medium text-gray-900">{l.name}</span>
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${l.isNotice ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-gray-100 text-gray-500'}`}>
                                                        {l.isNotice ? '갱신통보 기한' : '계약 종료일'}
                                                    </span>
                                                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${l.dDay <= 30 ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600'}`}>D-{l.dDay}</span>
                                                    {status && <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${status.cls}`}>{status.label}</span>}
                                                    <span className="ml-auto text-xs text-gray-400">{l.manager || '담당 미지정'}</span>
                                                    <span className="text-xs font-bold text-gray-700 w-28 text-right">{formatKrw(monthlyOutgo(l) * 12)}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {undated.length > 0 && (
                        <div className="glass-panel p-5">
                            <h4 className="font-bold text-sm text-gray-700 mb-1">기한 미설정 ({undated.length}건)</h4>
                            <p className="text-[11px] text-gray-400 mb-3">계약 종료일이 없어 일정에 잡히지 않습니다. 날짜를 채워주세요.</p>
                            <div className="flex flex-wrap gap-2">
                                {undated.map(l => <span key={l.id} className="px-3 py-1.5 rounded border text-xs text-gray-600">{l.name}</span>)}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 갱신 처리 모달 ---
        // 현재 조건을 이력으로 넘기고 새 조건을 입력받는다.
        function RenewModal({ lease, onClose, onSubmit }) {
            const [form, setForm] = useState({
                startDate: lease.endDate || '',
                endDate: '',
                deposit: lease.deposit || 0,
                monthlyRent: lease.monthlyRent || 0,
                maintenanceFee: lease.maintenanceFee || 0,
            });

            const prevRent = num(lease.monthlyRent);
            const rate = prevRent > 0 ? ((num(form.monthlyRent) - prevRent) / prevRent) * 100 : null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b flex justify-between items-center bg-gray-50">
                            <h3 className="font-bold text-gray-800">{lease.name} 갱신 처리</h3>
                            <button onClick={onClose} className="hover:bg-gray-200 p-1 rounded"><Icons.XMark /></button>
                        </div>
                        <form className="p-5 space-y-3" onSubmit={(e) => { e.preventDefault(); onSubmit(form); }}>
                            <div className="bg-slate-50 border rounded p-3 text-xs text-slate-600">
                                <p className="font-bold text-slate-700 mb-1">현재 조건 (이력으로 이동)</p>
                                <p>{lease.startDate || '-'} ~ {lease.endDate || '-'}</p>
                                <p>임차료 {formatKrw(lease.monthlyRent)} · 관리비 {formatKrw(lease.maintenanceFee)} · 보증금 {formatKrw(lease.deposit)}</p>
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">새 시작일</label>
                                    <input type="date" required className="w-full border rounded px-3 py-2 text-sm" value={form.startDate} onChange={e => setForm({ ...form, startDate: e.target.value })} /></div>
                                <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">새 종료일</label>
                                    <input type="date" required className="w-full border rounded px-3 py-2 text-sm" value={form.endDate} onChange={e => setForm({ ...form, endDate: e.target.value })} /></div>
                            </div>
                            {form.startDate && form.endDate && form.startDate > form.endDate && (
                                <p className="text-[10px] text-red-500 ml-1">시작일이 종료일보다 늦습니다.</p>
                            )}

                            <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">보증금 (원)</label>
                                <input type="number" min="0" className="w-full border rounded px-3 py-2 text-sm" value={form.deposit} onChange={e => setForm({ ...form, deposit: parseInt(e.target.value) || 0 })} /></div>
                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">월 임차료 (원)</label>
                                    <input type="number" min="0" className="w-full border rounded px-3 py-2 text-sm" value={form.monthlyRent} onChange={e => setForm({ ...form, monthlyRent: parseInt(e.target.value) || 0 })} /></div>
                                <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">월 관리비 (원)</label>
                                    <input type="number" min="0" className="w-full border rounded px-3 py-2 text-sm" value={form.maintenanceFee} onChange={e => setForm({ ...form, maintenanceFee: parseInt(e.target.value) || 0 })} /></div>
                            </div>
                            {rate !== null && (
                                <p className={`text-xs font-bold ml-1 ${rate > 0 ? 'text-red-600' : rate < 0 ? 'text-emerald-600' : 'text-gray-400'}`}>
                                    임차료 {rate > 0 ? '+' : ''}{rate.toFixed(1)}% ({formatKrw(lease.monthlyRent)} → {formatKrw(form.monthlyRent)})
                                </p>
                            )}

                            <div className="flex justify-end gap-2 pt-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-sm text-gray-500">취소</button>
                                <button type="submit" className="bg-emerald-600 text-white px-5 py-2 rounded font-bold text-sm hover:bg-emerald-700">갱신 처리</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- 비용·보증금 분석 ---
        function AnalysisPage({ leases }) {
            const [basis, setBasis] = useState('rent'); // rent | outgo

            const rows = useMemo(() => leases
                .map(l => ({
                    ...l,
                    pyeong: toPyeong(l.area),
                    unit: basis === 'rent' ? rentPerPyeong(l) : outgoPerPyeong(l),
                    months: depositMonths(l),
                }))
                .sort((a, b) => b.unit - a.unit), [leases, basis]);

            const priced = rows.filter(r => r.unit > 0);
            const avgUnit = priced.length ? Math.round(priced.reduce((a, r) => a + r.unit, 0) / priced.length) : 0;
            const totalDeposit = leases.reduce((a, l) => a + num(l.deposit), 0);
            const totalMonthly = leases.reduce((a, l) => a + monthlyOutgo(l), 0);
            const maxUnit = priced.length ? priced[0].unit : 0;

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">비용·보증금 분석</h2>
                            <p className="text-sm text-gray-500 mt-1">평당 단가로 물건 간 비용을 비교합니다.</p>
                        </div>
                        <div className="flex gap-1">
                            {[['rent', '임차료 기준'], ['outgo', '고정비 기준']].map(([v, label]) => (
                                <button key={v} onClick={() => setBasis(v)}
                                    className={`px-3 py-1.5 rounded text-xs font-bold transition-colors ${basis === v ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600 hover:bg-gray-50'}`}>
                                    {label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <StatCard title="평균 평당 단가" value={`₩${avgUnit.toLocaleString()}`} subtext={basis === 'rent' ? '월 임차료 ÷ 평' : '월 고정비 ÷ 평'} color="blue" />
                        <StatCard title="연간 고정비" value={`₩${(totalMonthly * 12).toLocaleString()}`} subtext="임차료 + 관리비 × 12" color="emerald" />
                        <StatCard title="예치 보증금" value={`₩${totalDeposit.toLocaleString()}`} subtext={`월 임차료의 약 ${totalMonthly > 0 ? (totalDeposit / Math.max(1, leases.reduce((a, l) => a + num(l.monthlyRent), 0))).toFixed(1) : '0'}개월치`} color="indigo" />
                    </div>

                    <div className="glass-panel p-6">
                        <h3 className="font-bold text-gray-700 mb-4">평당 단가 순위</h3>
                        {priced.length === 0 ? (
                            <p className="text-sm text-gray-400 py-8 text-center">면적과 임차료가 입력된 계약이 없습니다.</p>
                        ) : (
                            <div className="space-y-4">
                                {priced.map(l => {
                                    const pct = maxUnit > 0 ? Math.round((l.unit / maxUnit) * 100) : 0;
                                    const vsAvg = avgUnit > 0 ? Math.round(((l.unit - avgUnit) / avgUnit) * 100) : 0;
                                    return (
                                        <div key={l.id}>
                                            <div className="flex flex-wrap justify-between items-baseline gap-2 text-sm mb-1">
                                                <span className="font-medium text-gray-800">{l.name}
                                                    <span className="ml-2 text-[10px] text-gray-400">{l.pyeong.toFixed(1)}평 · {l.usage}</span>
                                                </span>
                                                <span className="text-gray-700">
                                                    평당 <span className="font-bold">{l.unit.toLocaleString()}원</span>
                                                    <span className={`ml-2 text-[11px] font-bold ${vsAvg > 0 ? 'text-red-600' : vsAvg < 0 ? 'text-emerald-600' : 'text-gray-400'}`}>
                                                        평균 대비 {vsAvg > 0 ? '+' : ''}{vsAvg}%
                                                    </span>
                                                </span>
                                            </div>
                                            <div className="h-2 bg-gray-100 rounded"><div className={`h-2 rounded ${vsAvg > 0 ? 'bg-red-400' : 'bg-blue-500'}`} style={{ width: pct + '%' }}></div></div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    <div className="glass-panel overflow-x-auto custom-scroll">
                        <div className="px-6 pt-6 pb-3"><h3 className="font-bold text-gray-700">보증금 예치 현황</h3></div>
                        <table className="w-full min-w-[640px] text-sm">
                            <thead className="bg-gray-50 border-y text-xs uppercase text-gray-500">
                                <tr>
                                    <th className="px-6 py-3 text-left">물건명</th>
                                    <th className="px-4 py-3 text-right">보증금</th>
                                    <th className="px-4 py-3 text-right">월 임차료</th>
                                    <th className="px-4 py-3 text-right">보증금/월세</th>
                                    <th className="px-6 py-3 text-right">비중</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {leases.length === 0 ? (
                                    <tr><td colSpan="5" className="px-6 py-10 text-center text-gray-400">등록된 계약이 없습니다.</td></tr>
                                ) : [...leases].sort((a, b) => num(b.deposit) - num(a.deposit)).map(l => (
                                    <tr key={l.id} className="hover:bg-gray-50">
                                        <td className="px-6 py-3 font-medium text-gray-800">{l.name}</td>
                                        <td className="px-4 py-3 text-right">{formatKrw(l.deposit)}</td>
                                        <td className="px-4 py-3 text-right text-gray-500">{formatKrw(l.monthlyRent)}</td>
                                        <td className="px-4 py-3 text-right text-gray-500">{depositMonths(l) > 0 ? depositMonths(l).toFixed(1) + '개월' : '-'}</td>
                                        <td className="px-6 py-3 text-right font-bold text-gray-700">{totalDeposit > 0 ? Math.round((num(l.deposit) / totalDeposit) * 100) : 0}%</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- 임대인 관리 ---
        function LessorPage({ leases }) {
            const groups = useMemo(() => {
                const map = new Map();
                leases.forEach(l => {
                    const key = (l.lessorName || '').trim() || '(임대인 미입력)';
                    if (!map.has(key)) map.set(key, { name: key, contact: '', items: [] });
                    const g = map.get(key);
                    if (!g.contact && l.lessorContact) g.contact = l.lessorContact;
                    g.items.push(l);
                });
                return [...map.values()]
                    .map(g => ({
                        ...g,
                        deposit: g.items.reduce((a, l) => a + num(l.deposit), 0),
                        monthly: g.items.reduce((a, l) => a + monthlyOutgo(l), 0),
                        nextAction: g.items

                                    <div className="text-right"><p className="text-[10px] text-gray-400">월 고정비</p><p className="font-bold text-gray-900">{formatKrw(g.monthly)}</p></div>

                            {g.nextAction && (

                                    <span className="ml-2 font-bold">{g.nextAction.dDay >= 0 ? `D-${g.nextAction.dDay}` : `${Math.abs(g.nextAction.dDay)}일 경과`}</span>

                            <div className="mt-3 pt-3 border-t flex flex-wrap gap-2">

        // --- 감사 로그 ---
        function AuditLogPage({ auditLogs }) {

            const filtered = useMemo(() => {

                        return [log.message, log.action, JSON.stringify(log.before || ''), JSON.stringify(log.after || '')]

                                                <span className="ml-auto text-xs text-gray-400 font-mono">
                                                    {log.createdAt ? new Date(log.createdAt).toLocaleString('ko-KR') : '-'}

                                            </div>

                                                <div className="mt-2 flex flex-wrap gap-1.5">

        // --- 환경설정 ---
        function SettingsPage({ isDemoMode, defaultNoticeDays, onSaveNoticeDays, onImportCsv }) {
            const [noticeInput, setNoticeInput] = useState(String(defaultNoticeDays));
            const [savingNotice, setSavingNotice] = useState(false);
            const [file, setFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [importing, setImporting] = useState(false);
            const [fileKey, setFileKey] = useState(0);

            useEffect(() => { setNoticeInput(String(defaultNoticeDays)); }, [defaultNoticeDays]);

            const handleFile = (e) => {
                const f = e.target.files[0];
                setFile(f || null);
                setPreview(null);
                if (!f) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const rows = parseCSV(reader.result);
                        if (rows.length < 2) throw new Error('데이터 행이 없습니다.');
                        const headers = rows[0].map(h => String(h).trim());
                        if (headers.indexOf('물건명') < 0) throw new Error("CSV 헤더에 '물건명' 컬럼이 필요합니다.");
                        const nameIdx = headers.indexOf('물건명');
                        const body = rows.slice(1);
                        const samples = body.map(r => String(r[nameIdx] || '').trim()).filter(Boolean);
                        setPreview({ rows, count: samples.length, samples: samples.slice(0, 8) });
                    } catch (err) {
                        setPreview({ error: err.message });
                    }
                };
                reader.readAsText(f, 'utf-8');
            };

            const runImport = async () => {
                if (!preview || preview.error || !preview.count) return;
                if (!confirm(`계약 ${preview.count}건을 추가합니다. 기존 데이터는 지워지지 않고 함께 남습니다.\n계속하시겠습니까?`)) return;
                setImporting(true);
                const added = await onImportCsv(preview.rows);
                setImporting(false);
                setFile(null); setPreview(null); setFileKey(k => k + 1);
                alert(`${added}건을 복원했습니다.`);
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">환경설정</h2>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="glass-panel p-6 h-fit">
                            <h3 className="text-lg font-semibold mb-1 flex items-center gap-2"><Icons.Calendar /> 기본 갱신 통보 기한</h3>
                            <p className="text-xs text-gray-500 mb-4">신규 계약을 등록할 때 자동으로 채워지는 값입니다. 계약마다 따로 바꿀 수 있습니다.</p>
                            <div className="flex gap-2">
                                <input type="number" min="0" className="flex-1 border rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                                    value={noticeInput} onChange={e => setNoticeInput(e.target.value)} />
                                <button type="button" disabled={savingNotice}
                                    onClick={async () => {
                                        setSavingNotice(true);
                                        const ok = await onSaveNoticeDays(noticeInput);
                                        setSavingNotice(false);
                                        alert(ok ? '저장했습니다.' : '0 이상의 숫자를 입력하세요.');
                                    }}
                                    className="bg-slate-800 text-white px-4 rounded text-sm font-bold hover:bg-slate-700 disabled:opacity-50">
                                    {savingNotice ? '저장중' : '저장'}
                                </button>
                            </div>
                            <p className="text-[11px] text-gray-400 mt-2">상가건물임대차보호법상 갱신요구는 만료 6개월~1개월 전에 해야 합니다.</p>
                        </div>

                        <div className="glass-panel p-6 h-fit">
                            <h3 className="text-lg font-semibold mb-1 flex items-center gap-2"><Icons.Download /> CSV 복원</h3>
                            <p className="text-xs text-gray-500 mb-4">계약 관리에서 내려받은 CSV 를 다시 불러옵니다. 기존 계약은 지워지지 않고 뒤에 추가됩니다.</p>
                            <input key={fileKey} type="file" accept=".csv,text/csv" onChange={handleFile}
                                className="w-full text-xs border rounded p-2 bg-white" />
                            {preview && preview.error && <p className="text-xs text-red-500 mt-2">{preview.error}</p>}
                            {preview && !preview.error && (
                                <div className="mt-3 border rounded p-3 bg-slate-50 text-xs text-slate-600">
                                    <p className="font-bold text-slate-700">{preview.count}건 확인</p>
                                    <p className="mt-1 text-[11px] text-slate-500">{preview.samples.join(', ')}{preview.count > preview.samples.length ? ' 외' : ''}</p>
                                </div>
                            )}
                            <button type="button" disabled={!preview || preview.error || importing}
                                onClick={runImport}
                                className="w-full mt-3 bg-emerald-600 text-white py-2 rounded font-bold text-sm hover:bg-emerald-700 disabled:opacity-40">
                                {importing ? '복원 중...' : 'CSV 복원 실행'}
                            </button>
                        </div>
                    </div>

                    <div className="glass-panel p-6 max-w-xl">
                        <h3 className="text-lg font-semibold mb-4 flex items-center gap-2"><Icons.Settings /> 클라우드 연결</h3>
                        <div className="border rounded p-3 bg-slate-50 text-xs text-slate-600 space-y-1">
                            <p className="flex justify-between"><span className="text-slate-400">프로젝트</span><span className="font-mono">{window.userFirebaseConfig?.projectId || '-'}</span></p>
                            <p className="flex justify-between"><span className="text-slate-400">로그인 계정</span><span className="font-mono">{window.officeflowSessionInfo.email || '-'}</span></p>
                            <p className="flex justify-between gap-2"><span className="text-slate-400 shrink-0">데이터 공간</span><span className="font-mono truncate">{window.leaseAppId}</span></p>
                            <p className="pt-1 text-[11px] text-slate-400">
                                {isDemoMode ? '데모 모드: 이 브라우저에서만 임시 저장됩니다.' : 'OfficeFlow One 로그인 계정별로 데이터가 분리 저장됩니다.'}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 메인 ---
        function App() {
            const { services, user, errorMsg } = useFirebase();
            const [activeTab, setActiveTab] = useState('dashboard');
            const [leases, setLeases] = useState([]);
            const [auditLogs, setAuditLogs] = useState([]);
            const [settingsDocs, setSettingsDocs] = useState([]);
            const [renewTarget, setRenewTarget] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isDemoMode, setIsDemoMode] = useState(false);

            useEffect(() => {
                if (isDemoMode) { setLoading(false); return; }
                if (!services || !user) return;
                const { leaseCollection, onSnapshot } = window.firebaseModules;
                const unsub = onSnapshot(leaseCollection(services.db, 'leases'),
                    (snap) => { setLeases(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setLoading(false); },
                    (err) => { if (err.code === 'permission-denied') setIsDemoMode(true); setLoading(false); }
                );
                const unsubLogs = onSnapshot(leaseCollection(services.db, 'auditLogs'),
                    (snap) => setAuditLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    () => {}
                );
                const unsubSettings = onSnapshot(leaseCollection(services.db, 'settings'),
                    (snap) => setSettingsDocs(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    () => {}
                );
                return () => { unsub(); unsubLogs(); unsubSettings(); };
            }, [services, user, isDemoMode]);

            // settings/general 에 저장된 기본 갱신 통보 기한. 없으면 폼 기본값.
            const defaultNoticeDays = useMemo(() => {
                const general = settingsDocs.find(d => d.id === 'general');
                const v = parseInt(general && general.defaultNoticeDays);
                return Number.isNaN(v) || v < 0 ? EMPTY_LEASE_FORM.noticeDays : v;
            }, [settingsDocs]);

            const handleSaveNoticeDays = async (value) => {
                const v = parseInt(value);
                if (Number.isNaN(v) || v < 0) return false;
                if (isDemoMode) {
                    setSettingsDocs(prev => [...prev.filter(d => d.id !== 'general'), { id: 'general', defaultNoticeDays: v }]);
                    return true;
                }
                try {
                    const { setDoc, leaseDoc } = window.firebaseModules;
                    await setDoc(leaseDoc(services.db, 'settings', 'general'), { defaultNoticeDays: v, updatedAt: new Date().toISOString() });
                    return true;
                } catch (e) { console.warn('notice days save failed', e); return false; }
            };

            const addAuditLog = async (action, message, before, after) => {
                const log = { action, message, before: before || null, after: after || null, createdAt: new Date().toISOString() };
                if (isDemoMode) {
                    setAuditLogs(prev => [{ id: 'local_log_' + Date.now(), ...log }, ...prev].slice(0, 300));
                    return;
                }
                try {
                    const { addDoc, leaseCollection } = window.firebaseModules;
                    await addDoc(leaseCollection(services.db, 'auditLogs'), log);
                } catch (e) { console.warn('audit log write failed', e); }
            };

            const handleAdd = async (data) => {
                const payload = { ...data, history: [], createdAt: new Date().toISOString() };
                if (isDemoMode) {
                    setLeases(prev => [...prev, { ...payload, id: 'local_' + Date.now() }]);
                } else {
                    try {
                        const { addDoc, leaseCollection } = window.firebaseModules;
                        await addDoc(leaseCollection(services.db, 'leases'), payload);
                    } catch (e) {
                        console.error('lease add failed', e);
                        alert('저장에 실패했습니다. Firestore 규칙을 확인하세요.');
                        return;
                    }
                }
                await addAuditLog('add', `${data.name} 등록`, null, snapshotForAudit(payload));
            };

            const handleUpdate = async (id, data) => {
                const before = snapshotForAudit(leases.find(l => l.id === id));
                if (isDemoMode) {
                    setLeases(prev => prev.map(l => l.id === id ? { ...l, ...data } : l));
                } else {
                    try {
                        const { updateDoc, leaseDoc } = window.firebaseModules;
                        await updateDoc(leaseDoc(services.db, 'leases', id), { ...data, updatedAt: new Date().toISOString() });
                    } catch (e) {
                        console.error('lease update failed', e);
                        alert('수정에 실패했습니다.');
                        return;
                    }
                }
                await addAuditLog('update', `${data.name} 수정`, before, snapshotForAudit(data));
            };

            const handleDelete = async (id) => {
                const target = leases.find(l => l.id === id);
                if (!confirm(`'${target?.name || id}' 계약을 삭제합니다. 계속하시겠습니까?`)) return;
                if (isDemoMode) {
                    setLeases(prev => prev.filter(l => l.id !== id));
                } else {
                    try {
                        const { deleteDoc, leaseDoc } = window.firebaseModules;
                        await deleteDoc(leaseDoc(services.db, 'leases', id));
                    } catch (e) {
                        console.error('lease delete failed', e);
                        alert('삭제에 실패했습니다.');
                        return;
                    }
                }
                await addAuditLog('del', `${target?.name || id} 삭제`, snapshotForAudit(target), null);
            };

            // 갱신 처리: 현재 조건을 history 로 밀어 넣고 새 조건으로 교체한다.
            const handleRenew = async (form) => {
                const lease = renewTarget;
                if (!lease) return;
                if (form.startDate && form.endDate && form.startDate > form.endDate) {
                    alert('시작일이 종료일보다 늦습니다.');
                    return;
                }
                const archived = {
                    id: 'term_' + Date.now(),
                    startDate: lease.startDate || '', endDate: lease.endDate || '',
                    deposit: num(lease.deposit), monthlyRent: num(lease.monthlyRent),
                    maintenanceFee: num(lease.maintenanceFee), area: Number(lease.area) || 0,
                    recordedAt: new Date().toISOString(),
                };
                const next = {
                    startDate: form.startDate, endDate: form.endDate,
                    deposit: num(form.deposit), monthlyRent: num(form.monthlyRent), maintenanceFee: num(form.maintenanceFee),
                    history: [...getHistory(lease), archived],
                    renewalStatus: 'renew',
                    updatedAt: new Date().toISOString(),
                };

                if (isDemoMode) {
                    setLeases(prev => prev.map(l => l.id === lease.id ? { ...l, ...next } : l));
                } else {
                    try {
                        const { updateDoc, leaseDoc } = window.firebaseModules;
                        await updateDoc(leaseDoc(services.db, 'leases', lease.id), next);
                    } catch (e) {
                        console.error('lease renew failed', e);
                        alert('갱신 처리에 실패했습니다.');
                        return;
                    }
                }
                const prevRent = num(lease.monthlyRent);
                const rate = prevRent > 0 ? (((num(form.monthlyRent) - prevRent) / prevRent) * 100).toFixed(1) : null;
                await addAuditLog('renew',
                    `${lease.name} 갱신 처리${rate !== null ? ` (임차료 ${rate > 0 ? '+' : ''}${rate}%)` : ''}`,
                    snapshotForAudit(lease), snapshotForAudit({ ...lease, ...next }));
                setRenewTarget(null);
            };

            // 계약 관리에서 내려받은 CSV 를 되돌린다. 계산 컬럼(평/월고정비/통보마감일)은 무시한다.
            const handleImportCsv = async (rows) => {
                const headers = rows[0].map(h => String(h).trim());
                const at = (label) => headers.indexOf(label);
                const cell = (row, idx) => (idx >= 0 ? String(row[idx] || '').trim() : '');
                const idx = {
                    name: at('물건명'), address: at('주소'), usage: at('용도'), area: at('계약면적(㎡)'),
                    lessorName: at('임대인'), lessorContact: at('임대인연락처'),
                    startDate: at('시작일'), endDate: at('종료일'),
                    deposit: at('보증금'), monthlyRent: at('월임차료'), maintenanceFee: at('관리비'),
                    noticeDays: at('통보기한(일)'), renewalStatus: at('갱신상태'),
                    manager: at('담당자'), docLink: at('문서링크'), memo: at('비고'),
                };
                let imported = 0;
                for (const row of rows.slice(1)) {
                    const name = cell(row, idx.name);
                    if (!name) continue;
                    const usage = cell(row, idx.usage);
                    const statusLabel = cell(row, idx.renewalStatus);
                    const matched = RENEWAL_STATUSES.find(st => st.label === statusLabel);
                    const notice = parseInt(cell(row, idx.noticeDays).replace(/,/g, ''));
                    await handleAdd({
                        ...EMPTY_LEASE_FORM,
                        name,
                        address: cell(row, idx.address),
                        usage: LEASE_USAGES.includes(usage) ? usage : '기타',
                        area: Number(cell(row, idx.area).replace(/,/g, '')) || 0,
                        lessorName: cell(row, idx.lessorName),
                        lessorContact: cell(row, idx.lessorContact),
                        startDate: cell(row, idx.startDate),
                        endDate: cell(row, idx.endDate),
                        deposit: num(cell(row, idx.deposit)),
                        monthlyRent: num(cell(row, idx.monthlyRent)),
                        maintenanceFee: num(cell(row, idx.maintenanceFee)),
                        noticeDays: Number.isNaN(notice) ? defaultNoticeDays : notice,
                        renewalStatus: matched ? matched.value : 'review',
                        manager: cell(row, idx.manager),
                        docLink: cell(row, idx.docLink),
                        memo: cell(row, idx.memo),
                    });
                    imported++;
                }
                return imported;
            };

            const handleDownloadOpsReport = () => {
                const today = new Date().toISOString().slice(0, 10);
                const deposit = leases.reduce((a, l) => a + num(l.deposit), 0);
                const monthly = leases.reduce((a, l) => a + monthlyOutgo(l), 0);
                const area = leases.reduce((a, l) => a + (Number(l.area) || 0), 0);
                const withDDay = leases
                    .map(l => ({ l, actionDate: getActionDate(l), dDay: diffDaysFromToday(getActionDate(l)) }))
                    .filter(x => x.dDay !== null);
                const soon = withDDay.filter(x => x.dDay >= 0 && x.dDay <= 180).sort((a, b) => a.dDay - b.dDay);
                const past = withDDay.filter(x => x.dDay < 0).sort((a, b) => a.dDay - b.dDay);

                downloadCSV([
                    ['리포트일자', today],
                    ['관리 계약', `${leases.length}`],
                    ['총 보증금(원)', `${deposit}`],
                    ['월 고정비(원)', `${monthly}`],
                    ['연 고정비(원)', `${monthly * 12}`],
                    ['총 임대면적(㎡)', `${area}`],
                    ['총 임대면적(평)', (area / SQM_PER_PYEONG).toFixed(1)],
                    [],
                    ['기한 경과', '대응 기한', '경과일', '담당자', '갱신상태'],
                    ...past.map(x => [x.l.name, x.actionDate || '-', `${Math.abs(x.dDay)}일`, x.l.manager || '-', (getRenewalStatus(x.l.renewalStatus) || {}).label || '-']),
                    [],
                    ['갱신 대응 필요 (D-180)', '대응 기한', '남은일수', '구분', '담당자', '갱신상태'],
                    ...soon.map(x => [x.l.name, x.actionDate || '-', `D-${x.dDay}`,
                        getNoticeDeadline(x.l) ? '갱신통보 기한' : '계약 종료일', x.l.manager || '-',
                        (getRenewalStatus(x.l.renewalStatus) || {}).label || '-']),
                ], `lease_report_${today}.csv`);
            };

            if ((!services || !user) && !isDemoMode) {
                if (errorMsg) return (
                    <div className="h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded shadow text-center">
                            <p className="text-red-500 mb-4">{errorMsg}</p>
                            <button onClick={() => setIsDemoMode(true)} className="bg-blue-600 text-white px-4 py-2 rounded font-bold">데모 모드로 시작</button>
                            <button onClick={() => window.location.reload()} className="ml-2 bg-gray-200 px-4 py-2 rounded">다시 연결</button>
                        </div>
                    </div>
                );
                return <div className="h-screen flex items-center justify-center"><div className="spinner"></div></div>;
            }

            return (
                <div className="flex h-screen overflow-hidden bg-[#f3f4f6] flex-col">
                    {isDemoMode && <SetupBanner />}
                    {renewTarget && <RenewModal lease={renewTarget} onClose={() => setRenewTarget(null)} onSubmit={handleRenew} />}
                    <div className="flex flex-1 overflow-hidden">
                        <aside className="w-64 bg-slate-900 text-white hidden md:flex flex-col shadow-2xl z-20">
                            <div className="p-6 border-b border-slate-800 font-bold text-blue-400 text-xl tracking-tight">임대차계약</div>
                            <nav className="flex-1 p-4 space-y-5 overflow-y-auto custom-scroll">
                                {NAV_GROUPS.map(group => (
                                    <div key={group.title} className={group.title === '관리' ? 'pt-4 border-t border-slate-800' : ''}>
                                        <p className="px-3 mb-2 text-[11px] font-bold tracking-wider text-slate-400 uppercase">{group.title}</p>
                                        <div className="space-y-2">
                                            {group.items.map(item => (
                                                <NavButton key={item.id} active={activeTab === item.id}
                                                    onClick={() => setActiveTab(item.id)} icon={<item.Icon />} label={item.label} />
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </nav>
                        </aside>

                        <main className="flex-1 overflow-y-auto p-4 pb-24 md:p-8 md:pb-8 relative custom-scroll">
                            {loading ? <div className="flex justify-center mt-20"><div className="spinner"></div></div> : (
                                <div className="max-w-7xl mx-auto">
                                    {activeTab === 'dashboard' && <DashboardPage leases={leases} onDownloadReport={handleDownloadOpsReport} />}
                                    {activeTab === 'renewals' && <RenewalSchedulePage leases={leases} />}
                                    {activeTab === 'analysis' && <AnalysisPage leases={leases} />}
                                    {activeTab === 'leases' && <LeaseManagement leases={leases} onAdd={handleAdd} onUpdate={handleUpdate} onDelete={handleDelete} onRenew={setRenewTarget} defaultNoticeDays={defaultNoticeDays} />}
                                    {activeTab === 'lessors' && <LessorPage leases={leases} />}
                                    {activeTab === 'history' && <HistoryPage leases={leases} />}
                                    {activeTab === 'audit' && <AuditLogPage auditLogs={auditLogs} />}
                                    {activeTab === 'settings' && <SettingsPage isDemoMode={isDemoMode} defaultNoticeDays={defaultNoticeDays} onSaveNoticeDays={handleSaveNoticeDays} onImportCsv={handleImportCsv} />}
                                </div>
                            )}
                        </main>
                    </div>

                    {/* 모바일에서는 사이드바 대신 하단 내비를 쓴다 (다른 앱들과 동일한 패턴) */}
                    <nav className="md:hidden fixed bottom-0 inset-x-0 z-50 flex justify-around bg-white/95 backdrop-blur border-t border-slate-200 px-1 py-2 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
                        {NAV_ITEMS.map(item => (
                            <button key={item.id} onClick={() => setActiveTab(item.id)}
                                className={`flex flex-col items-center gap-1 px-2 py-1 rounded transition-colors ${activeTab === item.id ? 'text-blue-600' : 'text-slate-400'}`}>
                                <item.Icon />
                                <span className="text-[10px] font-medium leading-none">{item.short}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
