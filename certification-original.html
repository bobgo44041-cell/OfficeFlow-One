    <!-- OfficeFlow One 세션 브릿지 -->
    <script>
        const OFFICEFLOW_STORAGE_KEY = 'officeflow-one-embed-session';
        const LEGACY_OFFICEFLOW_STORAGE_KEY = 'officeflow-one-mvp-state';

        function getOfficeFlowState() {
            try {
                const raw =
                    window.localStorage.getItem(OFFICEFLOW_STORAGE_KEY) ||
                    window.localStorage.getItem(LEGACY_OFFICEFLOW_STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (error) {}

            return null;
        }

        const officeflowState = getOfficeFlowState();
        const officeflowSession = officeflowState?.session?.authenticated ? officeflowState.session : null;
        const officeflowUid = String(officeflowSession?.uid || '').trim();
        const officeflowEmail = String(officeflowSession?.email || '').toLowerCase();
        const certUserKey = (officeflowUid || officeflowEmail || 'guest').replace(/[^a-z0-9]+/gi, '_');

        // 허브 로그인 사용자별로 데이터를 분리한다. firestore.rules 의
        // ownsApp(appId, 'ofw-certification') 규칙과 짝을 이룬다.
        window.certAppId = `ofw-certification-${certUserKey}`;
        window.officeflowSessionInfo = { uid: officeflowUid, email: officeflowEmail, authenticated: Boolean(officeflowSession) };
    </script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // 모든 문서는 artifacts/{certAppId}/public/data/{컬렉션} 아래에 저장된다.
        const scopedSegments = (col) => ['artifacts', window.certAppId, 'public', 'data', col];
        const certCollection = (db, col) => collection(db, ...scopedSegments(col));
        const certDoc = (db, col, id) => doc(db, ...scopedSegments(col), id);

        window.firebaseModules = {
            initializeApp, getAuth, onAuthStateChanged,
            getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, setDoc, getDoc,
            getAnalytics,
            certCollection, certDoc

        window.userFirebaseConfig = {

    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 상수 ---
        const CERT_CATEGORIES = [
            '이노비즈', '메인비즈', '벤처기업확인', '기업부설연구소', '연구개발전담부서',
            'ISO 인증', '직접생산확인', '여성기업확인', '장애인기업확인', '조달우수제품', '기타',
        ];

        // 산업재산권 종류별 존속기간. 특허법/실용신안법/디자인보호법/상표법 기준이다.
        // 상표만 등록일 기준 10년이고 갱신으로 반영구 유지가 가능하다.
        const IP_TYPES = [
            { value: 'patent',    label: '특허',     termYears: 20, termFrom: 'application',  renewable: false },
            { value: 'utility',   label: '실용신안', termYears: 10, termFrom: 'application',  renewable: false },
            { value: 'design',    label: '디자인',   termYears: 20, termFrom: 'application',  renewable: false },
            { value: 'trademark', label: '상표',     termYears: 10, termFrom: 'registration', renewable: true },
        ];

        const getIpType = (value) => IP_TYPES.find(t => t.value === value) || IP_TYPES[0];

        const DEFAULT_ALERT_STAGES = [90, 60, 30, 7];

        const EMPTY_CERT_FORM = {
            name: '', category: '이노비즈', issuer: '', certNo: '',
            acquiredDate: '', expiryDate: '',
            alertDays: '', manager: '', docLink: '', memo: '',
        };

        const EMPTY_PATENT_FORM = {
            name: '', rightType: 'patent',
            applicationNo: '', applicationDate: '',
            registrationNo: '', registrationDate: '',
            paidThroughYear: 3, annuityFee: 0, agent: '',
            alertDays: '', manager: '', docLink: '', memo: '',
        };

        // --- 유틸 ---
        const toDateOnly = (dateStr) => {
            if (!dateStr) return null;
            const d = new Date(`${dateStr}T00:00:00`);
            return Number.isNaN(d.getTime()) ? null : d;
        };

        const todayDateOnly = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };

        const diffDaysFromToday = (dateStr) => {
            const d = toDateOnly(dateStr);
            if (!d) return null;
            return Math.floor((d.getTime() - todayDateOnly().getTime()) / 86400000);
        };

        const toDateString = (date) => {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        };

        const addYears = (dateStr, years) => {
            const d = toDateOnly(dateStr);
            if (!d) return '';
            const n = new Date(d.getTime());
            n.setFullYear(n.getFullYear() + years);
            return toDateString(n);
        };

        const num = (v) => parseInt(String(v).replace(/,/g, ''), 10) || 0;
        const formatKrw = (amount) => num(amount).toLocaleString() + '원';

        // --- 특허 연차 계산 ---
        // 존속기간 만료일. 특허/실용신안/디자인은 출원일, 상표는 등록일이 기산점이다.
        const patentTermEnd = (p) => {
            const t = getIpType(p.rightType);
            const base = t.termFrom === 'registration' ? p.registrationDate : p.applicationDate;
            return base ? addYears(base, t.termYears) : '';
        };

        // 다음 연차료 납부기한.
        // 설정등록 때 1~3년분을 한꺼번에 내고, 그 다음 연차부터 매년
        // 등록일의 응당일 전까지 납부한다. paidThroughYear 는 납부를 마친 연차다.
        const nextAnnuity = (p) => {
            const t = getIpType(p.rightType);
            if (t.renewable) return null; // 상표는 연차료 대신 10년 갱신등록료
            if (!p.registrationDate) return null;
            const paid = Math.max(0, parseInt(p.paidThroughYear) || 0);
            const due = addYears(p.registrationDate, paid);
            const termEnd = patentTermEnd(p);
            if (termEnd && due > termEnd) return null; // 존속기간이 먼저 끝난다
            return { year: paid + 1, due };
        };

        // 상표 갱신등록 기한 (등록일 + 10년)
        const trademarkRenewalDue = (p) =>
            (p.registrationDate ? addYears(p.registrationDate, getIpType(p.rightType).termYears) : '');

        // --- 레코드 정규화 ---
        // 인증서와 특허는 대장이 다르지만, 기한 알림/일정/대시보드에서는
        // '언제까지 무엇을 해야 하는가' 하나의 축으로 합쳐서 본다.
        const toRecord = (item, kind) => {
            if (kind === 'cert') {
                return {
                    ...item, kind, recordId: 'cert:' + item.id,
                    title: item.name || '', org: item.issuer || '', badge: item.category || '인증',
                    actionDate: item.expiryDate || '', actionLabel: '인증 만료',
                    startDate: item.acquiredDate || '', endDate: item.expiryDate || '',
                    cost: 0,
                };
            }
            const t = getIpType(item.rightType);
            const base = {
                ...item, kind, recordId: 'patent:' + item.id,
                title: item.name || '', org: item.agent || '', badge: t.label,
                cost: num(item.annuityFee),
            };
            if (t.renewable) {
                const due = trademarkRenewalDue(item);
                return { ...base, actionDate: due, actionLabel: '갱신 기한',
                    startDate: item.registrationDate || item.applicationDate || '', endDate: due };
            }
            const a = nextAnnuity(item);
            const termEnd = patentTermEnd(item);
            return {
                ...base,
                actionDate: a ? a.due : termEnd,
                actionLabel: a ? `${a.year}년차 연차료` : '존속기간 만료',
                annuityYear: a ? a.year : null,
                startDate: item.applicationDate || '', endDate: termEnd,
            };
        };

        const buildRecords = (certs, patents) => [
            ...certs.map(c => toRecord(c, 'cert')),
            ...patents.map(p => toRecord(p, 'patent')),
        ];

        // --- 알림 엔진 ---
        // 전역 알림 단계(예: 90/60/30/7일)를 쓰되, 항목마다 직접 지정할 수도 있다.
        const parseStages = (raw) => String(raw || '')
            .split(',')
            .map(s => parseInt(String(s).trim(), 10))
            .filter(n => !Number.isNaN(n) && n > 0);

        const stagesFor = (record, globalStages) => {
            const own = parseStages(record.alertDays);
            const list = own.length ? own : globalStages;
            return [...new Set(list)].sort((a, b) => b - a);
        };

        // 지금 걸려 있는 단계 = 남은 일수를 넘어선 단계 중 가장 촘촘한 것.
        // D-45 이고 단계가 90/60/30 이면 60일 단계가 걸린다.
        const activeStage = (dDay, stages) => {
            if (dDay === null) return null;
            const hit = stages.filter(s => dDay <= s);
            return hit.length ? Math.min(...hit) : null;
        };

        // 확인 표시는 기한과 단계를 함께 키로 쓴다. 갱신해서 기한이 바뀌면
        // 예전 확인 기록은 자동으로 효력을 잃고 새 주기의 알림이 다시 뜬다.
        const ackKey = (deadline, stage) => `${deadline}#${stage}`;
        const isAcked = (record, stage) =>
            Array.isArray(record.alertAcks) && record.alertAcks.includes(ackKey(record.actionDate, stage));

        // 알림 대상 한 건. dDay 가 없으면(기한 미입력) 알림에 잡히지 않는다.
        const toAlert = (record, globalStages) => {
            const dDay = diffDaysFromToday(record.actionDate);
            if (dDay === null) return null;
            const stages = stagesFor(record, globalStages);
            const stage = activeStage(dDay, stages);
            if (stage === null) return null;
            return { record, dDay, stage, stages, acked: isAcked(record, stage) };
        };

        // 따옴표와 줄바꿈이 들어간 셀까지 처리하는 CSV 파서
        const parseCSV = (text) => {
            const clean = String(text).replace(/^﻿/, '').replace(/\r\n/g, '\n');
            const rows = [];
            let row = [], cell = '', inQuotes = false;
            for (let i = 0; i < clean.length; i++) {
                const ch = clean[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (clean[i + 1] === '"') { cell += '"'; i++; }
                        else inQuotes = false;
                    } else cell += ch;
                } else if (ch === '"') inQuotes = true;
                else if (ch === ',') { row.push(cell); cell = ''; }
                else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
                else cell += ch;
            }
            if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
            return rows.filter(r => r.some(c => String(c).trim() !== ''));
        };

        const downloadCSV = (rows, filename) => {
            const csv = rows.map(r => r.map(c => {
                const v = String(c === undefined || c === null ? '' : c);
                return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
            }).join(',')).join('\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
        };

        // --- Icons ---
        const Icons = {
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Shield: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" /></svg>,
            Bulb: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>,
            Bell: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.158c0 .538-.214 1.055-.595 1.437L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>,
            Calendar: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,

        };

        // --- 내비게이션 정의 (사이드바와 모바일 하단바가 공유) ---
        const NAV_GROUPS = [
            { title: '운영', items: [
                { id: 'dashboard', label: '대시보드',   short: '홈',   Icon: Icons.Dashboard },
                { id: 'alerts',    label: '알림 센터',  short: '알림', Icon: Icons.Bell },
                { id: 'schedule',  label: '갱신 일정',  short: '일정', Icon: Icons.Calendar },
            ]},
            { title: '대장', items: [
                { id: 'certs',   label: '인증서 관리', short: '인증', Icon: Icons.Shield },
                { id: 'patents', label: '특허 관리',   short: '특허', Icon: Icons.Bulb },
                { id: 'issuers', label: '기관별 현황', short: '기관', Icon: Icons.Bank },
            ]},
            { title: '관리', items: [
                { id: 'audit',    label: '감사 로그', short: '로그', Icon: Icons.History },
                { id: 'settings', label: '환경설정',  short: '설정', Icon: Icons.Settings },
            ]},
        ];

        const NAV_ITEMS = NAV_GROUPS.flatMap(g => g.items);

        // --- 감사 로그 ---
        const CERT_FIELD_LABELS = {
            name: '인증명', category: '구분', issuer: '인증기관', certNo: '인증번호',
            acquiredDate: '취득일', expiryDate: '만료일',
            alertDays: '개별 알림단계', manager: '담당자', docLink: '문서링크', memo: '비고',
        };

        const PATENT_FIELD_LABELS = {
            name: '발명의 명칭', rightType: '권리구분',
            applicationNo: '출원번호', applicationDate: '출원일',
            registrationNo: '등록번호', registrationDate: '등록일',
            paidThroughYear: '납부완료 연차', annuityFee: '연차료', agent: '대리인',
            alertDays: '개별 알림단계', manager: '담당자', docLink: '문서링크', memo: '비고',
        };

        const AUDIT_ACTIONS = {
            add:    { label: '등록',   cls: 'bg-blue-100 text-blue-700' },
            update: { label: '수정',   cls: 'bg-amber-100 text-amber-700' },
            renew:  { label: '갱신처리', cls: 'bg-emerald-100 text-emerald-700' },
            pay:    { label: '연차료 납부', cls: 'bg-teal-100 text-teal-700' },
            ack:    { label: '알림확인', cls: 'bg-slate-100 text-slate-600' },
            del:    { label: '삭제',   cls: 'bg-red-100 text-red-700' },
        };

        const labelsFor = (target) => (target === 'patent' ? PATENT_FIELD_LABELS : CERT_FIELD_LABELS);

        const snapshotForAudit = (item, target) => {
            if (!item) return null;
            const out = {};
            Object.keys(labelsFor(target)).forEach(k => { out[k] = item[k] === undefined ? '' : item[k]; });
            return out;
        };

        const formatAuditValue = (key, value) => {
            if (value === undefined || value === null || value === '') return '없음';
            if (key === 'rightType') return getIpType(value).label;
            if (key === 'annuityFee') return Number(value).toLocaleString();
            return String(value);
        };

        // before/after 에서 실제로 바뀐 필드만 뽑는다.
        const diffAuditSnapshots = (before, after, target) => {
            if (!before || !after) return [];
            const labels = labelsFor(target);
            return Object.keys(labels)
                .filter(k => String(before[k] ?? '') !== String(after[k] ?? ''))
                .map(k => ({ key: k, label: labels[k], from: formatAuditValue(k, before[k]), to: formatAuditValue(k, after[k]) }));
        };

        // --- 공통 UI ---
        function NavButton({ active, onClick, icon, label }) {
            return (
                <button onClick={onClick} className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-all ${active ? 'bg-blue-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}`}>
                    {icon}<span className="font-medium">{label}</span>
                </button>
            );
        }

        function StatCard({ title, value, subtext, color = 'blue', onClick }) {
            const borderColorClassMap = {
                blue: 'border-blue-500', indigo: 'border-indigo-500', purple: 'border-purple-500',

            };

                <div onClick={onClick} className={`glass-panel p-6 border-l-4 ${borderColorClassMap[color] || borderColorClassMap.blue} ${onClick ? 'cursor-pointer hover:bg-gray-50 transition-colors' : ''}`}>
                    <h3 className="text-sm font-semibold text-gray-500 uppercase tracking-wider">{title}</h3>
                    <div className="mt-2"><span className="text-3xl font-bold text-gray-900">{value}</span></div>
                    {subtext && <p className="mt-1 text-sm text-gray-400">{subtext}</p>}
                </div>
            );
        }

        function SetupBanner() {
            return (
                <div className="bg-amber-100 border-b border-amber-200 text-amber-900 px-4 py-3 flex items-center justify-between shadow-sm">
                    <div className="flex items-center gap-3"><div className="text-amber-600"><Icons.CloudOff /></div><p className="text-sm font-bold">데모 모드 (클라우드 연결 안 됨 · 이 브라우저에서만 임시 저장)</p></div>
                    <button onClick={() => window.location.reload()} className="text-xs bg-white border border-amber-300 px-3 py-1 rounded hover:bg-amber-50">다시 연결</button>
                </div>
            );
        }

        // 인증서와 특허 목록이 같은 방식으로 쓴다.
        function Pagination({ page, totalPages, onGo }) {
            if (totalPages <= 1) return null;
            return (
                <div className="flex flex-wrap items-center justify-between gap-3 pt-2">
                    <span className="text-xs text-gray-500">{page} / {totalPages} 페이지</span>
                    <div className="flex items-center gap-1">
                        <button type="button" onClick={() => onGo(page - 1)} disabled={page <= 1}
                            className="px-3 py-1.5 rounded border text-xs font-bold bg-white text-slate-600 hover:bg-gray-50 disabled:opacity-40 disabled:hover:bg-white">
                            이전
                        </button>
                        {Array.from({ length: totalPages }, (_, i) => i + 1)
                            // 페이지가 많아지면 현재 위치 주변과 양 끝만 보여준다.
                            .filter(n => n === 1 || n === totalPages || Math.abs(n - page) <= 1)
                            .map((n, i, arr) => (
                                <React.Fragment key={n}>
                                    {i > 0 && n - arr[i - 1] > 1 && <span className="px-1 text-xs text-gray-300">…</span>}
                                    <button type="button" onClick={() => onGo(n)}
                                        className={`w-8 py-1.5 rounded text-xs font-bold ${n === page ? 'bg-blue-600 text-white' : 'border bg-white text-slate-600 hover:bg-gray-50'}`}>
                                        {n}
                                    </button>
                                </React.Fragment>
                            ))}
                        <button type="button" onClick={() => onGo(page + 1)} disabled={page >= totalPages}
                            className="px-3 py-1.5 rounded border text-xs font-bold bg-white text-slate-600 hover:bg-gray-50 disabled:opacity-40 disabled:hover:bg-white">
                            다음
                        </button>
                    </div>
                </div>
            );
        }

        function DDayBadge({ dDay }) {
            if (dDay === null || dDay === undefined) return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-gray-100 text-gray-500 whitespace-nowrap">기한 미설정</span>;
            if (dDay < 0) return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-600 text-white whitespace-nowrap">{Math.abs(dDay)}일 경과</span>;
            if (dDay <= 30) return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-100 text-red-700 whitespace-nowrap">D-{dDay}</span>;
            if (dDay <= 90) return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-700 whitespace-nowrap">D-{dDay}</span>;
            return <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600 whitespace-nowrap">D-{dDay}</span>;
        }

        // --- Firebase 연결 ---
        function useFirebase() {
            const [services, setServices] = useState(null);
            const [user, setUser] = useState(null);
            const [errorMsg, setErrorMsg] = useState('');

            useEffect(() => {
                let mounted = true;
                const init = async () => {
                    const sdkTimeout = setTimeout(() => {
                        if (mounted && !window.firebaseModules) setErrorMsg('Firebase SDK 로딩 시간 초과 (네트워크/차단 확인 필요)');
                    }, 5000);

                    while (!window.firebaseModules) {
                        await new Promise(r => setTimeout(r, 100));
                        if (!mounted) return;
                    }
                    clearTimeout(sdkTimeout);

                    const { initializeApp, getAuth, onAuthStateChanged, getFirestore, getAnalytics } = window.firebaseModules;

                    try {
                        const connTimeout = setTimeout(() => {
                            if (mounted && !user) setErrorMsg('서버 연결 응답 없음 (네트워크 방화벽 이슈 또는 로그인 세션 만료)');
                        }, 10000);

                        if (!window._firebaseAppInstance) window._firebaseAppInstance = initializeApp(window.userFirebaseConfig);
                        const app = window._firebaseAppInstance;
                        const auth = getAuth(app);
                        const db = getFirestore(app);
                        try { getAnalytics(app); } catch (e) {}

                        // OfficeFlow One 허브에서 Google 로그인한 세션을 그대로 승계한다.
                        onAuthStateChanged(auth, (u) => {
                            if (!mounted) return;
                            clearTimeout(connTimeout);
                            if (u) { setUser(u); setServices({ db, auth }); }
                            else setErrorMsg('OfficeFlow One 로그인 세션을 찾지 못했습니다. 허브에서 Google 로그인 후 다시 실행해 주세요.');
                        }, (err) => { clearTimeout(connTimeout); setErrorMsg(`인증 오류: ${err.message}`); });
                    } catch (err) {
                        console.error('Firebase init failed', err);
                        setErrorMsg(`초기화 오류: ${err.message}`);
                    }
                };
                init();
                return () => { mounted = false; };
            }, []);

            return { services, user, errorMsg };
        }

        // --- 차트 ---
        // 긴급도 색은 dataviz 검증기 통과 (경과/임박/여유, CVD ΔE 18 이상).
        // amber 는 배경 대비가 낮아 막대마다 D-day 라벨을 함께 표시한다.
        const URGENCY = {
            overdue: { color: '#dc2626', label: '기한 경과' },
            soon:    { color: '#f59e0b', label: 'D-90 이내' },
            later:   { color: '#3b82f6', label: '여유' },
        };

        const urgencyOf = (dDay) => (dDay === null ? null : dDay < 0 ? 'overdue' : dDay <= 90 ? 'soon' : 'later');

        // 대응 기한까지 남은 일수를 가로 막대로 그린다.
        // 인증서(3년)와 특허 존속기간(20년)은 길이가 너무 달라 계약기간을 그대로
        // 그리면 축이 망가진다. 그래서 '언제까지 해야 하는가'만 공통 축으로 본다.
        const TIMELINE_DAYS = 730;

        function DeadlineTimeline({ records }) {
            const [hover, setHover] = useState(null);

            const rows = useMemo(() => records
                .map(r => ({ record: r, dDay: diffDaysFromToday(r.actionDate) }))
                .filter(x => x.dDay !== null)
                .sort((a, b) => a.dDay - b.dDay), [records]);

            if (rows.length === 0) {
                return (
                    <div className="glass-panel p-6">
                        <h3 className="font-bold text-gray-700 mb-1">대응 기한 타임라인</h3>
                        <p className="text-sm text-gray-400 py-8 text-center">만료일 또는 연차료 기한이 입력된 항목이 없습니다.</p>
                    </div>
                );
            }

            const pct = (d) => (Math.min(Math.max(d, 0), TIMELINE_DAYS) / TIMELINE_DAYS) * 100;

            // 눈금: 3개월 간격
            const today = todayDateOnly();
            const ticks = [];
            for (let m = 0; m <= 24; m += 3) {
                const d = new Date(today.getFullYear(), today.getMonth() + m, 1);
                const days = Math.floor((d.getTime() - today.getTime()) / 86400000);
                if (days >= 0 && days <= TIMELINE_DAYS) {
                    ticks.push({ key: `${d.getFullYear()}-${d.getMonth() + 1}`, label: `${String(d.getFullYear()).slice(2)}.${String(d.getMonth() + 1).padStart(2, '0')}`, left: pct(days) });
                }
            }

            const shown = rows.slice(0, 14);

            return (
                <div className="glass-panel p-6">
                    <div className="flex flex-wrap items-baseline justify-between gap-2 mb-1">
                        <h3 className="font-bold text-gray-700">대응 기한 타임라인</h3>
                        <div className="flex flex-wrap gap-3 text-[11px] text-gray-500">
                            {Object.values(URGENCY).map(u => (
                                <span key={u.label} className="flex items-center gap-1.5">
                                    <span className="w-3 h-2 rounded-sm" style={{ background: u.color }}></span>{u.label}
                                </span>
                            ))}
                            <span className="flex items-center gap-1.5"><span className="w-[2px] h-3 bg-slate-800"></span>오늘</span>
                        </div>
                    </div>
                    <p className="text-[11px] text-gray-400 mb-4">
                        막대 끝이 대응 기한입니다. 축은 24개월까지이며, 그 이후 기한은 오른쪽 끝에 맞닿습니다.
                        {rows.length > shown.length && ` 기한이 빠른 ${shown.length}건만 표시합니다.`}
                    </p>

                    <div className="relative">
                        {/* 월 눈금 */}
                        <div className="relative h-4 ml-[132px] mr-[84px] mb-1">
                            {ticks.map(t => (
                                <span key={t.key} className="absolute text-[10px] text-gray-400 -translate-x-1/2" style={{ left: t.left + '%' }}>{t.label}</span>
                            ))}
                        </div>

                        <div className="space-y-2">
                            {shown.map(({ record, dDay }) => {
                                const u = URGENCY[urgencyOf(dDay)] || URGENCY.later;
                                const width = Math.max(1.5, pct(dDay));
                                return (
                                    <div key={record.recordId} className="flex items-center gap-3">
                                        <span className="w-[120px] shrink-0 text-xs text-gray-700 truncate text-right" title={record.title}>{record.title}</span>
                                        <div className="relative flex-1 h-7">
                                            <div className="absolute inset-y-2 inset-x-0 bg-gray-100 rounded"></div>
                                            {ticks.map(t => (
                                                <span key={t.key} className="absolute inset-y-0 w-px bg-gray-200" style={{ left: t.left + '%' }}></span>
                                            ))}
                                            <div
                                                className="absolute inset-y-1.5 left-0 rounded cursor-default"
                                                style={{ width: width + '%', background: u.color }}
                                                onMouseEnter={() => setHover(record.recordId)}
                                                onMouseLeave={() => setHover(null)}
                                            ></div>
                                            <span className="absolute inset-y-0 left-0 w-[2px] bg-slate-800 rounded"></span>
                                            {hover === record.recordId && (
                                                <div className="absolute z-20 -top-1 left-1/2 -translate-x-1/2 -translate-y-full bg-slate-800 text-white text-[11px] rounded px-2.5 py-1.5 whitespace-nowrap shadow-lg pointer-events-none">
                                                    {record.actionLabel} {record.actionDate}
                                                    <div className="text-slate-300">{record.badge}{record.org ? ' · ' + record.org : ''}</div>
                                                </div>
                                            )}
                                        </div>
                                        <span className={`w-[76px] shrink-0 text-right text-[11px] font-bold ${dDay < 0 ? 'text-red-600' : dDay <= 90 ? 'text-amber-700' : 'text-gray-400'}`}>
                                            {dDay < 0 ? `${Math.abs(dDay)}일 경과` : `D-${dDay}`}
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // 어느 해에 기한이 몰리는지 본다.
        function DeadlineByYear({ records }) {
            const [hover, setHover] = useState(null);

            const years = useMemo(() => {
                const map = new Map();
                records.forEach(r => {
                    const d = toDateOnly(r.actionDate);
                    if (!d) return;
                    const y = d.getFullYear();
                    if (!map.has(y)) map.set(y, { year: y, count: 0, cert: 0, patent: 0, names: [] });
                    const g = map.get(y);
                    g.count += 1;
                    if (r.kind === 'cert') g.cert += 1; else g.patent += 1;
                    g.names.push(r.title);
                });
                return [...map.values()].sort((a, b) => a.year - b.year);
            }, [records]);

            const max = years.length ? Math.max(...years.map(y => y.count)) : 0;

            return (
                <div className="glass-panel p-6">
                    <h3 className="font-bold text-gray-700 mb-1">연도별 기한 도래 건수</h3>
                    <p className="text-[11px] text-gray-400 mb-4">인증 만료일과 특허 연차료 기한을 연도별로 묶었습니다. 한 해에 몰리면 예산과 일정을 미리 나눠야 합니다.</p>
                    {years.length === 0 ? (
                        <p className="text-sm text-gray-400 py-8 text-center">기한이 입력된 항목이 없습니다.</p>
                    ) : (
                        <>
                            <div className="flex items-end gap-3 h-44">
                                {years.map(y => {
                                    const h = max > 0 ? Math.max(4, (y.count / max) * 100) : 4;
                                    return (
                                        <div key={y.year} className="flex-1 flex flex-col items-center justify-end h-full relative"
                                            onMouseEnter={() => setHover(y.year)} onMouseLeave={() => setHover(null)}>
                                            {hover === y.year && (
                                                <div className="absolute z-20 bottom-full mb-1 bg-slate-800 text-white text-[11px] rounded px-2.5 py-1.5 max-w-[220px] shadow-lg pointer-events-none">
                                                    {y.names.join(', ')}
                                                </div>
                                            )}
                                            <span className="text-[11px] font-bold text-gray-700 mb-1">{y.count}</span>
                                            <div className="w-full rounded-t" style={{ height: h + '%', background: '#2563eb' }}></div>
                                            <span className="text-[11px] text-gray-500 mt-1.5">{y.year}</span>
                                            <span className="text-[10px] text-gray-400">인증 {y.cert} · 특허 {y.patent}</span>
                                        </div>
                                    );
                                })}
                            </div>
                            <p className="mt-4 pt-3 border-t text-xs text-gray-500 flex justify-between">
                                <span>합계</span><span className="font-bold text-gray-800">{years.reduce((a, y) => a + y.count, 0)}건</span>
                            </p>
                        </>
                    )}
                </div>
            );
        }

        // 어느 기관에 얼마나 묶여 있는지 본다. 같은 기관 건은 갱신 절차가 비슷해 함께 처리하기 좋다.
        const ISSUER_CHART_LIMIT = 8;

        function IssuerChart({ records }) {
            const all = useMemo(() => {
                const map = new Map();
                records.forEach(r => {
                    const key = (r.org || '').trim() || '(미입력)';
                    if (!map.has(key)) map.set(key, { name: key, count: 0, urgent: 0 });
                    const g = map.get(key);
                    g.count += 1;
                    const d = diffDaysFromToday(r.actionDate);
                    if (d !== null && d <= 90) g.urgent += 1;
                });
                return [...map.values()].sort((a, b) => b.count - a.count);
            }, [records]);

            const rows = all.slice(0, ISSUER_CHART_LIMIT);
            const max = Math.max(1, ...rows.map(r => r.count));

            return (
                <div className="glass-panel p-6">
                    <h3 className="font-bold text-gray-700 mb-1">기관·대리인별 보유 현황</h3>
                    <p className="text-[11px] text-gray-400 mb-4">
                        인증기관과 특허 대리인을 함께 봅니다. 기한이 90일 이내로 남은 건은 따로 표시합니다.
                        {all.length > rows.length && ` 보유 건수가 많은 ${rows.length}곳만 표시하며, 전체 ${all.length}곳은 기관별 현황에서 볼 수 있습니다.`}
                    </p>
                    {rows.length === 0 ? (
                        <p className="text-sm text-gray-400 py-8 text-center">등록된 항목이 없습니다.</p>
                    ) : (
                        <div className="space-y-3">
                            {rows.map(r => (
                                <div key={r.name}>
                                    <div className="flex flex-wrap items-baseline justify-between gap-2 text-sm mb-1">
                                        <span className="flex items-center gap-2">
                                            <span className="text-gray-700">{r.name}</span>
                                            <span className="font-bold text-gray-800">{r.count}건</span>
                                        </span>
                                        {r.urgent > 0 && <span className="text-[10px] font-bold text-red-600">D-90 이내 {r.urgent}건</span>}
                                    </div>
                                    <div className="h-2 bg-gray-100 rounded">
                                        <div className="h-2 rounded" style={{ width: (r.count / max) * 100 + '%', background: '#2563eb' }}></div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // 특허 연차료가 언제 얼마나 나가는지 본다. 인증서 쪽에는 없는 축이다.
        const ANNUITY_PANEL_LIMIT = 6;

        function AnnuityPanel({ patents }) {
            const all = useMemo(() => patents
                .map(p => {
                    const t = getIpType(p.rightType);
                    if (t.renewable) {
                        const due = trademarkRenewalDue(p);
                        return due ? { id: p.id, name: p.name, due, dDay: diffDaysFromToday(due), fee: num(p.annuityFee), label: '갱신등록료' } : null;
                    }
                    const a = nextAnnuity(p);
                    return a ? { id: p.id, name: p.name, due: a.due, dDay: diffDaysFromToday(a.due), fee: num(p.annuityFee), label: `${a.year}년차` } : null;
                })
                .filter(Boolean)
                .sort((a, b) => a.dDay - b.dDay), [patents]);

            const rows = all.slice(0, ANNUITY_PANEL_LIMIT);

            const yearTotal = useMemo(() => {
                const limit = 365;
                return patents.reduce((sum, p) => {
                    const t = getIpType(p.rightType);
                    const due = t.renewable ? trademarkRenewalDue(p) : (nextAnnuity(p) || {}).due;
                    const d = diffDaysFromToday(due);
                    return d !== null && d >= 0 && d <= limit ? sum + num(p.annuityFee) : sum;
                }, 0);
            }, [patents]);

            return (
                <div className="glass-panel p-6">
                    <h3 className="font-bold text-gray-700 mb-1">특허 연차료 납부 예정</h3>
                    <p className="text-[11px] text-gray-400 mb-4">
                        설정등록 때 1~3년분을 함께 내고 그 다음 연차부터 매년 등록일 응당일 전까지 납부합니다.
                        {all.length > rows.length && ` 기한이 빠른 ${rows.length}건만 표시합니다 (전체 ${all.length}건).`}
                    </p>
                    {rows.length === 0 ? (
                        <p className="text-sm text-gray-400 py-8 text-center">등록일이 입력된 산업재산권이 없습니다.</p>
                    ) : (
                        <>
                            <div className="space-y-2">
                                {rows.map(r => (
                                    <div key={r.id} className="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm py-1.5 border-b border-gray-50 last:border-0">
                                        <span className="font-medium text-gray-800 truncate max-w-[46%]" title={r.name}>{r.name}</span>
                                        <span className="px-2 py-0.5 rounded bg-teal-50 text-teal-700 text-[10px] font-bold">{r.label}</span>
                                        <span className="font-mono text-xs text-gray-500">{r.due}</span>
                                        <DDayBadge dDay={r.dDay} />
                                        <span className="ml-auto text-xs font-bold text-gray-700">{r.fee > 0 ? formatKrw(r.fee) : '-'}</span>
                                    </div>
                                ))}
                            </div>
                            <p className="mt-4 pt-3 border-t text-xs text-gray-500 flex justify-between">
                                <span>향후 1년 예상 납부액</span><span className="font-bold text-gray-800">{formatKrw(yearTotal)}</span>
                            </p>
                        </>
                    )}
                </div>
            );
        }

        // --- 대시보드 ---
        function DashboardPage({ records, patents, alertStages, onDownloadReport, onGoAlerts }) {
            const [alertWindow, setAlertWindow] = useState(alertStages[0] || 90);

            useEffect(() => { setAlertWindow(alertStages[0] || 90); }, [alertStages]);

            const dated = useMemo(() => records
                .map(r => ({ ...r, dDay: diffDaysFromToday(r.actionDate) }))
                .filter(r => r.dDay !== null), [records]);

            const overdue = useMemo(() => dated.filter(r => r.dDay < 0).sort((a, b) => a.dDay - b.dDay), [dated]);
            const upcoming = useMemo(() => dated.filter(r => r.dDay >= 0 && r.dDay <= alertWindow).sort((a, b) => a.dDay - b.dDay), [dated, alertWindow]);
            const unacked = useMemo(() => records
                .map(r => toAlert(r, alertStages))
                .filter(a => a && !a.acked).length, [records, alertStages]);

            const certCount = records.filter(r => r.kind === 'cert').length;
            const patentCount = records.filter(r => r.kind === 'patent').length;

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">현황 대시보드</h2>
                        <button onClick={onDownloadReport} className="text-sm bg-slate-700 text-white px-3 py-1.5 rounded flex items-center gap-1 hover:bg-slate-800 w-fit">
                            <Icons.Download /> 운영 리포트 CSV
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard title="보유 인증서" value={`${certCount}건`} subtext="인증·확인서 대장" color="blue" />
                        <StatCard title="보유 산업재산권" value={`${patentCount}건`} subtext="특허·실용신안·디자인·상표" color="indigo" />
                        <StatCard title="미확인 알림" value={`${unacked}건`} subtext="알림 센터에서 확인 처리" color="orange" onClick={onGoAlerts} />
                        <StatCard title="기한 경과" value={`${overdue.length}건`} subtext="즉시 조치가 필요합니다" color="red" />
                    </div>

                    {overdue.length > 0 && (
                        <div className="bg-slate-800 text-white rounded-lg p-4">
                            <h4 className="font-bold text-sm mb-1 flex items-center gap-2"><Icons.Alert /> 기한 경과 ({overdue.length}건)</h4>
                            <p className="text-[11px] text-slate-300 mb-3">인증이 이미 실효됐거나 연차료 납부기한이 지났습니다. 추가납부 기간이 있는지 확인하세요.</p>
                            <div className="flex flex-wrap gap-2">
                                {overdue.map(r => (
                                    <div key={r.recordId} className="bg-slate-700 px-3 py-1.5 rounded text-xs">
                                        <span className="font-bold mr-2">{r.title}</span>
                                        <span className="font-mono text-slate-300">{r.actionDate}</span>
                                        <span className="ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-500 text-white">{Math.abs(r.dDay)}일 경과</span>
                                        <span className="ml-1 text-[10px] text-amber-300">{r.actionLabel}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                        <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
                            <h4 className="text-red-800 font-bold text-sm flex items-center gap-2"><Icons.Alert /> 갱신 대응 필요 (D-{alertWindow})</h4>
                            <div className="flex flex-wrap gap-1">
                                {alertStages.map(d => (
                                    <button key={d} onClick={() => setAlertWindow(d)}
                                        className={`px-2.5 py-1 rounded text-[11px] font-bold transition-colors ${alertWindow === d ? 'bg-red-600 text-white' : 'bg-white text-red-600 border border-red-200 hover:bg-red-100'}`}>
                                        {d}일
                                    </button>
                                ))}
                            </div>
                        </div>
                        <p className="text-[11px] text-red-500 mb-3">환경설정에서 지정한 알림 단계로 끊어 봅니다.</p>
                        {upcoming.length === 0 ? (
                            <p className="text-xs text-red-400 py-2">{alertWindow}일 이내 대응할 항목이 없습니다.</p>
                        ) : (
                            <div className="flex flex-wrap gap-2">
                                {upcoming.map(r => (
                                    <div key={r.recordId} className="bg-white px-3 py-1.5 rounded border border-red-100 text-xs shadow-sm">
                                        <span className="font-bold text-gray-700 mr-2">{r.title}</span>
                                        <span className="text-red-500 font-mono font-bold">{r.actionDate}</span>
                                        <span className="ml-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-100 text-red-700">D-{r.dDay}</span>
                                        <span className="ml-1 px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">{r.actionLabel}</span>
                                        {r.manager && <span className="ml-1 text-[10px] text-gray-400">{r.manager}</span>}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    <DeadlineTimeline records={records} />

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <DeadlineByYear records={records} />
                        <IssuerChart records={records} />
                        <AnnuityPanel patents={patents} />
                        <div className="glass-panel p-6">
                            <h3 className="font-bold text-gray-700 mb-1">구분별 보유 현황</h3>
                            <p className="text-[11px] text-gray-400 mb-4">인증서는 구분별로, 산업재산권은 권리별로 묶었습니다.</p>
                            {records.length === 0 ? (
                                <p className="text-sm text-gray-400 py-8 text-center">등록된 항목이 없습니다.</p>
                            ) : (
                                <div className="space-y-3">
                                    {(() => {
                                        const map = new Map();
                                        records.forEach(r => {
                                            const key = r.badge || '기타';
                                            if (!map.has(key)) map.set(key, { name: key, kind: r.kind, count: 0, urgent: 0 });
                                            const g = map.get(key);
                                            g.count += 1;
                                            const d = diffDaysFromToday(r.actionDate);
                                            if (d !== null && d <= 90) g.urgent += 1;
                                        });
                                        const rows = [...map.values()].sort((a, b) => b.count - a.count);
                                        const max = Math.max(1, ...rows.map(r => r.count));
                                        return rows.map(r => (
                                            <div key={r.name}>
                                                <div className="flex flex-wrap items-baseline justify-between gap-2 text-sm mb-1">
                                                    <span className="flex items-center gap-2">
                                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${r.kind === 'cert' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>
                                                            {r.kind === 'cert' ? '인증' : '권리'}
                                                        </span>
                                                        <span className="text-gray-700">{r.name}</span>
                                                        <span className="font-bold text-gray-800">{r.count}건</span>
                                                    </span>
                                                    {r.urgent > 0 && <span className="text-[10px] font-bold text-red-600">D-90 이내 {r.urgent}건</span>}
                                                </div>
                                                <div className="h-2 bg-gray-100 rounded">
                                                    <div className="h-2 rounded" style={{ width: (r.count / max) * 100 + '%', background: r.kind === 'cert' ? '#2563eb' : '#7c3aed' }}></div>
                                                </div>
                                            </div>
                                        ));
                                    })()}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- 알림 센터 ---
        // 사용자가 정한 단계(90/60/30/7일 등)에 걸린 항목을 모아 보여주고,
        // '확인' 을 누르면 그 주기에서는 다시 뜨지 않는다.
        function AlertCenterPage({ records, alertStages, onAck, onUnack }) {
            const [showAcked, setShowAcked] = useState(false);

            const alerts = useMemo(() => records
                .map(r => toAlert(r, alertStages))
                .filter(Boolean)
                .sort((a, b) => a.dDay - b.dDay), [records, alertStages]);

            const pending = alerts.filter(a => !a.acked);
            const acked = alerts.filter(a => a.acked);

            const groups = useMemo(() => {
                const map = new Map();
                pending.forEach(a => {
                    const key = a.dDay < 0 ? 'overdue' : String(a.stage);
                    if (!map.has(key)) map.set(key, { key, stage: a.dDay < 0 ? null : a.stage, items: [] });
                    map.get(key).items.push(a);
                });
                return [...map.values()].sort((a, b) => {
                    if (a.stage === null) return -1;
                    if (b.stage === null) return 1;
                    return a.stage - b.stage;
                });
            }, [pending]);

            const list = showAcked ? acked : pending;

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">알림 센터</h2>
                            <p className="text-sm text-gray-500 mt-1">
                                환경설정의 알림 단계({alertStages.join(' / ')}일)에 걸린 항목입니다.
                                확인 처리하면 목록에서 빠지고, 갱신해서 기한이 바뀌면 새 주기에 다시 뜹니다.
                            </p>
                        </div>
                        <div className="flex gap-1">
                            {[[false, `미확인 ${pending.length}`], [true, `확인완료 ${acked.length}`]].map(([v, label]) => (
                                <button key={String(v)} onClick={() => setShowAcked(v)}
                                    className={`px-3 py-1.5 rounded text-xs font-bold transition-colors ${showAcked === v ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600 hover:bg-gray-50'}`}>
                                    {label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {!showAcked && groups.length > 0 && (
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                            {groups.map(g => (
                                <div key={g.key} className={`glass-panel p-4 border-l-4 ${g.stage === null ? 'border-red-600' : g.stage <= 30 ? 'border-red-500' : 'border-amber-500'}`}>
                                    <p className="text-xs font-semibold text-gray-500">{g.stage === null ? '기한 경과' : `D-${g.stage} 단계`}</p>
                                    <p className="text-2xl font-bold text-gray-900 mt-1">{g.items.length}건</p>
                                </div>
                            ))}
                        </div>
                    )}

                    {list.length === 0 ? (
                        <div className="glass-panel p-12 text-center text-gray-400 text-sm">
                            {showAcked
                                ? '확인 처리한 알림이 없습니다.'
                                : records.length === 0
                                    ? '등록된 항목이 없습니다. 인증서 관리 또는 특허 관리에서 먼저 등록하세요.'
                                    : '지금 알림 단계에 걸린 항목이 없습니다.'}
                        </div>
                    ) : (
                        <div className="glass-panel overflow-hidden divide-y">
                            {list.map(a => (
                                <div key={a.record.recordId} className="px-5 py-4 flex flex-wrap items-center gap-x-3 gap-y-2 hover:bg-gray-50">
                                    <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${a.record.kind === 'cert' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>
                                        {a.record.kind === 'cert' ? '인증' : '권리'}
                                    </span>
                                    <span className="font-bold text-gray-900">{a.record.title}</span>
                                    <span className="px-2 py-0.5 rounded bg-gray-100 text-gray-500 text-[10px]">{a.record.badge}</span>
                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">{a.record.actionLabel}</span>
                                    <span className="font-mono text-xs text-gray-500">{a.record.actionDate}</span>
                                    <DDayBadge dDay={a.dDay} />
                                    <span className="text-[10px] text-gray-400">
                                        {a.dDay < 0 ? '기한 경과' : `알림단계 D-${a.stage}`}
                                    </span>
                                    <span className="ml-auto flex items-center gap-2">
                                        <span className="text-xs text-gray-400">{a.record.manager || '담당 미지정'}</span>
                                        {a.acked ? (
                                            <button onClick={() => onUnack(a.record, a.stage)}
                                                className="text-xs font-bold text-slate-500 border px-2.5 py-1 rounded hover:bg-gray-100">확인 취소</button>
                                        ) : (
                                            <button onClick={() => onAck(a.record, a.stage)}
                                                className="flex items-center gap-1 text-xs font-bold text-emerald-600 border border-emerald-200 bg-emerald-50 px-2.5 py-1 rounded hover:bg-emerald-100">
                                                <Icons.Check /> 확인
                                            </button>
                                        )}
                                    </span>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // --- 갱신 일정 ---
        function SchedulePage({ records }) {
            const [monthsAhead, setMonthsAhead] = useState(12);

            const rows = useMemo(() => records
                .map(r => ({ ...r, dDay: diffDaysFromToday(r.actionDate) })), [records]);

            const undated = useMemo(() => rows.filter(r => r.dDay === null), [rows]);
            const past = useMemo(() => rows.filter(r => r.dDay !== null && r.dDay < 0).sort((a, b) => a.dDay - b.dDay), [rows]);

            const months = useMemo(() => {
                const base = todayDateOnly();
                const buckets = [];
                for (let i = 0; i < monthsAhead; i++) {
                    const d = new Date(base.getFullYear(), base.getMonth() + i, 1);
                    buckets.push({ key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, year: d.getFullYear(), month: d.getMonth() + 1, items: [] });
                }
                const index = new Map(buckets.map(b => [b.key, b]));
                rows.forEach(r => {
                    if (r.dDay === null || r.dDay < 0) return;
                    const bucket = index.get(String(r.actionDate).slice(0, 7));
                    if (bucket) bucket.items.push(r);
                });
                buckets.forEach(b => b.items.sort((x, y) => x.dDay - y.dDay));
                return buckets;
            }, [rows, monthsAhead]);

            // 연속으로 비어 있는 달은 한 줄로 접어 스크롤 낭비를 줄인다.
            const grouped = useMemo(() => {
                const groups = [];
                months.forEach(m => {
                    const isEmpty = m.items.length === 0;
                    const last = groups[groups.length - 1];
                    if (isEmpty && last && last.empty) last.months.push(m);
                    else groups.push({ empty: isEmpty, months: [m] });
                });
                return groups;
            }, [months]);

            const upcoming = months.reduce((a, m) => a + m.items.length, 0);
            const upcomingCost = months.reduce((a, m) => a + m.items.reduce((x, i) => x + num(i.cost), 0), 0);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">갱신 일정</h2>
                        <div className="flex gap-1">
                            {[6, 12, 24].map(m => (
                                <button key={m} onClick={() => setMonthsAhead(m)}
                                    className={`px-3 py-1.5 rounded text-xs font-bold transition-colors ${monthsAhead === m ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600 hover:bg-gray-50'}`}>
                                    {m}개월
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <StatCard title={`향후 ${monthsAhead}개월 기한`} value={`${upcoming}건`} subtext="대응이 필요한 인증·권리" color="blue" />
                        <StatCard title="예상 연차료" value={`₩${upcomingCost.toLocaleString()}`} subtext="해당 기간 특허 연차료 합계" color="emerald" />
                    </div>

                    {past.length > 0 && (
                        <div className="bg-slate-800 text-white rounded-lg p-4">
                            <h4 className="font-bold text-sm mb-1 flex items-center gap-2"><Icons.Alert /> 기한 경과 ({past.length}건)</h4>
                            <p className="text-[11px] text-slate-300 mb-3">일정에 잡히기 전에 먼저 정리해야 하는 건입니다.</p>
                            <div className="space-y-1">
                                {past.map(r => (
                                    <div key={r.recordId} className="flex flex-wrap items-center gap-2 bg-slate-700 px-3 py-2 rounded text-xs">
                                        <span className="font-bold">{r.title}</span>
                                        <span className="font-mono text-slate-300">{r.actionDate}</span>
                                        <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-500">{Math.abs(r.dDay)}일 경과</span>
                                        <span className="text-[10px] text-amber-300">{r.actionLabel}</span>
                                        <span className="ml-auto text-slate-300">{r.manager || '담당 미지정'}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    <div className="space-y-4">
                        {grouped.map(group => {
                            if (group.empty) {
                                const first = group.months[0], last = group.months[group.months.length - 1];
                                const range = group.months.length === 1
                                    ? `${first.year}년 ${first.month}월`
                                    : `${first.year}년 ${first.month}월 ~ ${last.year}년 ${last.month}월`;
                                return (
                                    <div key={'empty-' + first.key} className="flex items-center gap-3 px-5 py-2.5 rounded-lg border border-dashed border-gray-200 text-xs text-gray-400">
                                        <span className="font-medium text-gray-500">{range}</span><span>기한 도래 없음</span>
                                        <span className="ml-auto">{group.months.length}개월</span>
                                    </div>
                                );
                            }
