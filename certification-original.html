                                                <div><label className="text-[10px] text-teal-700 block mb-1">연차료 (원)</label>
                                                    <input type="number" min="0" className="w-full border rounded px-3 py-1.5 text-sm"
                                                        value={form.annuityFee} onChange={e => setForm({ ...form, annuityFee: parseInt(e.target.value) || 0 })} /></div>
                                            </div>
                                            {formNext ? (
                                                <p className="text-[10px] text-teal-700 font-bold">다음 납부: {formNext.year}년차 · {formNext.due}</p>
                                            ) : (
                                                <p className="text-[10px] text-teal-600">등록일을 입력하면 다음 납부기한을 계산합니다.</p>
                                            )}
                                            <p className="text-[10px] text-teal-600">설정등록 때 1~3년분을 함께 내므로 보통 3부터 시작합니다.</p>
                                        </>
                                    )}
                                </div>

                                {field('대리인 (특허사무소)', input('agent', { placeholder: '예: ○○특허법률사무소' }))}

                                <div className="bg-amber-50 p-3 rounded border border-amber-100">
                                    <label className="text-[10px] text-amber-700 block mb-1 font-bold">개별 알림 단계 (일, 쉼표 구분)</label>
                                    <input className="w-full border rounded px-3 py-1.5 text-sm"
                                        placeholder={`비우면 공통 설정 (${alertStages.join(', ')})`}
                                        value={form.alertDays} onChange={e => setForm({ ...form, alertDays: e.target.value })} />
                                </div>

                                {input('manager', { placeholder: '사내 담당자' })}
                                {field('증빙 문서 링크', input('docLink', { placeholder: '사내 문서함 URL (선택)' }))}
                                <p className="text-[10px] text-gray-400 -mt-1 ml-1">이 앱은 파일을 올리지 않습니다. 등록원부·공보는 링크로 남겨 주세요.</p>
                                <textarea className="w-full border rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500" rows="2"
                                    placeholder="비고" value={form.memo} onChange={e => setForm({ ...form, memo: e.target.value })} />

                                <button className="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">{editId ? '수정 저장' : '등록'}</button>
                                {editId && <button type="button" onClick={reset} className="w-full text-xs text-gray-400">취소</button>}
                            </form>
                        </div>

                        <div ref={listRef} className="flex-1 space-y-3 min-w-0">
                            <div className="flex flex-col sm:flex-row gap-2">
                                <div className="relative flex-1">
                                    <input type="text" placeholder="명칭, 출원·등록번호, 대리인 검색..." value={search} onChange={e => setSearch(e.target.value)}
                                        className="w-full pl-8 pr-3 py-2 text-sm border rounded bg-white focus:ring-2 focus:ring-blue-500 outline-none" />
                                    <span className="absolute left-2.5 top-2.5 text-gray-400"><Icons.Search /></span>
                                </div>
                                <select value={pageSize} onChange={e => setPageSize(Number(e.target.value))}
                                    className="border rounded px-3 py-2 text-sm bg-white sm:w-32">
                                    {[20, 50, 100].map(n => <option key={n} value={n}>{n}개씩</option>)}
                                </select>
                            </div>

                            {filtered.length > 0 && (
                                <p className="text-xs text-gray-500">
                                    총 {filtered.length}건 중 {startIndex + 1}~{Math.min(startIndex + pageSize, filtered.length)}건
                                    {search && <span className="text-gray-400"> · 검색: {search}</span>}
                                    <span className="text-gray-400"> · 줄을 누르면 상세가 펼쳐집니다</span>
                                </p>
                            )}

                            {filtered.length === 0 ? (
                                <div className="glass-panel p-12 text-center text-gray-400 text-sm">
                                    {patents.length === 0 ? '등록된 산업재산권이 없습니다. 왼쪽 양식으로 첫 권리를 추가하세요.' : '검색 결과가 없습니다.'}
                                </div>
                            ) : (
                                <div className="glass-panel overflow-hidden">
                                    <div className="overflow-x-auto custom-scroll">
                                        <table className="w-full min-w-[610px] text-sm">
                                            <thead className="bg-gray-50 border-b text-xs text-gray-500">
                                                <tr>
                                                    <th className="text-left font-medium px-4 py-2.5">명칭</th>
                                                    <th className="text-left font-medium px-3 py-2.5 w-[150px]">다음 기한</th>
                                                    <th className="text-left font-medium px-3 py-2.5 w-[100px]">남은 기간</th>
                                                    <th className="text-left font-medium px-3 py-2.5 w-[80px] hidden xl:table-cell">담당자</th>
                                                    <th className="text-right font-medium px-4 py-2.5 w-[144px]">관리</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-100">
                                                {pageRows.map(p => {
                                                    const t = getIpType(p.rightType);
                                                    const rec = toRecord(p, 'patent');
                                                    const dDay = diffDaysFromToday(rec.actionDate);
                                                    const history = Array.isArray(p.history) ? p.history : [];
                                                    const open = expandedId === p.id;
                                                    return (
                                                        <React.Fragment key={p.id}>
                                                            <tr onClick={() => setExpandedId(open ? null : p.id)}
                                                                className={`cursor-pointer align-middle ${open ? 'bg-blue-50/60' : 'hover:bg-gray-50'}`}>
                                                                <td className="px-4 py-2.5">
                                                                    <div className="flex items-center gap-2 min-w-0">
                                                                        <span className={`shrink-0 text-gray-400 transition-transform ${open ? 'rotate-90' : ''}`}>
                                                                            <Icons.Chevron />
                                                                        </span>
                                                                        <span className="font-medium text-gray-900 truncate" title={p.name}>{p.name}</span>
                                                                        <span className="shrink-0 px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 text-[10px] font-bold">{t.label}</span>
                                                                    </div>
                                                                </td>
                                                                <td className="px-3 py-2.5">
                                                                    <span className="block text-[10px] text-gray-400 leading-tight">{rec.actionLabel}</span>
                                                                    <span className="block font-mono text-xs text-gray-700">{rec.actionDate || '미설정'}</span>
                                                                </td>
                                                                <td className="px-3 py-2.5"><DDayBadge dDay={dDay} /></td>
                                                                <td className="px-3 py-2.5 text-xs text-gray-600 truncate hidden xl:table-cell">{p.manager || '-'}</td>
                                                                <td className="px-4 py-2.5" onClick={e => e.stopPropagation()}>
                                                                    <div className="flex items-center justify-end gap-2">
                                                                        {!t.renewable && (
                                                                            <button onClick={() => onPay(p)} title="연차료 납부 처리"
                                                                                className="flex shrink-0 items-center gap-1 whitespace-nowrap text-[11px] font-bold text-teal-600 border border-teal-200 bg-teal-50 px-2 py-1 rounded hover:bg-teal-100">
                                                                                <Icons.Check /> 납부
                                                                            </button>
                                                                        )}
                                                                        <button onClick={() => startEdit(p)} title="수정" className="text-blue-400 hover:text-blue-600"><Icons.Edit /></button>
                                                                        <button onClick={() => onDelete(p.id)} title="삭제" className="text-red-300 hover:text-red-500"><Icons.Trash /></button>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                            {open && (
                                                                <tr className="bg-blue-50/30">
                                                                    <td colSpan="5" className="px-4 pt-1 pb-4">
                                                                        <div className="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-2">
                                                                            <div><p className="text-[10px] text-gray-400">출원번호</p><p className="text-gray-800 text-xs break-all">{p.applicationNo || '-'}</p></div>
                                                                            <div><p className="text-[10px] text-gray-400">출원일</p><p className="text-gray-800 text-xs">{p.applicationDate || '-'}</p></div>
                                                                            <div><p className="text-[10px] text-gray-400">등록번호</p><p className="text-gray-800 text-xs break-all">{p.registrationNo || '-'}</p></div>
                                                                            <div><p className="text-[10px] text-gray-400">등록일</p><p className="text-gray-800 text-xs">{p.registrationDate || '-'}</p></div>
                                                                            <div><p className="text-[10px] text-gray-400">존속기간 만료</p><p className="text-gray-800 text-xs">{patentTermEnd(p) || '-'}</p></div>
                                                                            {!t.renewable && (
                                                                                <div><p className="text-[10px] text-gray-400">납부 완료</p><p className="text-gray-800 text-xs">{p.paidThroughYear || 0}년차까지</p></div>
                                                                            )}
                                                                            <div><p className="text-[10px] text-gray-400">{t.renewable ? '갱신등록료' : '연차료'}</p><p className="text-gray-900 text-xs font-bold">{num(p.annuityFee) > 0 ? formatKrw(p.annuityFee) : '-'}</p></div>
                                                                            <div><p className="text-[10px] text-gray-400">대리인</p><p className="text-gray-800 text-xs">{p.agent || '-'}</p></div>
                                                                            <div className="xl:hidden"><p className="text-[10px] text-gray-400">담당자</p><p className="text-gray-800 text-xs">{p.manager || '-'}</p></div>
                                                                            <div><p className="text-[10px] text-gray-400">알림 단계</p>
                                                                                <p className="text-gray-800 text-xs">{parseStages(p.alertDays).length ? parseStages(p.alertDays).sort((a, b) => b - a).join(' / ') + '일' : '공통 설정'}</p></div>
                                                                            {p.docLink && (
                                                                                <div><p className="text-[10px] text-gray-400">증빙 문서</p>
                                                                                    <a href={p.docLink} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline text-xs break-all">링크 열기</a></div>
                                                                            )}
                                                                        </div>
                                                                        {history.length > 0 && (
                                                                            <div className="mt-3 pt-3 border-t border-blue-100">
                                                                                <p className="text-[10px] text-gray-400 mb-1.5">납부 이력 {history.length}건</p>
                                                                                <div className="flex flex-wrap gap-1.5">
                                                                                    {history.map(h => (
                                                                                        <span key={h.id} className="text-[11px] bg-white border rounded px-2 py-1 text-gray-600">
                                                                                            {h.year}년차 <span className="text-gray-400">{h.paidAt}</span>
                                                                                            {num(h.fee) > 0 && <span className="ml-1 font-medium text-gray-700">{formatKrw(h.fee)}</span>}
                                                                                        </span>
                                                                                    ))}
                                                                                </div>
                                                                            </div>
                                                                        )}
                                                                        {p.memo && <p className="mt-3 pt-3 border-t border-blue-100 text-xs text-gray-500 whitespace-pre-wrap">{p.memo}</p>}
                                                                    </td>
                                                                </tr>
                                                            )}
                                                        </React.Fragment>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            <Pagination page={safePage} totalPages={totalPages} onGo={goPage} />
                        </div>
                    </div>
                </div>
            );
        }

        // --- 인증 갱신 처리 모달 ---
        // 현재 취득일/만료일을 이력으로 넘기고 새 주기를 입력받는다.
        function RenewCertModal({ cert, onClose, onSubmit }) {
            const [form, setForm] = useState({
                acquiredDate: cert.expiryDate || '',
                expiryDate: '',
                certNo: cert.certNo || '',
            });

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b flex justify-between items-center bg-gray-50">
                            <h3 className="font-bold text-gray-800">{cert.name} 갱신 처리</h3>
                            <button onClick={onClose} className="hover:bg-gray-200 p-1 rounded"><Icons.XMark /></button>
                        </div>
                        <form className="p-5 space-y-3" onSubmit={(e) => { e.preventDefault(); onSubmit(form); }}>
                            <div className="bg-slate-50 border rounded p-3 text-xs text-slate-600">
                                <p className="font-bold text-slate-700 mb-1">현재 정보 (이력으로 이동)</p>
                                <p>{cert.acquiredDate || '-'} ~ {cert.expiryDate || '-'}</p>
                                <p>{cert.issuer || '기관 미입력'}{cert.certNo ? ` · ${cert.certNo}` : ''}</p>
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">새 취득일</label>
                                    <input type="date" required className="w-full border rounded px-3 py-2 text-sm" value={form.acquiredDate} onChange={e => setForm({ ...form, acquiredDate: e.target.value })} /></div>
                                <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">새 만료일</label>
                                    <input type="date" required className="w-full border rounded px-3 py-2 text-sm" value={form.expiryDate} onChange={e => setForm({ ...form, expiryDate: e.target.value })} /></div>
                            </div>
                            {form.acquiredDate && form.expiryDate && form.acquiredDate > form.expiryDate && (
                                <p className="text-[10px] text-red-500 ml-1">취득일이 만료일보다 늦습니다.</p>
                            )}
                            <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">인증번호 (바뀐 경우)</label>
                                <input className="w-full border rounded px-3 py-2 text-sm" value={form.certNo} onChange={e => setForm({ ...form, certNo: e.target.value })} /></div>

                            <p className="text-[11px] text-gray-400 ml-1">갱신하면 이 인증의 알림 확인 기록이 초기화되고 새 만료일 기준으로 다시 알립니다.</p>

                            <div className="flex justify-end gap-2 pt-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-sm text-gray-500">취소</button>
                                <button type="submit" className="bg-emerald-600 text-white px-5 py-2 rounded font-bold text-sm hover:bg-emerald-700">갱신 처리</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- 연차료 납부 처리 모달 ---
        function PayAnnuityModal({ patent, onClose, onSubmit }) {
            const next = nextAnnuity(patent);
            const [form, setForm] = useState({
                years: 1,
                paidAt: toDateString(todayDateOnly()),
                fee: num(patent.annuityFee),
            });

            if (!next) {
                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in" onClick={onClose}>
                        <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 text-center" onClick={e => e.stopPropagation()}>
                            <p className="text-sm text-gray-600">
                                {patent.registrationDate
                                    ? '존속기간이 끝나 더 낼 연차료가 없습니다.'
                                    : '등록일을 먼저 입력해야 연차료를 계산할 수 있습니다.'}
                            </p>
                            <button onClick={onClose} className="mt-4 bg-gray-200 px-4 py-2 rounded text-sm">닫기</button>
                        </div>
                    </div>
                );
            }

            const paid = Math.max(0, parseInt(patent.paidThroughYear) || 0);
            const years = Math.max(1, parseInt(form.years) || 1);
            const nextDue = addYears(patent.registrationDate, paid + years);
            const termEnd = patentTermEnd(patent);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl max-w-md w-full overflow-hidden" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b flex justify-between items-center bg-gray-50">
                            <h3 className="font-bold text-gray-800">{patent.name} 연차료 납부</h3>
                            <button onClick={onClose} className="hover:bg-gray-200 p-1 rounded"><Icons.XMark /></button>
                        </div>
                        <form className="p-5 space-y-3" onSubmit={(e) => { e.preventDefault(); onSubmit({ ...form, years }); }}>
                            <div className="bg-slate-50 border rounded p-3 text-xs text-slate-600">
                                <p className="font-bold text-slate-700 mb-1">현재 상태</p>
                                <p>{paid}년차까지 납부 완료 · 다음은 {next.year}년차</p>
                                <p>납부기한 {next.due}{termEnd ? ` · 존속기간 만료 ${termEnd}` : ''}</p>
                            </div>

                            <div className="grid grid-cols-2 gap-2">
                                <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">납부 연차 수</label>
                                    <input type="number" min="1" className="w-full border rounded px-3 py-2 text-sm" value={form.years} onChange={e => setForm({ ...form, years: parseInt(e.target.value) || 1 })} /></div>
                                <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">납부일</label>
                                    <input type="date" required className="w-full border rounded px-3 py-2 text-sm" value={form.paidAt} onChange={e => setForm({ ...form, paidAt: e.target.value })} /></div>
                            </div>
                            <div><label className="text-[10px] text-gray-400 ml-1 block mb-1">납부 금액 (원)</label>
                                <input type="number" min="0" className="w-full border rounded px-3 py-2 text-sm" value={form.fee} onChange={e => setForm({ ...form, fee: parseInt(e.target.value) || 0 })} /></div>

                            <p className="text-xs text-teal-700 font-bold ml-1">
                                {next.year}년차{years > 1 ? ` ~ ${next.year + years - 1}년차` : ''} 납부 처리 · 다음 기한 {nextDue}
                                {termEnd && nextDue > termEnd && <span className="block text-gray-400 font-normal">존속기간이 먼저 끝납니다.</span>}
                            </p>

                            <div className="flex justify-end gap-2 pt-2">
                                <button type="button" onClick={onClose} className="px-4 py-2 text-sm text-gray-500">취소</button>
                                <button type="submit" className="bg-teal-600 text-white px-5 py-2 rounded font-bold text-sm hover:bg-teal-700">납부 처리</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- 기관별 현황 ---
        function IssuerPage({ records }) {
            const groups = useMemo(() => {
                const map = new Map();
                records.forEach(r => {
                    const key = (r.org || '').trim() || '(기관·대리인 미입력)';
                    if (!map.has(key)) map.set(key, { name: key, items: [] });
                    map.get(key).items.push(r);
                });
                return [...map.values()]
                    .map(g => ({
                        ...g,
                        certCount: g.items.filter(i => i.kind === 'cert').length,
                        patentCount: g.items.filter(i => i.kind === 'patent').length,
                        cost: g.items.reduce((a, i) => a + num(i.cost), 0),
                        nextAction: g.items
                            .map(i => ({ title: i.title, date: i.actionDate, dDay: diffDaysFromToday(i.actionDate), label: i.actionLabel }))
                            .filter(x => x.dDay !== null)
                            .sort((a, b) => a.dDay - b.dDay)[0] || null,
                    }))
                    .sort((a, b) => b.items.length - a.items.length);
            }, [records]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div>
                        <h2 className="text-2xl font-bold text-gray-800">기관별 현황</h2>
                        <p className="text-sm text-gray-500 mt-1">인증기관과 특허 대리인 기준으로 묶어 봅니다. 같은 곳에 여러 건이 걸려 있으면 한 번에 처리하는 편이 낫습니다.</p>
                    </div>

                    {groups.length === 0 ? (
                        <div className="glass-panel p-12 text-center text-gray-400 text-sm">등록된 항목이 없습니다.</div>
                    ) : groups.map(g => (
                        <div key={g.name} className="glass-panel p-5">
                            <div className="flex flex-wrap items-start justify-between gap-3">
                                <h4 className="font-bold text-gray-900">{g.name}</h4>
                                <div className="flex flex-wrap gap-4 text-sm">
                                    <div className="text-right"><p className="text-[10px] text-gray-400">인증</p><p className="font-bold text-gray-800">{g.certCount}건</p></div>
                                    <div className="text-right"><p className="text-[10px] text-gray-400">산업재산권</p><p className="font-bold text-gray-800">{g.patentCount}건</p></div>
                                    <div className="text-right"><p className="text-[10px] text-gray-400">연차료 합계</p><p className="font-bold text-gray-900">{g.cost > 0 ? formatKrw(g.cost) : '-'}</p></div>
                                </div>
                            </div>
                            {g.nextAction && (
                                <p className="mt-3 text-xs text-amber-700">
                                    가장 이른 기한 · {g.nextAction.title} ({g.nextAction.label}) {g.nextAction.date}
                                    <span className="ml-2 font-bold">{g.nextAction.dDay >= 0 ? `D-${g.nextAction.dDay}` : `${Math.abs(g.nextAction.dDay)}일 경과`}</span>
                                </p>
                            )}
                            <div className="mt-3 pt-3 border-t flex flex-wrap gap-2">
                                {g.items.map(i => (
                                    <span key={i.recordId} className="px-2.5 py-1 rounded border text-xs text-gray-600">
                                        <span className={`inline-block w-1.5 h-1.5 rounded-full mr-1.5 align-middle ${i.kind === 'cert' ? 'bg-blue-500' : 'bg-purple-500'}`}></span>
                                        {i.title} <span className="text-gray-400 ml-1">{i.actionDate || '기한 미설정'}</span>
                                    </span>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        }

        // --- 감사 로그 ---
        function AuditLogPage({ auditLogs }) {
            const [search, setSearch] = useState('');
            const [action, setAction] = useState('all');

            const filtered = useMemo(() => {
                const q = search.trim().toLowerCase();
                return [...auditLogs]
                    .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0))
                    .filter(log => {
                        if (action !== 'all' && log.action !== action) return false;
                        if (!q) return true;
                        return [log.message, log.action, JSON.stringify(log.before || ''), JSON.stringify(log.after || '')]
                            .join(' ').toLowerCase().includes(q);
                    });
            }, [auditLogs, search, action]);

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800">감사 로그</h2>
                            <p className="text-sm text-gray-500 mt-1">누가 언제 인증·특허 정보를 바꿨는지 기록합니다. 최근 300건까지 표시됩니다.</p>
                        </div>
                        <span className="text-sm text-gray-500">{filtered.length}건</span>
                    </div>

                    <div className="glass-panel p-4 grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div className="md:col-span-2 relative">
                            <input type="text" placeholder="내용 검색..." value={search} onChange={e => setSearch(e.target.value)}
                                className="w-full pl-8 pr-3 py-2 text-sm border rounded bg-gray-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none" />
                            <span className="absolute left-2.5 top-2.5 text-gray-400"><Icons.Search /></span>
                        </div>
                        <select value={action} onChange={e => setAction(e.target.value)} className="border rounded px-3 py-2 text-sm bg-white">
                            <option value="all">전체 작업</option>

                    <div className="glass-panel overflow-hidden">
                        {filtered.length === 0 ? (

                            <div className="divide-y max-h-[640px] overflow-y-auto custom-scroll">

                                    const act = AUDIT_ACTIONS[log.action] || { label: log.action || '-', cls: 'bg-gray-100 text-gray-600' };
                                    const changes = diffAuditSnapshots(log.before, log.after, log.target);
                                    return (
                                        <div key={log.id} className="px-5 py-4 hover:bg-gray-50">
                                            <div className="flex flex-wrap items-center gap-2 text-sm">
                                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${act.cls}`}>{act.label}</span>
                                                {log.target && (
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${log.target === 'cert' ? 'bg-blue-50 text-blue-600' : 'bg-purple-50 text-purple-600'}`}>
                                                        {log.target === 'cert' ? '인증' : '권리'}
                                                    </span>
                                                )}
                                                <span className="text-gray-800">{log.message || '-'}</span>
                                                <span className="ml-auto text-xs text-gray-400 font-mono">
                                                    {log.createdAt ? new Date(log.createdAt).toLocaleString('ko-KR') : '-'}

                                                <div className="mt-2 flex flex-wrap gap-1.5">

                                                            <span className="line-through text-gray-400">{c.from}</span>

                                                            <span className="font-medium text-gray-800">{c.to}</span>

        // --- 환경설정 ---
        function SettingsPage({ isDemoMode, alertStages, onSaveStages, onImportCsv }) {
            const [stages, setStages] = useState(alertStages);
            const [newStage, setNewStage] = useState('');
            const [savingStages, setSavingStages] = useState(false);
            const [file, setFile] = useState(null);
            const [preview, setPreview] = useState(null);
            const [importing, setImporting] = useState(false);
            const [fileKey, setFileKey] = useState(0);

            useEffect(() => { setStages(alertStages); }, [alertStages]);

            const addStage = () => {
                const v = parseInt(newStage, 10);
                if (Number.isNaN(v) || v <= 0) { alert('1 이상의 숫자를 입력하세요.'); return; }
                if (stages.includes(v)) { alert('이미 있는 단계입니다.'); return; }
                setStages([...stages, v].sort((a, b) => b - a));
                setNewStage('');
            };

            const dirty = stages.join(',') !== alertStages.join(',');

            const handleFile = (e) => {
                const f = e.target.files[0];
                setFile(f || null);
                setPreview(null);
                if (!f) return;
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const rows = parseCSV(reader.result);
                        if (rows.length < 2) throw new Error('데이터 행이 없습니다.');
                        const headers = rows[0].map(h => String(h).trim());
                        const certIdx = headers.indexOf('인증명');
                        const patentIdx = headers.indexOf('발명의명칭');
                        if (certIdx < 0 && patentIdx < 0) {
                            throw new Error("CSV 헤더에 '인증명' 또는 '발명의명칭' 컬럼이 필요합니다.");
                        }
                        const kind = certIdx >= 0 ? 'cert' : 'patent';
                        const nameIdx = certIdx >= 0 ? certIdx : patentIdx;
                        const samples = rows.slice(1).map(r => String(r[nameIdx] || '').trim()).filter(Boolean);
                        setPreview({ rows, kind, count: samples.length, samples: samples.slice(0, 8) });
                    } catch (err) {
                        setPreview({ error: err.message });
                    }
                };
                reader.readAsText(f, 'utf-8');
            };

            const runImport = async () => {
                if (!preview || preview.error || !preview.count) return;
                const kindLabel = preview.kind === 'cert' ? '인증서' : '산업재산권';
                if (!confirm(`${kindLabel} ${preview.count}건을 추가합니다. 기존 데이터는 지워지지 않고 함께 남습니다.\n계속하시겠습니까?`)) return;
                setImporting(true);
                const added = await onImportCsv(preview.rows, preview.kind);
                setImporting(false);
                setFile(null); setPreview(null); setFileKey(k => k + 1);
                alert(`${added}건을 복원했습니다.`);
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">환경설정</h2>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="glass-panel p-6 h-fit">
                            <h3 className="text-lg font-semibold mb-1 flex items-center gap-2"><Icons.Bell /> 공통 알림 단계</h3>
                            <p className="text-xs text-gray-500 mb-4">
                                만료일·연차료 기한이 이 일수 이내로 다가오면 알림 센터에 뜹니다.
                                항목마다 따로 지정하면 그 값이 우선합니다.
                            </p>

                            <div className="flex flex-wrap gap-2 mb-3 min-h-[36px]">
                                {stages.length === 0 && <span className="text-xs text-gray-400 py-2">단계가 없습니다. 최소 한 개는 있어야 알림이 동작합니다.</span>}
                                {stages.map(s => (
                                    <span key={s} className="flex items-center gap-1.5 pl-3 pr-1.5 py-1.5 rounded-full bg-amber-50 border border-amber-200 text-xs font-bold text-amber-800">
                                        D-{s}
                                        <button type="button" onClick={() => setStages(stages.filter(x => x !== s))}
                                            className="text-amber-500 hover:text-amber-800 leading-none px-1" title={`D-${s} 단계 삭제`}>×</button>
                                    </span>
                                ))}
                            </div>

                            <div className="flex gap-2">
                                <input type="number" min="1" placeholder="예: 45" className="flex-1 border rounded px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500"
                                    value={newStage} onChange={e => setNewStage(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); addStage(); } }} />
                                <button type="button" onClick={addStage} className="border px-4 rounded text-sm font-bold text-slate-600 hover:bg-gray-50">단계 추가</button>
                            </div>

                            <div className="flex items-center gap-2 mt-3">
                                <button type="button" disabled={savingStages || !dirty}
                                    onClick={async () => {
                                        setSavingStages(true);
                                        const ok = await onSaveStages(stages);
                                        setSavingStages(false);
                                        alert(ok ? '저장했습니다.' : '단계를 최소 한 개 이상 지정하세요.');
                                    }}
                                    className="bg-slate-800 text-white px-4 py-2 rounded text-sm font-bold hover:bg-slate-700 disabled:opacity-40">
                                    {savingStages ? '저장중' : '저장'}
                                </button>
                                {dirty && <button type="button" onClick={() => setStages(alertStages)} className="text-xs text-gray-400">되돌리기</button>}
                                <span className="ml-auto text-[11px] text-gray-400">기본값 {DEFAULT_ALERT_STAGES.join(' / ')}일</span>
                            </div>
                        </div>

                        <div className="glass-panel p-6 h-fit">
                            <h3 className="text-lg font-semibold mb-1 flex items-center gap-2"><Icons.Download /> CSV 복원</h3>
                            <p className="text-xs text-gray-500 mb-4">
                                인증서 관리 또는 특허 관리에서 내려받은 CSV 를 다시 불러옵니다.
                                헤더를 보고 어느 대장인지 자동으로 판단하며, 기존 데이터는 지워지지 않고 뒤에 추가됩니다.
                            </p>
                            <input key={fileKey} type="file" accept=".csv,text/csv" onChange={handleFile}
                                className="w-full text-xs border rounded p-2 bg-white" />
                            {preview && preview.error && <p className="text-xs text-red-500 mt-2">{preview.error}</p>}
                            {preview && !preview.error && (
                                <div className="mt-3 border rounded p-3 bg-slate-50 text-xs text-slate-600">
                                    <p className="font-bold text-slate-700">{preview.kind === 'cert' ? '인증서' : '산업재산권'} {preview.count}건 확인</p>
                                    <p className="mt-1 text-[11px] text-slate-500">{preview.samples.join(', ')}{preview.count > preview.samples.length ? ' 외' : ''}</p>
                                </div>
                            )}
                            <button type="button" disabled={!preview || preview.error || importing}
                                onClick={runImport}
                                className="w-full mt-3 bg-emerald-600 text-white py-2 rounded font-bold text-sm hover:bg-emerald-700 disabled:opacity-40">
                                {importing ? '복원 중...' : 'CSV 복원 실행'}
                            </button>
                        </div>
                    </div>

                    <div className="glass-panel p-6 max-w-xl">
                        <h3 className="text-lg font-semibold mb-4 flex items-center gap-2"><Icons.Settings /> 클라우드 연결</h3>
                        <div className="border rounded p-3 bg-slate-50 text-xs text-slate-600 space-y-1">
                            <p className="flex justify-between"><span className="text-slate-400">프로젝트</span><span className="font-mono">{window.userFirebaseConfig?.projectId || '-'}</span></p>
                            <p className="flex justify-between"><span className="text-slate-400">로그인 계정</span><span className="font-mono">{window.officeflowSessionInfo.email || '-'}</span></p>
                            <p className="flex justify-between gap-2"><span className="text-slate-400 shrink-0">데이터 공간</span><span className="font-mono truncate">{window.certAppId}</span></p>
                            <p className="pt-1 text-[11px] text-slate-400">
                                {isDemoMode ? '데모 모드: 이 브라우저에서만 임시 저장됩니다.' : 'OfficeFlow One 로그인 계정별로 데이터가 분리 저장됩니다.'}
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 메인 ---
        function App() {
            const { services, user, errorMsg } = useFirebase();
            const [activeTab, setActiveTab] = useState('dashboard');
            const [certs, setCerts] = useState([]);
            const [patents, setPatents] = useState([]);
            const [auditLogs, setAuditLogs] = useState([]);
            const [settingsDocs, setSettingsDocs] = useState([]);
            const [renewTarget, setRenewTarget] = useState(null);
            const [payTarget, setPayTarget] = useState(null);
            const [loading, setLoading] = useState(true);
            const [isDemoMode, setIsDemoMode] = useState(false);

            useEffect(() => {
                if (isDemoMode) { setLoading(false); return; }
                if (!services || !user) return;
                const { certCollection, onSnapshot } = window.firebaseModules;
                const unsubCerts = onSnapshot(certCollection(services.db, 'certifications'),
                    (snap) => { setCerts(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setLoading(false); },
                    (err) => { if (err.code === 'permission-denied') setIsDemoMode(true); setLoading(false); }
                );
                const unsubPatents = onSnapshot(certCollection(services.db, 'patents'),
                    (snap) => setPatents(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    () => {}
                );
                const unsubLogs = onSnapshot(certCollection(services.db, 'auditLogs'),
                    (snap) => setAuditLogs(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    () => {}
                );
                const unsubSettings = onSnapshot(certCollection(services.db, 'settings'),
                    (snap) => setSettingsDocs(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
                    () => {}
                );
                return () => { unsubCerts(); unsubPatents(); unsubLogs(); unsubSettings(); };
            }, [services, user, isDemoMode]);

            // settings/general 에 저장된 공통 알림 단계. 없으면 기본값.
            const alertStages = useMemo(() => {
                const general = settingsDocs.find(d => d.id === 'general');
                const saved = Array.isArray(general && general.alertStages)
                    ? general.alertStages.map(n => parseInt(n, 10)).filter(n => !Number.isNaN(n) && n > 0)
                    : [];
                return (saved.length ? [...new Set(saved)] : DEFAULT_ALERT_STAGES).sort((a, b) => b - a);
            }, [settingsDocs]);

            const records = useMemo(() => buildRecords(certs, patents), [certs, patents]);

            const handleSaveStages = async (next) => {
                const clean = [...new Set(next.map(n => parseInt(n, 10)).filter(n => !Number.isNaN(n) && n > 0))].sort((a, b) => b - a);
                if (clean.length === 0) return false;
                if (isDemoMode) {
                    setSettingsDocs(prev => [...prev.filter(d => d.id !== 'general'), { id: 'general', alertStages: clean }]);
                    return true;
                }
                try {
                    const { setDoc, certDoc } = window.firebaseModules;
                    await setDoc(certDoc(services.db, 'settings', 'general'), { alertStages: clean, updatedAt: new Date().toISOString() });
                    return true;
                } catch (e) { console.warn('alert stage save failed', e); return false; }
            };

            const addAuditLog = async (action, target, message, before, after) => {
                const log = { action, target, message, before: before || null, after: after || null, createdAt: new Date().toISOString() };
                if (isDemoMode) {
                    setAuditLogs(prev => [{ id: 'local_log_' + Date.now(), ...log }, ...prev].slice(0, 300));
                    return;
                }
                try {
                    const { addDoc, certCollection } = window.firebaseModules;
                    await addDoc(certCollection(services.db, 'auditLogs'), log);
                } catch (e) { console.warn('audit log write failed', e); }
            };

            // 인증서와 특허가 같은 흐름을 쓰므로 컬렉션만 갈아끼운다.
            const collectionOf = (target) => (target === 'cert' ? 'certifications' : 'patents');
            const setterOf = (target) => (target === 'cert' ? setCerts : setPatents);
            const listOf = (target) => (target === 'cert' ? certs : patents);

            const handleAdd = (target) => async (data) => {
                const payload = { ...data, history: [], alertAcks: [], createdAt: new Date().toISOString() };
                if (isDemoMode) {
                    setterOf(target)(prev => [...prev, { ...payload, id: 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7) }]);
                } else {
                    try {
                        const { addDoc, certCollection } = window.firebaseModules;
                        await addDoc(certCollection(services.db, collectionOf(target)), payload);
                    } catch (e) {
                        console.error('add failed', e);
                        alert('저장에 실패했습니다. Firestore 규칙을 확인하세요.');
                        return;
                    }
                }
                await addAuditLog('add', target, `${data.name} 등록`, null, snapshotForAudit(payload, target));
            };

            const handleUpdate = (target) => async (id, data) => {
                const before = snapshotForAudit(listOf(target).find(x => x.id === id), target);
                if (isDemoMode) {
                    setterOf(target)(prev => prev.map(x => x.id === id ? { ...x, ...data } : x));
                } else {
                    try {
                        const { updateDoc, certDoc } = window.firebaseModules;
                        await updateDoc(certDoc(services.db, collectionOf(target), id), { ...data, updatedAt: new Date().toISOString() });
                    } catch (e) {
                        console.error('update failed', e);
                        alert('수정에 실패했습니다.');
                        return;
                    }
                }
                await addAuditLog('update', target, `${data.name} 수정`, before, snapshotForAudit(data, target));
            };

            const handleDelete = (target) => async (id) => {
                const item = listOf(target).find(x => x.id === id);
                if (!confirm(`'${item?.name || id}' 항목을 삭제합니다. 계속하시겠습니까?`)) return;
                if (isDemoMode) {
                    setterOf(target)(prev => prev.filter(x => x.id !== id));
                } else {
                    try {
                        const { deleteDoc, certDoc } = window.firebaseModules;
                        await deleteDoc(certDoc(services.db, collectionOf(target), id));
                    } catch (e) {
                        console.error('delete failed', e);
                        alert('삭제에 실패했습니다.');
                        return;
                    }
                }
                await addAuditLog('del', target, `${item?.name || id} 삭제`, snapshotForAudit(item, target), null);
            };

            const writeDoc = async (target, id, patch) => {
                if (isDemoMode) {
                    setterOf(target)(prev => prev.map(x => x.id === id ? { ...x, ...patch } : x));
                    return true;
                }
                try {
                    const { updateDoc, certDoc } = window.firebaseModules;
                    await updateDoc(certDoc(services.db, collectionOf(target), id), patch);
                    return true;
                } catch (e) {
                    console.error('write failed', e);
                    return false;
                }
            };

            // 인증 갱신: 현재 주기를 이력으로 밀어 넣고 새 주기로 교체한다.
            // 기한이 바뀌므로 알림 확인 기록도 비워 새 주기의 알림이 다시 뜨게 한다.
            const handleRenewCert = async (form) => {
                const cert = renewTarget;
                if (!cert) return;
                if (form.acquiredDate && form.expiryDate && form.acquiredDate > form.expiryDate) {
                    alert('취득일이 만료일보다 늦습니다.');
                    return;
                }
                const archived = {
                    id: 'term_' + Date.now(),
                    acquiredDate: cert.acquiredDate || '', expiryDate: cert.expiryDate || '',
                    certNo: cert.certNo || '', recordedAt: new Date().toISOString(),
                };
                const next = {
                    acquiredDate: form.acquiredDate, expiryDate: form.expiryDate, certNo: form.certNo,
                    history: [...(Array.isArray(cert.history) ? cert.history : []), archived],
                    alertAcks: [],
                    updatedAt: new Date().toISOString(),
                };
                const ok = await writeDoc('cert', cert.id, next);
                if (!ok) { alert('갱신 처리에 실패했습니다.'); return; }
                await addAuditLog('renew', 'cert', `${cert.name} 갱신 처리 (만료 ${cert.expiryDate || '-'} → ${form.expiryDate})`,
                    snapshotForAudit(cert, 'cert'), snapshotForAudit({ ...cert, ...next }, 'cert'));
                setRenewTarget(null);
            };

            // 연차료 납부: 납부 완료 연차를 올리고 이력에 남긴다.
            const handlePayAnnuity = async (form) => {
                const patent = payTarget;
                if (!patent) return;
                const info = nextAnnuity(patent);
                if (!info) { setPayTarget(null); return; }
                const years = Math.max(1, parseInt(form.years) || 1);
                const paid = Math.max(0, parseInt(patent.paidThroughYear) || 0);
                const entry = {
                    id: 'pay_' + Date.now(),
                    year: years > 1 ? `${info.year}~${info.year + years - 1}` : String(info.year),
                    due: info.due, paidAt: form.paidAt, fee: num(form.fee),
                    recordedAt: new Date().toISOString(),
                };
                const next = {
                    paidThroughYear: paid + years,
                    annuityFee: num(form.fee) || num(patent.annuityFee),
                    history: [...(Array.isArray(patent.history) ? patent.history : []), entry],
                    alertAcks: [],
                    updatedAt: new Date().toISOString(),
                };
                const ok = await writeDoc('patent', patent.id, next);
                if (!ok) { alert('납부 처리에 실패했습니다.'); return; }
                await addAuditLog('pay', 'patent',
                    `${patent.name} ${entry.year}년차 연차료 납부 (${formatKrw(entry.fee)})`,
                    snapshotForAudit(patent, 'patent'), snapshotForAudit({ ...patent, ...next }, 'patent'));
                setPayTarget(null);
            };

            const handleAck = async (record, stage) => {
                const target = record.kind;
                const item = listOf(target).find(x => x.id === record.id);
                if (!item) return;
                const key = ackKey(record.actionDate, stage);
                const acks = Array.isArray(item.alertAcks) ? item.alertAcks : [];
                if (acks.includes(key)) return;
                const ok = await writeDoc(target, record.id, { alertAcks: [...acks, key] });
                if (!ok) { alert('알림 확인 처리에 실패했습니다.'); return; }
                await addAuditLog('ack', target, `${record.title} D-${stage} 알림 확인 (기한 ${record.actionDate})`, null, null);
            };

            const handleUnack = async (record, stage) => {
                const target = record.kind;
                const item = listOf(target).find(x => x.id === record.id);
                if (!item) return;
                const key = ackKey(record.actionDate, stage);
                const acks = (Array.isArray(item.alertAcks) ? item.alertAcks : []).filter(k => k !== key);
                await writeDoc(target, record.id, { alertAcks: acks });
            };

            // 각 대장에서 내려받은 CSV 를 되돌린다. 계산 컬럼(남은일수/다음기한 등)은 무시한다.
            const handleImportCsv = async (rows, kind) => {
                const headers = rows[0].map(h => String(h).trim());
                const at = (label) => headers.indexOf(label);
                const cell = (row, i) => (i >= 0 ? String(row[i] || '').trim() : '');
                let imported = 0;

                if (kind === 'cert') {
                    const idx = {
                        name: at('인증명'), category: at('구분'), issuer: at('인증기관'), certNo: at('인증번호'),
                        acquiredDate: at('취득일'), expiryDate: at('만료일'), alertDays: at('개별알림단계'),
                        manager: at('담당자'), docLink: at('문서링크'), memo: at('비고'),
                    };
                    for (const row of rows.slice(1)) {
                        const name = cell(row, idx.name);
                        if (!name) continue;
                        const category = cell(row, idx.category);
                        await handleAdd('cert')({
                            ...EMPTY_CERT_FORM,
                            name,
                            category: CERT_CATEGORIES.includes(category) ? category : '기타',
                            issuer: cell(row, idx.issuer),
                            certNo: cell(row, idx.certNo),
                            acquiredDate: cell(row, idx.acquiredDate),
                            expiryDate: cell(row, idx.expiryDate),
                            alertDays: cell(row, idx.alertDays),
                            manager: cell(row, idx.manager),
                            docLink: cell(row, idx.docLink),
                            memo: cell(row, idx.memo),
                        });
                        imported++;
                    }
                    return imported;
                }

                const idx = {
                    name: at('발명의명칭'), rightType: at('권리구분'),
                    applicationNo: at('출원번호'), applicationDate: at('출원일'),
                    registrationNo: at('등록번호'), registrationDate: at('등록일'),
                    paidThroughYear: at('납부완료연차'), annuityFee: at('연차료'),
                    agent: at('대리인'), alertDays: at('개별알림단계'),
                    manager: at('담당자'), docLink: at('문서링크'), memo: at('비고'),
                };
                for (const row of rows.slice(1)) {
                    const name = cell(row, idx.name);
                    if (!name) continue;
                    const typeLabel = cell(row, idx.rightType);
                    const matched = IP_TYPES.find(t => t.label === typeLabel);
                    const paidRaw = parseInt(cell(row, idx.paidThroughYear).replace(/,/g, ''), 10);
                    await handleAdd('patent')({
                        ...EMPTY_PATENT_FORM,
                        name,
                        rightType: matched ? matched.value : 'patent',
                        applicationNo: cell(row, idx.applicationNo),
                        applicationDate: cell(row, idx.applicationDate),
                        registrationNo: cell(row, idx.registrationNo),
                        registrationDate: cell(row, idx.registrationDate),
                        paidThroughYear: Number.isNaN(paidRaw) ? EMPTY_PATENT_FORM.paidThroughYear : paidRaw,
                        annuityFee: num(cell(row, idx.annuityFee)),
                        agent: cell(row, idx.agent),
                        alertDays: cell(row, idx.alertDays),
                        manager: cell(row, idx.manager),
                        docLink: cell(row, idx.docLink),
                        memo: cell(row, idx.memo),
                    });
                    imported++;
                }
                return imported;
            };

            const handleDownloadOpsReport = () => {
                const today = new Date().toISOString().slice(0, 10);
                const withDDay = records
                    .map(r => ({ r, dDay: diffDaysFromToday(r.actionDate) }))
                    .filter(x => x.dDay !== null);
                const soon = withDDay.filter(x => x.dDay >= 0 && x.dDay <= 180).sort((a, b) => a.dDay - b.dDay);
                const past = withDDay.filter(x => x.dDay < 0).sort((a, b) => a.dDay - b.dDay);
                const annuity12m = withDDay
                    .filter(x => x.r.kind === 'patent' && x.dDay >= 0 && x.dDay <= 365)
                    .reduce((a, x) => a + num(x.r.cost), 0);

                downloadCSV([
                    ['리포트일자', today],
                    ['보유 인증서', `${certs.length}`],
                    ['보유 산업재산권', `${patents.length}`],
                    ['알림 단계', alertStages.join(' / ') + '일'],
                    ['향후 1년 예상 연차료(원)', `${annuity12m}`],
                    [],
                    ['기한 경과', '구분', '기한', '기한종류', '경과일', '담당자'],
                    ...past.map(x => [x.r.title, x.r.badge, x.r.actionDate || '-', x.r.actionLabel, `${Math.abs(x.dDay)}일`, x.r.manager || '-']),
                    [],
                    ['대응 필요 (D-180)', '구분', '기한', '기한종류', '남은일수', '담당자'],
                    ...soon.map(x => [x.r.title, x.r.badge, x.r.actionDate || '-', x.r.actionLabel, `D-${x.dDay}`, x.r.manager || '-']),
                ], `certification_report_${today}.csv`);
            };

            if ((!services || !user) && !isDemoMode) {
                if (errorMsg) return (
                    <div className="h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded shadow text-center">
                            <p className="text-red-500 mb-4">{errorMsg}</p>
                            <button onClick={() => setIsDemoMode(true)} className="bg-blue-600 text-white px-4 py-2 rounded font-bold">데모 모드로 시작</button>
                            <button onClick={() => window.location.reload()} className="ml-2 bg-gray-200 px-4 py-2 rounded">다시 연결</button>
                        </div>
                    </div>
                );
                return <div className="h-screen flex items-center justify-center"><div className="spinner"></div></div>;
            }

            return (
                <div className="flex h-screen overflow-hidden bg-[#f3f4f6] flex-col">
                    {isDemoMode && <SetupBanner />}
                    {renewTarget && <RenewCertModal cert={renewTarget} onClose={() => setRenewTarget(null)} onSubmit={handleRenewCert} />}
                    {payTarget && <PayAnnuityModal patent={payTarget} onClose={() => setPayTarget(null)} onSubmit={handlePayAnnuity} />}
                    <div className="flex flex-1 overflow-hidden">
                        <aside className="w-64 bg-slate-900 text-white hidden md:flex flex-col shadow-2xl z-20">
                            <div className="p-6 border-b border-slate-800 font-bold text-blue-400 text-xl tracking-tight">인증·특허</div>
                            <nav className="flex-1 p-4 space-y-5 overflow-y-auto custom-scroll">
                                {NAV_GROUPS.map(group => (
                                    <div key={group.title} className={group.title === '관리' ? 'pt-4 border-t border-slate-800' : ''}>
                                        <p className="px-3 mb-2 text-[11px] font-bold tracking-wider text-slate-400 uppercase">{group.title}</p>
                                        <div className="space-y-2">
                                            {group.items.map(item => (
                                                <NavButton key={item.id} active={activeTab === item.id}
                                                    onClick={() => setActiveTab(item.id)} icon={<item.Icon />} label={item.label} />
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </nav>
                        </aside>

                        <main className="flex-1 overflow-y-auto p-4 pb-24 md:p-8 md:pb-8 relative custom-scroll">
                            {loading ? <div className="flex justify-center mt-20"><div className="spinner"></div></div> : (
                                <div className="max-w-7xl mx-auto">
                                    {activeTab === 'dashboard' && <DashboardPage records={records} patents={patents} alertStages={alertStages} onDownloadReport={handleDownloadOpsReport} onGoAlerts={() => setActiveTab('alerts')} />}
                                    {activeTab === 'alerts' && <AlertCenterPage records={records} alertStages={alertStages} onAck={handleAck} onUnack={handleUnack} />}
                                    {activeTab === 'schedule' && <SchedulePage records={records} />}
                                    {activeTab === 'certs' && <CertManagement certs={certs} onAdd={handleAdd('cert')} onUpdate={handleUpdate('cert')} onDelete={handleDelete('cert')} onRenew={setRenewTarget} alertStages={alertStages} />}
                                    {activeTab === 'patents' && <PatentManagement patents={patents} onAdd={handleAdd('patent')} onUpdate={handleUpdate('patent')} onDelete={handleDelete('patent')} onPay={setPayTarget} alertStages={alertStages} />}
                                    {activeTab === 'issuers' && <IssuerPage records={records} />}
                                    {activeTab === 'audit' && <AuditLogPage auditLogs={auditLogs} />}
                                    {activeTab === 'settings' && <SettingsPage isDemoMode={isDemoMode} alertStages={alertStages} onSaveStages={handleSaveStages} onImportCsv={handleImportCsv} />}
                                </div>
                            )}
                        </main>
                    </div>

                    {/* 모바일에서는 사이드바 대신 하단 내비를 쓴다 (다른 앱들과 동일한 패턴) */}
                    <nav className="md:hidden fixed bottom-0 inset-x-0 z-50 flex justify-around bg-white/95 backdrop-blur border-t border-slate-200 px-1 py-2 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]">
                        {NAV_ITEMS.map(item => (
                            <button key={item.id} onClick={() => setActiveTab(item.id)}
                                className={`flex flex-col items-center gap-1 px-2 py-1 rounded transition-colors ${activeTab === item.id ? 'text-blue-600' : 'text-slate-400'}`}>
                                <item.Icon />
                                <span className="text-[10px] font-medium leading-none">{item.short}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
